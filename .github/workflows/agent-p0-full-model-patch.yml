name: Agent P0 Full Model Patch

on:
  push:
    branches:
      - agent/p0-patcher-run
    paths:
      - .github/workflows/agent-p0-full-model-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iedsim-full-scl-live-store
          fetch-depth: 0
      - name: Apply P0 patch to PR branch
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/agent_p0_patch_launcher.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace("source = source[:tail] + r'''#", 'source = source[:tail] + r\"\"\"#', 1)
          text = text.replace("\n'''\n\nexec(compile(source, \"agent_p0_full_model_patch.py\", \"exec\")", "\n\"\"\"\n\nexec(compile(source, \"agent_p0_full_model_patch.py\", \"exec\")", 1)
          p.write_text(text, encoding='utf-8')
          PY
          python3 tools/agent_p0_patch_launcher.py 2>&1 | tee p0-patch.log
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-patch-diagnostics
          path: p0-patch.log
      - name: Commit P0 implementation
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ied_simulator/src/SclMmsMaterializer.hpp \
                  apps/ied_simulator/src/IedSimulatorController.cpp \
                  tools/static_ied_server.cpp \
                  tests/fixtures/scl/iedsim-full-model.scd \
                  apps/ied_simulator/test_gui_live_value.py
          git diff --cached --check
          git commit -m "feat(iedsim): complete P0 SCL MMS model projection"
          git push origin HEAD:agent/iedsim-full-scl-live-store
