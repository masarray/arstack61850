name: Agent P0 Clang Fix

on:
  push:
    branches:
      - agent/p0-patcher-run
    paths:
      - .github/workflows/agent-p0-full-model-patch.yml

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iedsim-full-scl-live-store
          fetch-depth: 0
      - name: Apply clang-safe ordered tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/static_ied_server.cpp')
          s = p.read_text(encoding='utf-8')

          needle = '    std::vector<std::pair<std::string, ManifestTypeNode>> children;\n'
          replacement = (
              '    std::vector<std::string> child_names;\n'
              '    std::vector<ManifestTypeNode> children;\n'
          )
          if s.count(needle) != 1:
              raise SystemExit(f'children declaration matches={s.count(needle)}')
          s = s.replace(needle, replacement, 1)

          start = s.index('[[nodiscard]] ManifestTypeNode& manifest_child(')
          end = s.index('\n\nstruct ManifestDataSetStorage final', start)
          s = s[:start] + '''[[nodiscard]] ManifestTypeNode& manifest_child(
              ManifestTypeNode& node, const std::string& name) {
              for (std::size_t index = 0U; index < node.child_names.size(); ++index) {
                  if (node.child_names[index] == name) return node.children[index];
              }
              node.child_names.push_back(name);
              node.children.emplace_back();
              return node.children.back();
          }''' + s[end:]

          old = '''    result.children.reserve(node.children.size());
              for (const auto& [child_name, child] : node.children) {
                  result.children.push_back(node_type(child, model, child_name));
              }'''
          new = '''    result.children.reserve(node.children.size());
              for (std::size_t index = 0U; index < node.children.size(); ++index) {
                  result.children.push_back(
                      node_type(node.children[index], model, node.child_names[index]));
              }'''
          if s.count(old) != 1:
              raise SystemExit(f'node_type matches={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''    std::vector<mms::MmsDataValue> children;
              children.reserve(node.children.size());
              for (const auto& [name, child] : node.children) {
                  static_cast<void>(name);
                  children.push_back(node_data(child, model));
              }'''
          new = '''    std::vector<mms::MmsDataValue> children;
              children.reserve(node.children.size());
              for (const auto& child : node.children) {
                  children.push_back(node_data(child, model));
              }'''
          if s.count(old) != 1:
              raise SystemExit(f'node_data matches={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
      - name: Configure clang parity
        env:
          CC: clang
          CXX: clang++
        run: cmake -S tools/static_ied_server_iedsim -B build-clang -DCMAKE_BUILD_TYPE=Release
      - name: Build and test clang parity
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake --build build-clang --parallel 2
          ctest --test-dir build-clang --output-on-failure
      - name: Commit fix to PR branch
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/static_ied_server.cpp
          git commit -m "fix(iedsim): keep ordered MMS tree clang-portable"
          git push origin HEAD:agent/iedsim-full-scl-live-store
