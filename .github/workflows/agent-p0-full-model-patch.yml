name: Agent P0 Full Model Patch

on:
  push:
    branches:
      - agent/p0-patcher-run
    paths:
      - .github/workflows/agent-p0-full-model-patch.yml

permissions:
  contents: read

jobs:
  validate-p0:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iedsim-full-scl-live-store
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
      - name: Configure
        run: cmake -S apps/ied_simulator -B build-p0 -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build simulator and read probe
        run: cmake --build build-p0 --target arstack_ied_simulator ariec61850_mms_read_probe --parallel 2
      - name: QML smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-p0/arstack_ied_simulator --smoke-test
      - name: P0 full structural model gate
        run: >-
          python3 apps/ied_simulator/test_gui_live_value.py
          --app ./build-p0/arstack_ied_simulator
          --read-probe ./build-p0
          --scl ./tests/fixtures/scl/iedsim-full-model.scd
