name: Agent P0 Clang Diagnostic

on:
  push:
    branches:
      - agent/p0-patcher-run
    paths:
      - .github/workflows/agent-p0-full-model-patch.yml

permissions:
  contents: read

jobs:
  clang-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iedsim-full-scl-live-store
      - name: Configure clang
        env:
          CC: clang
          CXX: clang++
        run: cmake -S tools/static_ied_server_iedsim -B build-iedscout-parity -DCMAKE_BUILD_TYPE=Release
      - name: Build with diagnostics
        env:
          CC: clang
          CXX: clang++
        shell: bash
        run: |
          set -o pipefail
          cmake --build build-iedscout-parity --parallel 2 2>&1 | tee clang-build.log
      - name: Upload clang diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-clang-build-log
          path: clang-build.log
