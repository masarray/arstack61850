name: Agent P0 Full Model Patch

on:
  push:
    branches:
      - agent/p0-patcher-run
    paths:
      - .github/workflows/agent-p0-full-model-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/iedsim-full-scl-live-store
          fetch-depth: 0
      - name: Apply P0 compile corrections
        run: python3 tools/agent_p0_compile_fix.py
      - name: Commit corrections to PR branch
        run: |
          git config user.name "openai-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ied_simulator/src/SclMmsMaterializer.hpp \
                  apps/ied_simulator/src/IedSimulatorController.cpp
          git diff --cached --check
          git commit -m "fix(iedsim): correct P0 materializer projection"
          git push origin HEAD:agent/iedsim-full-scl-live-store
