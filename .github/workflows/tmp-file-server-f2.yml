name: Temporary real MMS file-server backend F2

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation

permissions:
  contents: write

jobs:
  f2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wire sandboxed file backend into server and client tooling
        shell: python
        run: |
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 marker, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          server = 'tools/static_ied_server.cpp'
          one(server,
              '#include "ariec61850/osi/tpkt.hpp"\n',
              '#include "ariec61850/osi/tpkt.hpp"\n#include "static_file_service_backend.hpp"\n')
          one(server,
              'namespace wire = ar::iec61850::wire;\n',
              'namespace wire = ar::iec61850::wire;\nnamespace filehost = ar::iec61850::host;\n')
          one(server,
              '''    std::string model_manifest;\n    std::uint16_t port{102U};\n''',
              '''    std::string model_manifest;\n    std::string file_root;\n    std::uint16_t port{102U};\n''')
          one(server,
              '''    std::uint64_t live_generation{};\n    bool live_stdin{};\n''',
              '''    std::uint64_t live_generation{};\n    bool live_stdin{};\n    bool allow_file_delete{};\n''')
          one(server,
              '''        << "  --model-manifest PATH     Host model manifest emitted by the Qt simulator.\\n"\n        << "  --live-stdin              Accept bounded ARSTACK_LIVE updates on stdin.\\n"\n''',
              '''        << "  --model-manifest PATH     Host model manifest emitted by the Qt simulator.\\n"\n        << "  --file-root PATH          Sandboxed MMS FileDirectory/Open/Read/Close root.\\n"\n        << "  --allow-file-delete       Explicitly enable MMS FileDelete below --file-root.\\n"\n        << "  --live-stdin              Accept bounded ARSTACK_LIVE updates on stdin.\\n"\n''')
          one(server,
              '''        if (option == "--live-stdin") {\n            options.live_stdin = true;\n            continue;\n        }\n''',
              '''        if (option == "--live-stdin") {\n            options.live_stdin = true;\n            continue;\n        }\n        if (option == "--allow-file-delete") {\n            options.allow_file_delete = true;\n            continue;\n        }\n''')
          one(server,
              '''        if (option == "--host" || option == "--model-manifest" ||\n            option == "--port" || option == "--digital-input-mask" ||\n''',
              '''        if (option == "--host" || option == "--model-manifest" ||\n            option == "--file-root" || option == "--port" || option == "--digital-input-mask" ||\n''')
          one(server,
              '''            if (option == "--host") {\n                options.bind_address = value;\n            } else if (option == "--model-manifest") {\n                options.model_manifest = value;\n            } else if (option == "--port") {\n''',
              '''            if (option == "--host") {\n                options.bind_address = value;\n            } else if (option == "--model-manifest") {\n                options.model_manifest = value;\n            } else if (option == "--file-root") {\n                options.file_root = value;\n            } else if (option == "--port") {\n''')
          one(server,
              '''    if (options.live_stdin && options.live_generation == 0U) {\n        throw std::invalid_argument("--live-stdin requires --live-generation.");\n    }\n    return options;\n''',
              '''    if (options.live_stdin && options.live_generation == 0U) {\n        throw std::invalid_argument("--live-stdin requires --live-generation.");\n    }\n    if (options.allow_file_delete && options.file_root.empty()) {\n        throw std::invalid_argument("--allow-file-delete requires --file-root.");\n    }\n    return options;\n''')
          one(server,
              '''    LiveUpdateBus* const live_updates,\n    std::uint64_t live_sequence,\n    const std::uint64_t association_id,\n''',
              '''    LiveUpdateBus* const live_updates,\n    std::uint64_t live_sequence,\n    filehost::StaticFileServiceRoot* const file_root,\n    const std::uint64_t association_id,\n''')
          one(server,
              '''    std::unique_ptr<mms::MmsStaticObjectTable> direct_control_table;\n\n    mms::MmsStaticDispatchPolicy dispatch_policy;\n''',
              '''    std::unique_ptr<mms::MmsStaticObjectTable> direct_control_table;\n    std::unique_ptr<filehost::StaticFileServiceSession> file_session;\n\n    mms::MmsStaticDispatchPolicy dispatch_policy;\n''')
          one(server,
              '''    for (std::size_t index = 0U; index < policy.owner_size; ++index) {\n        const auto shift = static_cast<unsigned>((policy.owner_size - 1U - index) * 8U);\n        policy.owner[index] = static_cast<std::uint8_t>(\n            (association_id >> shift) & 0xFFU);\n    }\n\n    mms::MmsStaticConnectionRuntime runtime{dispatcher, policy};\n''',
              '''    for (std::size_t index = 0U; index < policy.owner_size; ++index) {\n        const auto shift = static_cast<unsigned>((policy.owner_size - 1U - index) * 8U);\n        policy.owner[index] = static_cast<std::uint8_t>(\n            (association_id >> shift) & 0xFFU);\n    }\n    if (file_root != nullptr) {\n        file_session = std::make_unique<filehost::StaticFileServiceSession>(*file_root);\n        policy.confirmed_service = &filehost::StaticFileServiceSession::callback;\n        policy.confirmed_service_context = file_session.get();\n    }\n\n    mms::MmsStaticConnectionRuntime runtime{dispatcher, policy};\n''')
          one(server,
              '''        const auto listener = create_listener(options.bind_address, options.port);\n''',
              '''        std::unique_ptr<filehost::StaticFileServiceRoot> file_root;\n        if (!options.file_root.empty()) {\n            file_root = std::make_unique<filehost::StaticFileServiceRoot>(\n                std::filesystem::path{options.file_root}, options.allow_file_delete);\n        }\n\n        const auto listener = create_listener(options.bind_address, options.port);\n''')
          one(server,
              '''            << " max_active=" << options.maximum_active_connections\n            << " profile=iedscout" << '\\n';\n''',
              '''            << " max_active=" << options.maximum_active_connections\n            << " files=" << (file_root ? "enabled" : "disabled")\n            << " file_delete=" << (options.allow_file_delete ? "enabled" : "disabled")\n            << " profile=iedscout" << '\\n';\n''')
          one(server,
              '''                &object_table,\n                &data_sets,\n                client,\n''',
              '''                &object_table,\n                &data_sets,\n                &file_root,\n                client,\n''')
          one(server,
              '''                            options.live_stdin ? &live_updates : nullptr,\n                            live_sequence,\n                            association_id,\n''',
              '''                            options.live_stdin ? &live_updates : nullptr,\n                            live_sequence,\n                            file_root.get(),\n                            association_id,\n''')
          one(server,
              '''                            nullptr,\n                            0U,\n                            association_id,\n''',
              '''                            nullptr,\n                            0U,\n                            file_root.get(),\n                            association_id,\n''')

          client = 'tools/file_transfer.cpp'
          one(client,
              'enum class Command : std::uint8_t { list, download };\n',
              'enum class Command : std::uint8_t { list, download, remove };\n')
          one(client,
              '''        << "  ariec61850_file_transfer <host> [port] download --remote PATH --output FILE [options]\\n\\n"\n''',
              '''        << "  ariec61850_file_transfer <host> [port] download --remote PATH --output FILE [options]\\n"\n        << "  ariec61850_file_transfer <host> [port] delete --remote PATH [options]\\n\\n"\n''')
          one(client,
              '''        << "Download options:\\n"\n''',
              '''        << "Download/delete options:\\n"\n''')
          one(client,
              '''        << "The default command is read-only FileDirectory. Download must be explicit;\\n"\n        << "this tool never uploads, deletes, renames, or mutates remote files.\\n";\n''',
              '''        << "The default command is read-only FileDirectory. Download and FileDelete\\n"\n        << "must be explicit; this tool never uploads or renames remote files.\\n";\n''')
          one(client,
              '''    if (index < argc && std::string_view{argv[index]} != "list" &&\n        std::string_view{argv[index]} != "download" &&\n''',
              '''    if (index < argc && std::string_view{argv[index]} != "list" &&\n        std::string_view{argv[index]} != "download" &&\n        std::string_view{argv[index]} != "delete" &&\n''')
          one(client,
              '''    } else if (index < argc && std::string_view{argv[index]} == "download") {\n        options.command = Command::download;\n        ++index;\n    }\n''',
              '''    } else if (index < argc && std::string_view{argv[index]} == "download") {\n        options.command = Command::download;\n        ++index;\n    } else if (index < argc && std::string_view{argv[index]} == "delete") {\n        options.command = Command::remove;\n        ++index;\n    }\n''')
          one(client,
              '''    if (options.command == Command::download &&\n        (options.remote_path.empty() || options.output_path.empty())) {\n        throw std::invalid_argument(\n            "download requires both --remote PATH and --output FILE.");\n    }\n    return options;\n''',
              '''    if (options.command == Command::download &&\n        (options.remote_path.empty() || options.output_path.empty())) {\n        throw std::invalid_argument(\n            "download requires both --remote PATH and --output FILE.");\n    }\n    if (options.command == Command::remove && options.remote_path.empty()) {\n        throw std::invalid_argument("delete requires --remote PATH.");\n    }\n    return options;\n''')
          marker = '''void emit_json(const std::string& json, const Options& options) {\n'''
          delete_json = '''[[nodiscard]] std::string delete_json(\n    const mms::MmsFileDeleteResult& result) {\n    std::ostringstream output;\n    output << "{\\\"schemaVersion\\\":\\\"ariec61850-mms-file-delete-v1\\\","\n           << "\\\"destructive\\\":true,\\\"success\\\":"\n           << (result.success ? "true" : "false") << ','\n           << "\\\"remotePath\\\":\\\"" << json_escape(result.remote_path) << "\\\","\n           << "\\\"message\\\":\\\"" << json_escape(result.message) << "\\\"}";\n    return output.str();\n}\n\n'''
          one(client, marker, delete_json + marker)
          one(client,
              '''        } else {\n            FileSink sink{options.output_path};\n            ConsoleProgress progress;\n            mms::MmsFileTransferOptions transfer_options;\n            transfer_options.maximum_bytes = options.maximum_bytes;\n            transfer_options.maximum_read_operations = options.maximum_reads;\n            transfer_options.maximum_block_bytes = options.maximum_block_bytes;\n            transfer_options.require_declared_size_match = true;\n            const auto result = runtime.download_adaptive(\n                options.remote_path, sink, transfer_options, &progress);\n            const auto json = transfer_json(result);\n            emit_json(json, options);\n            if (!options.json) std::cout << result.message << '\\n';\n            if (!result.success) result_code = exit_code(result.failure_kind);\n        }\n''',
              '''        } else if (options.command == Command::download) {\n            FileSink sink{options.output_path};\n            ConsoleProgress progress;\n            mms::MmsFileTransferOptions transfer_options;\n            transfer_options.maximum_bytes = options.maximum_bytes;\n            transfer_options.maximum_read_operations = options.maximum_reads;\n            transfer_options.maximum_block_bytes = options.maximum_block_bytes;\n            transfer_options.require_declared_size_match = true;\n            const auto result = runtime.download_adaptive(\n                options.remote_path, sink, transfer_options, &progress);\n            const auto json = transfer_json(result);\n            emit_json(json, options);\n            if (!options.json) std::cout << result.message << '\\n';\n            if (!result.success) result_code = exit_code(result.failure_kind);\n        } else {\n            const auto result = runtime.remove(options.remote_path);\n            emit_json(delete_json(result), options);\n            if (!options.json) std::cout << result.message << '\\n';\n            if (!result.success) result_code = exit_code(result.failure_kind);\n        }\n''')

          cmake = Path('tools/static_ied_server_iedsim/CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          addition = '''\nadd_executable(ariec61850_iedscout_parity_file_transfer\n    "${ARSTACK_ROOT}/tools/file_transfer.cpp")\ntarget_link_libraries(ariec61850_iedscout_parity_file_transfer PRIVATE ARIEC61850::core)\ntarget_compile_features(ariec61850_iedscout_parity_file_transfer PRIVATE cxx_std_20)\nparity_strict_warnings(ariec61850_iedscout_parity_file_transfer)\n\nadd_executable(ariec61850_iedscout_host_file_service_test\n    "${ARSTACK_ROOT}/tools/static_file_service_backend_test.cpp")\ntarget_link_libraries(ariec61850_iedscout_host_file_service_test PRIVATE ARIEC61850::core)\ntarget_compile_features(ariec61850_iedscout_host_file_service_test PRIVATE cxx_std_20)\nparity_strict_warnings(ariec61850_iedscout_host_file_service_test)\n\nadd_test(NAME iedscout_host_file_service\n    COMMAND ariec61850_iedscout_host_file_service_test)\nadd_test(\n    NAME iedscout_file_service_loopback\n    COMMAND\n        ${Python3_EXECUTABLE}\n        "${CMAKE_CURRENT_LIST_DIR}/test_file_service.py"\n        --server $<TARGET_FILE:ariec61850_static_ied_server_iedsim>\n        --client $<TARGET_FILE:ariec61850_iedscout_parity_file_transfer>)\n'''
          if 'iedscout_file_service_loopback' in text:
              raise SystemExit('file-service CMake tests already present')
          cmake.write_text(text + addition, encoding='utf-8')

      - name: Build and run host backend regression
        run: |
          cmake -S tools/static_ied_server_iedsim -B build-file-server
          cmake --build build-file-server -j2
          ctest --test-dir build-file-server --output-on-failure -R 'iedscout_(host_file_service|file_service_loopback)'

      - name: Run retained parity regressions
        run: |
          ctest --test-dir build-file-server --output-on-failure

      - name: Commit F2 and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-file-server-f2.yml
          git add tools/static_file_service_backend.hpp \
                  tools/static_file_service_backend_test.cpp \
                  tools/static_ied_server.cpp tools/file_transfer.cpp \
                  tools/static_ied_server_iedsim/CMakeLists.txt \
                  tools/static_ied_server_iedsim/test_file_service.py
          git commit -m "feat(mms): serve sandboxed MMS files with delete parity"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
