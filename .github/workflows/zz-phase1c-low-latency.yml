name: Phase1C Low Latency MMS Gate

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation
    paths:
      - 'scripts/phase1c_low_latency_patch.py'
      - '.github/workflows/zz-phase1c-low-latency.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0

      - name: Apply low-latency socket and timing gate
        run: python3 scripts/phase1c_low_latency_patch.py

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure IED Simulator
        run: >-
          cmake -S apps/ied_simulator -B build-ied-simulator-qt -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build IED Simulator low-latency acceptance targets
        run: >-
          cmake --build build-ied-simulator-qt
          --target arstack_ied_simulator ariec61850_ied_simulator_server ariec61850_mms_read_probe ariec61850_mms_urcb_gi_probe ariec61850_mms_brcb_event_probe ariec61850_control_interop_probe
          --parallel 2

      - name: Run real socket low-latency integration gate
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          python3 apps/ied_simulator/test_gui_live_value.py
          --app ./build-ied-simulator-qt/arstack_ied_simulator
          --read-probe ./build-ied-simulator-qt
          --scl ./tests/fixtures/scl/minimal-station-brcb.scd

      - name: Configure portable core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DARIEC61850_WARNINGS_AS_ERRORS=ON

      - name: Build portable core
        run: cmake --build build --parallel 2

      - name: Run full portable regression
        run: ctest --test-dir build --output-on-failure

      - name: Commit phase1c after green gate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/zz-phase1c-low-latency.yml scripts/phase1c_low_latency_patch.py
          git add tools/static_ied_server.cpp apps/ied_simulator/test_gui_live_value.py
          git commit -m "perf(mms): enable verified low-latency server sockets"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
