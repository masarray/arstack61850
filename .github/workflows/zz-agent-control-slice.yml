name: Agent SBO Enhanced Control Slice

on:
  push:
    branches:
      - feat/complete-ariec61850-simulator-parity
    paths:
      - '.github/workflows/zz-agent-control-slice.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-ariec61850-simulator-parity
          fetch-depth: 0

      - name: Normalize previous configured-control source
        run: python3 scripts/agent_fix_control_slice_source.py

      - name: Apply SBO and enhanced control slice
        run: python3 scripts/agent_apply_sbo_enhanced_slice.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Configure root regression build
        run: >-
          cmake -S . -B build-control-slice -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DARIEC61850_BUILD_TESTS=ON
          -DARIEC61850_BUILD_TOOLS=ON

      - name: Build root focused targets
        run: >-
          cmake --build build-control-slice
          --target ariec61850_scl_tests ariec61850_static_ied_server ariec61850_control_interop_probe
          --parallel 2

      - name: Run SCL regression
        run: ./build-control-slice/ariec61850_scl_tests

      - name: Configure static-control regression profile
        run: >-
          cmake -S tools/mms_direct_control_server -B build-direct-control -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build and run static-control regression
        run: |
          cmake --build build-direct-control --target ariec61850_mms_direct_control_tests --parallel 2
          ctest --test-dir build-direct-control --output-on-failure

      - name: Commit validated source slice
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/ied_simulator/src/IedSimulatorController.cpp \
            apps/ied_simulator/test_gui_live_value.py \
            tests/fixtures/scl/minimal-station-brcb.scd \
            tests/test_scl.cpp \
            tests/test_mms_static_direct_control.cpp \
            tools/static_ied_server.cpp
          git commit -m 'feat(simulator): add SBO and enhanced command controls'
          git push origin HEAD:feat/complete-ariec61850-simulator-parity
