name: Agent Configured Control Slice

on:
  push:
    branches:
      - feat/complete-ariec61850-simulator-parity
    paths:
      - '.github/workflows/zz-agent-control-slice.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-ariec61850-simulator-parity
          fetch-depth: 0

      - name: Adjust patch driver anchors
        run: python3 scripts/agent_apply_control_slice_fix.py

      - name: Apply configured Direct-Normal vertical slice
        run: python3 scripts/agent_apply_control_slice.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Configure root regression build
        run: >-
          cmake -S . -B build-control-slice -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DARIEC61850_BUILD_TESTS=ON
          -DARIEC61850_BUILD_TOOLS=ON

      - name: Build focused targets
        run: >-
          cmake --build build-control-slice
          --target ariec61850_scl_tests ariec61850_static_ied_server ariec61850_control_interop_probe
          --parallel 2

      - name: Run SCL regression
        run: ./build-control-slice/ariec61850_scl_tests

      - name: Commit validated slice
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            include/ariec61850/scl/model.hpp \
            src/scl/parser_part_03_01.inc \
            src/scl/parser_part_05_00.inc \
            tests/fixtures/scl/minimal-station-brcb.scd \
            tests/test_scl.cpp \
            apps/ied_simulator/src/IedSimulatorController.cpp \
            apps/ied_simulator/CMakeLists.txt \
            apps/ied_simulator/test_gui_live_value.py \
            tools/static_ied_server.cpp \
            tools/control_interop_probe/CMakeLists.txt \
            CMakeLists.txt \
            .github/workflows/ied-simulator-qt.yml
          git commit -m 'feat(simulator): wire SCL Direct-Normal control'
          git push origin HEAD:feat/complete-ariec61850-simulator-parity
