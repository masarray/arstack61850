name: Temporary URCB event wiring

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0

      - name: Apply bounded URCB event wiring
        shell: python
        run: |
          from pathlib import Path
          from textwrap import dedent

          path = Path('tools/static_ied_server.cpp')
          text = path.read_text(encoding='utf-8')

          old_limit = 'constexpr std::size_t kMaximumSimulatorBrcbs = 16U;'
          new_limit = 'constexpr std::size_t kMaximumSimulatorBrcbs = 64U;'
          if old_limit in text:
              text = text.replace(old_limit, new_limit, 1)
          elif new_limit not in text:
              raise SystemExit('BRCB capacity marker not found')

          marker = '[[nodiscard]] mms::MmsStaticBrcbEventReason brcb_event_reason('
          helper = dedent(r'''
          [[nodiscard]] mms::MmsStaticUrcbEventReason urcb_event_reason(
              const ManifestValue& value) noexcept {
              return value.normalized_type == "Quality" || value.item.ends_with("$q")
                  ? mms::MmsStaticUrcbEventReason::quality_change
                  : mms::MmsStaticUrcbEventReason::data_change;
          }

          void notify_urcb_changes(
              const ManifestModel& model,
              const std::span<const std::size_t> changed_value_indices,
              mms::MmsStaticUrcbRuntime& urcbs,
              const mms::MmsStaticDataSetTable& data_sets,
              const std::uint64_t now_ms) {
              for (const auto value_index : changed_value_indices) {
                  if (value_index >= model.values.size()) continue;
                  const auto& value = model.values[value_index];
                  const auto reason = urcb_event_reason(value);
                  for (std::size_t rcb_index = 0U; rcb_index < urcbs.size(); ++rcb_index) {
                      const auto* definition = urcbs.definition(rcb_index);
                      if (definition == nullptr) continue;
                      const auto* data_set = find_data_set(
                          data_sets, definition->data_set_domain, definition->data_set_item);
                      if (data_set == nullptr) continue;
                      for (std::size_t member_index = 0U;
                           member_index < data_set->members.size();
                           ++member_index) {
                          const auto& member = data_set->members[member_index];
                          const auto member_matches_value =
                              member.domain == value.domain &&
                              (member.item == value.item ||
                               (value.item.size() > member.item.size() &&
                                value.item.compare(0U, member.item.size(), member.item) == 0 &&
                                value.item[member.item.size()] == '$'));
                          if (!member_matches_value) continue;
                          const auto status = urcbs.notify(
                              rcb_index, member_index, reason, now_ms);
                          if (status != mms::MmsStaticUrcbStatus::ok &&
                              status != mms::MmsStaticUrcbStatus::temporarily_unavailable) {
                              std::osyncstream{std::cerr}
                                  << "IEDSIM_EVENT kind=urcb_notify_error rcb="
                                  << definition->item
                                  << " status=" << static_cast<unsigned>(status) << '\n';
                          }
                          break;
                      }
                  }
              }
          }

          ''')
          if 'void notify_urcb_changes(' not in text:
              position = text.find(marker)
              if position < 0:
                  raise SystemExit('brcb_event_reason marker not found')
              text = text[:position] + helper + text[position:]

          old = (
              "                    notify_brcb_changes(\n"
              "                        *manifest_model,\n"
              "                        changed_value_indices,\n"
              "                        brcb_runtimes,\n"
              "                        monotonic_ms());\n"
          )
          new = (
              "                    const auto report_change_ms = monotonic_ms();\n"
              "                    if (urcb_runtime != nullptr) {\n"
              "                        notify_urcb_changes(\n"
              "                            *manifest_model,\n"
              "                            changed_value_indices,\n"
              "                            *urcb_runtime,\n"
              "                            data_sets,\n"
              "                            report_change_ms);\n"
              "                    }\n"
              "                    notify_brcb_changes(\n"
              "                        *manifest_model,\n"
              "                        changed_value_indices,\n"
              "                        brcb_runtimes,\n"
              "                        report_change_ms);\n"
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif 'notify_urcb_changes(' not in text[text.find('if (!changed_value_indices.empty())'):]:
              raise SystemExit('report notification call marker not found')

          path.write_text(text, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/tmp-urcb-event-wiring.yml
          git add tools/static_ied_server.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(sim): route live changes into URCB reporting"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
