name: P0 Remove Duplicate Update Stage

on:
  pull_request:
    paths:
      - 'apps/arstack_studio/**'
      - '.github/scripts/p0_remove_duplicate_update_stage.py'
      - '.github/workflows/p0-remove-duplicate-update-stage.yml'

permissions:
  contents: write

concurrency:
  group: p0-remove-duplicate-update-stage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Remove duplicate private UpdateStage
        run: python3 .github/scripts/p0_remove_duplicate_update_stage.py
      - name: Verify stage declaration invariant
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'enum class UpdateStage {' apps/arstack_studio/src/SmartSessionController.hpp)" -eq 1
          grep -q 'Q_ENUM(UpdateStage)' apps/arstack_studio/src/SmartSessionController.hpp
          grep -q 'firmwareUpdateStage READ firmwareUpdateStage' apps/arstack_studio/src/SmartSessionController.hpp
      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          git add apps/arstack_studio/src/SmartSessionController.hpp
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'ARStack P0 Repair'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(studio): keep one supervisor update stage enum'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
