name: P0 SMV source repair Windows

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1
    paths:
      - '.github/workflows/p0-smv-source-repair-windows.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0
      - name: Apply source repair
        shell: powershell
        run: |
          python .github/scripts/p0_smv_source_repair.py
          if ($LASTEXITCODE -ne 0) { throw "source repair failed: $LASTEXITCODE" }
      - name: Validate source repair
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff check failed: $LASTEXITCODE" }
          Select-String -Path embedded/esp32p4_smv_injector/main/app_main.cpp -Pattern 'kTransportFailureStopThreshold','live_control_force_stop','SV transport fault'
          Select-String -Path embedded/esp32p4_smv_injector/main/ptp_lab_task.cpp,embedded/esp32p4_smv_injector/main/ptp_receiver_task.cpp -Pattern 'disable_hardware_ptp','cleanup timeout'
      - name: Commit source repair
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add embedded/esp32p4_smv_injector/main/app_main.cpp
          git add embedded/esp32p4_smv_injector/main/live_control.cpp
          git add embedded/esp32p4_smv_injector/main/ptp_lab_task.cpp
          git add embedded/esp32p4_smv_injector/main/ptp_receiver_task.cpp
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "cached diff check failed: $LASTEXITCODE" }
          $staged = git diff --cached --name-only
          if (-not $staged) {
            Write-Host 'Source repair already present; nothing to commit.'
            exit 0
          }
          git commit -m 'fix(p0): fail closed SMV transport and restore shared EMAC state'
          if ($LASTEXITCODE -ne 0) { throw "commit failed: $LASTEXITCODE" }
          git pull --rebase origin feature/ptp-production-v0.1.1
          if ($LASTEXITCODE -ne 0) { throw "rebase failed: $LASTEXITCODE" }
          git push origin HEAD:feature/ptp-production-v0.1.1
          if ($LASTEXITCODE -ne 0) { throw "push failed: $LASTEXITCODE" }
