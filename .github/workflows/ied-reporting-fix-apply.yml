name: Apply IEDScout reporting fix

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation
    paths:
      - '.github/workflows/ied-reporting-fix-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0

      - name: Apply evidence-driven reporting patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Production host: MMS Write is a bounded transaction, not a one-variable-only service.
          replace_once(
              'tools/static_ied_server.cpp',
              '    dispatch_policy.maximum_write_variables = 1U;\n',
              '    // IEDScout can configure an RCB and re-enable it in one MMS Write.\n'
              '    // Keep the host transaction bounded to one complete BRCB attribute set.\n'
              '    dispatch_policy.maximum_write_variables = 16U;\n')

          # Preserve BRCB IntgPd from the SCL/manifest model; it was previously dropped.
          replace_once(
              'tools/static_ied_server.cpp',
              '            storage.buffer_time_ms,\n            storage.trigger_options});\n',
              '            storage.buffer_time_ms,\n            storage.trigger_options,\n            storage.integrity_period_ms});\n')

          # BRCB runtime owns mutable trigger configuration per MMS association.
          replace_once(
              'include/ariec61850/mms/static_brcb_runtime.hpp',
              '    [[nodiscard]] MmsStaticBrcbStatus set_enabled(bool enabled) noexcept;\n'
              '    [[nodiscard]] constexpr bool enabled() const noexcept { return enabled_; }\n',
              '    [[nodiscard]] MmsStaticBrcbStatus set_enabled(bool enabled) noexcept;\n'
              '    [[nodiscard]] MmsStaticBrcbStatus set_trigger_options(\n'
              '        std::uint8_t trigger_options) noexcept;\n'
              '    [[nodiscard]] constexpr std::uint8_t trigger_options() const noexcept {\n'
              '        return trigger_options_;\n'
              '    }\n'
              '    [[nodiscard]] constexpr bool enabled() const noexcept { return enabled_; }\n')
          replace_once(
              'include/ariec61850/mms/static_brcb_runtime.hpp',
              '    std::uint8_t sequence_number_{};\n    bool replay_gap_{};\n',
              '    std::uint8_t sequence_number_{};\n'
              '    std::uint8_t trigger_options_{};\n'
              '    bool replay_gap_{};\n')

          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '    sequence_number_ = 0U;\n'
              '    replay_gap_ = false;\n',
              '    sequence_number_ = 0U;\n'
              '    trigger_options_ = definition_->trigger_options;\n'
              '    replay_gap_ = false;\n')
          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '    integrity_armed_ = enabled && period != 0U &&\n'
              '        (definition_->trigger_options & kTriggerIntegrity) != 0U;\n',
              '    integrity_armed_ = enabled && period != 0U &&\n'
              '        (trigger_options_ & kTriggerIntegrity) != 0U;\n')
          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '    return MmsStaticBrcbStatus::ok;\n}\n\nMmsStaticBrcbStatus MmsStaticBrcbRuntime::notify(\n',
              '    return MmsStaticBrcbStatus::ok;\n}\n\n'
              'MmsStaticBrcbStatus MmsStaticBrcbRuntime::set_trigger_options(\n'
              '    const std::uint8_t trigger_options) noexcept {\n'
              '    if (!initialized_ || definition_ == nullptr || pending_ == nullptr) {\n'
              '        return MmsStaticBrcbStatus::invalid_runtime;\n'
              '    }\n'
              '    if ((trigger_options & static_cast<std::uint8_t>(~kAllowedTriggers)) != 0U) {\n'
              '        return MmsStaticBrcbStatus::invalid_definition;\n'
              '    }\n'
              '    if (enabled_) {\n'
              '        return MmsStaticBrcbStatus::temporarily_unavailable;\n'
              '    }\n'
              '    if (trigger_options_ == trigger_options) {\n'
              '        return MmsStaticBrcbStatus::ok;\n'
              '    }\n'
              '    trigger_options_ = trigger_options;\n'
              '    clear_pending(*pending_);\n'
              '    general_interrogation_pending_ = false;\n'
              '    next_integrity_due_ms_ = 0U;\n'
              '    integrity_armed_ = false;\n'
              '    bump_revision(pending_->revision);\n'
              '    bump_revision(schedule_revision_);\n'
              '    return MmsStaticBrcbStatus::ok;\n'
              '}\n\n'
              'MmsStaticBrcbStatus MmsStaticBrcbRuntime::notify(\n')
          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '        (definition_->trigger_options & trigger_mask) == 0U) {\n',
              '        (trigger_options_ & trigger_mask) == 0U) {\n')
          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '    if ((definition_->trigger_options & kTriggerGeneralInterrogation) == 0U) {\n',
              '    if ((trigger_options_ & kTriggerGeneralInterrogation) == 0U) {\n')
          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '        integrity_armed_ = period != 0U && enabled_ &&\n'
              '            (definition_->trigger_options & kTriggerIntegrity) != 0U;\n',
              '        integrity_armed_ = period != 0U && enabled_ &&\n'
              '            (trigger_options_ & kTriggerIntegrity) != 0U;\n')

          # Route BRCB configuration through the association ownership gate.
          replace_once(
              'include/ariec61850/mms/static_brcb_control.hpp',
              '    [[nodiscard]] MmsStaticBrcbControlStatus set_report_enabled(\n'
              '        const MmsStaticBrcbClientIdentity& client,\n'
              '        bool enabled,\n'
              '        std::uint64_t now_ms) noexcept;\n\n',
              '    [[nodiscard]] MmsStaticBrcbControlStatus set_report_enabled(\n'
              '        const MmsStaticBrcbClientIdentity& client,\n'
              '        bool enabled,\n'
              '        std::uint64_t now_ms) noexcept;\n\n'
              '    [[nodiscard]] MmsStaticBrcbControlStatus set_trigger_options(\n'
              '        const MmsStaticBrcbClientIdentity& client,\n'
              '        std::uint8_t trigger_options,\n'
              '        std::uint64_t now_ms) noexcept;\n\n')
          replace_once(
              'src/mms/static_brcb_control.cpp',
              'MmsStaticBrcbControlStatus MmsStaticBrcbControl::request_general_interrogation(\n',
              'MmsStaticBrcbControlStatus MmsStaticBrcbControl::set_trigger_options(\n'
              '    const MmsStaticBrcbClientIdentity& client,\n'
              '    const std::uint8_t trigger_options,\n'
              '    const std::uint64_t now_ms) noexcept {\n'
              '    const auto access = require_control_access(client, now_ms);\n'
              '    if (access != MmsStaticBrcbControlStatus::ok) {\n'
              '        return access;\n'
              '    }\n'
              '    if (reports_->enabled()) {\n'
              '        return MmsStaticBrcbControlStatus::temporarily_unavailable;\n'
              '    }\n'
              '    return map_runtime_status(reports_->set_trigger_options(trigger_options));\n'
              '}\n\n'
              'MmsStaticBrcbControlStatus MmsStaticBrcbControl::request_general_interrogation(\n')

          # Expose TrgOps as a writable BRCB attribute and decode the IEC/MMS BIT STRING exactly.
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    return attribute == MmsStaticBrcbAttribute::report_enabled ||\n'
              '        attribute == MmsStaticBrcbAttribute::general_interrogation ||\n',
              '    return attribute == MmsStaticBrcbAttribute::report_enabled ||\n'
              '        attribute == MmsStaticBrcbAttribute::trigger_options ||\n'
              '        attribute == MmsStaticBrcbAttribute::general_interrogation ||\n')
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    case MmsStaticBrcbAttribute::trigger_options: {\n'
              '        const std::array<std::uint8_t, 1U> trigger{context->definition->trigger_options};\n'
              '        return encode_bit_string(2U, trigger, destination);\n'
              '    }\n',
              '    case MmsStaticBrcbAttribute::trigger_options: {\n'
              '        const std::array<std::uint8_t, 1U> trigger{context->reports->trigger_options()};\n'
              '        return encode_bit_string(2U, trigger, destination);\n'
              '    }\n')
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    value = tlv.value[0] != 0U;\n'
              '    return true;\n'
              '}\n\n'
              '[[nodiscard]] bool decode_nonnegative_integer16(\n',
              '    value = tlv.value[0] != 0U;\n'
              '    return true;\n'
              '}\n\n'
              '[[nodiscard]] bool decode_bit_string(\n'
              '    const std::span<const std::uint8_t> encoded,\n'
              '    const std::uint8_t expected_unused_bits,\n'
              '    const std::size_t expected_bytes,\n'
              '    std::span<const std::uint8_t>& bytes) noexcept {\n'
              '    bytes = {};\n'
              '    asn1::BerTlvView tlv;\n'
              '    if (!asn1::BerSpanReader::try_read_exact(encoded, tlv) ||\n'
              '        tlv.tag_class != asn1::BerClass::context_specific ||\n'
              '        tlv.tag_number != 4 || tlv.constructed ||\n'
              '        tlv.value.size() != expected_bytes + 1U ||\n'
              '        tlv.value[0] != expected_unused_bits) {\n'
              '        return false;\n'
              '    }\n'
              '    bytes = tlv.value.subspan(1U);\n'
              '    if (!bytes.empty() && expected_unused_bits != 0U) {\n'
              '        const auto mask = static_cast<std::uint8_t>((1U << expected_unused_bits) - 1U);\n'
              '        if ((bytes.back() & mask) != 0U) {\n'
              '            bytes = {};\n'
              '            return false;\n'
              '        }\n'
              '    }\n'
              '    return true;\n'
              '}\n\n'
              '[[nodiscard]] bool decode_nonnegative_integer16(\n')
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    case MmsStaticBrcbAttribute::general_interrogation: {\n',
              '    case MmsStaticBrcbAttribute::trigger_options: {\n'
              '        std::span<const std::uint8_t> bytes;\n'
              '        if (!decode_bit_string(encoded_data, 2U, 1U, bytes)) {\n'
              '            return {false, kTypeInconsistent};\n'
              '        }\n'
              '        constexpr std::uint8_t allowed = 0x7CU;\n'
              '        if ((bytes[0] & static_cast<std::uint8_t>(~allowed)) != 0U) {\n'
              '            return {false, kObjectValueInvalid};\n'
              '        }\n'
              '        const auto claim = ensure_claimed(*context, client, now);\n'
              '        if (claim != MmsStaticBrcbControlStatus::ok) {\n'
              '            return map_control_status(claim);\n'
              '        }\n'
              '        return map_control_status(\n'
              '            context->control->set_trigger_options(client, bytes[0], now));\n'
              '    }\n'
              '    case MmsStaticBrcbAttribute::general_interrogation: {\n')
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    case MmsStaticBrcbAttribute::sequence_number:\n'
              '    case MmsStaticBrcbAttribute::trigger_options:\n'
              '    case MmsStaticBrcbAttribute::integrity_period:\n',
              '    case MmsStaticBrcbAttribute::sequence_number:\n'
              '    case MmsStaticBrcbAttribute::integrity_period:\n')

          # Regression: replay the exact IEDScout semantic transaction (TrgOps + RptEna).
          replace_once(
              'embedded/mms_brcb_objects_hard_profile_smoke.cpp',
              'constexpr std::array<std::uint8_t, 3U> kZeroSeconds{0x85U, 0x01U, 0x00U};\n',
              'constexpr std::array<std::uint8_t, 3U> kZeroSeconds{0x85U, 0x01U, 0x00U};\n'
              'constexpr std::array<std::uint8_t, 4U> kTriggerAll{0x84U, 0x02U, 0x02U, 0x7CU};\n')
          replace_once(
              'embedded/mms_brcb_objects_hard_profile_smoke.cpp',
              '[[nodiscard]] std::array<std::uint8_t, 10U> octet_data(\n',
              '[[nodiscard]] bool dispatch_trigger_enable_transaction(\n'
              '    const mms::MmsStaticApplicationDispatcher& dispatcher,\n'
              '    const mms::MmsStaticRequestAccessContext& client,\n'
              '    std::uint8_t& invoke) noexcept {\n'
              '    std::array<std::uint8_t, 62U> request{\n'
              '        0xA0U,0x3CU,0x02U,0x01U,0x00U,0xA5U,0x37U,0xA0U,0x2CU,\n'
              '        0x30U,0x14U,0xA0U,0x12U,0xA1U,0x10U,0x1AU,0x03U,0x4CU,0x44U,0x30U,\n'
              '        0x1AU,0x09U,0x42U,0x31U,0x24U,0x54U,0x72U,0x67U,0x4FU,0x70U,0x73U,\n'
              '        0x30U,0x14U,0xA0U,0x12U,0xA1U,0x10U,0x1AU,0x03U,0x4CU,0x44U,0x30U,\n'
              '        0x1AU,0x09U,0x42U,0x31U,0x24U,0x52U,0x70U,0x74U,0x45U,0x6EU,0x61U,\n'
              '        0xA0U,0x07U,0x84U,0x02U,0x02U,0x7CU,0x83U,0x01U,0xFFU};\n'
              '    request[4] = invoke++;\n'
              '    std::array<std::uint8_t, 128U> response{};\n'
              '    std::array<std::uint8_t, 256U> workspace{};\n'
              '    const auto dispatched = dispatcher.dispatch(request, response, workspace, client);\n'
              '    if (!dispatched.success()) return false;\n'
              '    mms::MmsWriteResponseView decoded;\n'
              '    mms::MmsWriteAccessResultView first;\n'
              '    mms::MmsWriteAccessResultView second;\n'
              '    return mms::MmsServiceSpanCodec::try_decode_write_response(\n'
              '               std::span<const std::uint8_t>{response}.first(dispatched.bytes_written),\n'
              '               decoded) &&\n'
              '        decoded.result_count == 2U && decoded.try_result(0U, first) &&\n'
              '        decoded.try_result(1U, second) && first.success && second.success;\n'
              '}\n\n'
              '[[nodiscard]] std::array<std::uint8_t, 10U> octet_data(\n')
          replace_once(
              'embedded/mms_brcb_objects_hard_profile_smoke.cpp',
              '    const mms::MmsStaticApplicationDispatcher dispatcher{bank.table(), data_set_table};\n',
              '    mms::MmsStaticDispatchPolicy dispatch_policy;\n'
              '    dispatch_policy.maximum_write_variables = 16U;\n'
              '    const mms::MmsStaticApplicationDispatcher dispatcher{\n'
              '        bank.table(), data_set_table, dispatch_policy};\n')
          replace_once(
              'embedded/mms_brcb_objects_hard_profile_smoke.cpp',
              '    if (!dispatch_write(dispatcher, "B1$RptEna", kFalse, a, true, 0U, invoke) ||\n'
              '        reports.enabled()) {\n'
              '        return 11;\n'
              '    }\n\n'
              '    if (!dispatch_write(dispatcher, "B1$ResvTms", kFiveSeconds, a, true, 0U, invoke)) {\n',
              '    if (!dispatch_write(dispatcher, "B1$RptEna", kFalse, a, true, 0U, invoke) ||\n'
              '        reports.enabled()) {\n'
              '        return 11;\n'
              '    }\n\n'
              '    if (!dispatch_trigger_enable_transaction(dispatcher, a, invoke) ||\n'
              '        !reports.enabled() || reports.trigger_options() != 0x7CU) {\n'
              '        return 90;\n'
              '    }\n'
              '    if (!dispatch_write(dispatcher, "B1$RptEna", kFalse, a, true, 0U, invoke) ||\n'
              '        reports.enabled()) {\n'
              '        return 91;\n'
              '    }\n\n'
              '    if (!dispatch_write(dispatcher, "B1$ResvTms", kFiveSeconds, a, true, 0U, invoke)) {\n')

          # Ensure the TrgOps test value is referenced directly as a decoder sanity check.
          replace_once(
              'embedded/mms_brcb_objects_hard_profile_smoke.cpp',
              '    if (!dispatch_trigger_enable_transaction(dispatcher, a, invoke) ||\n',
              '    if (kTriggerAll[3] != 0x7CU ||\n'
              '        !dispatch_trigger_enable_transaction(dispatcher, a, invoke) ||\n')
          PY

      - name: Build and run BRCB hard-profile regression
        run: |
          cmake -S embedded/brcb_hard_profile -B build-brcb-hard
          cmake --build build-brcb-hard --parallel 2
          ctest --test-dir build-brcb-hard --output-on-failure

      - name: Commit verified reporting fix and remove bootstrap workflow
        shell: bash
        run: |
          rm .github/workflows/ied-reporting-fix-apply.yml
          git config user.name "ARStack reporting fix"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix(ied): support IEDScout BRCB trigger transactions"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
