name: ARStack Studio WinGet Manifest

on:
  pull_request:
    paths:
      - 'scripts/generate_winget_manifest.py'
      - 'docs/INSTALL.md'
      - '.github/workflows/arstack-winget-manifest.yml'
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Unique WinGet package version, e.g. 0.2.0'
        required: true
        type: string
      release_tag:
        description: 'Published and verified GitHub stable release tag'
        required: true
        type: string
      installer_type:
        description: 'Match the actual installer technology for that release'
        required: true
        type: choice
        options:
          - inno
          - nullsoft

permissions:
  contents: read

jobs:
  validate-generator:
    name: Validate WinGet manifest generation tool
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python generator
        run: |
          python3 -m py_compile scripts/generate_winget_manifest.py
          python3 scripts/generate_winget_manifest.py --help

  prepare-manifest:
    name: Generate exact verified installer manifests
    needs: validate-generator
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate manifest using published installer SHA-256
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INSTALLER_TYPE: ${{ inputs.installer_type }}
        run: |
          set -euo pipefail
          python3 scripts/generate_winget_manifest.py \
            --version "$PACKAGE_VERSION" \
            --tag "$RELEASE_TAG" \
            --installer-type "$INSTALLER_TYPE"
          grep -R 'InstallerSha256: [0-9A-F]\{64\}' dist/winget

      - uses: actions/upload-artifact@v4
        with:
          name: arstack-studio-winget-manifests
          path: dist/winget/
          if-no-files-found: error
          retention-days: 30
