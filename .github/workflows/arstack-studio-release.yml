name: ARStack Studio Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/arstack_studio/**'
      - 'embedded/esp32p4_smv_injector/**'
      - 'include/ariec61850/**'
      - 'src/**'
      - '.github/workflows/arstack-studio-release.yml'
      - '.github/workflows/esp32p4-smv-injector.yml'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  ARSTACK_VERSION: '0.1.0'
  QT_VERSION: '6.8.4'
  ESPFLASH_VERSION: '4.5.0'
  ESPFLASH_WINDOWS_ZIP_SHA256: '854c82c947c20e7f337f120f0398042ed1760f2269cb0f9be3d2beae3b66fbfb'

jobs:
  firmware:
    uses: ./.github/workflows/esp32p4-smv-injector.yml

  windows-package:
    name: Windows x64 package
    needs: firmware
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version contract
        shell: powershell
        run: |
          $cmake = Get-Content 'apps/arstack_studio/CMakeLists.txt' -Raw
          if ($cmake -notmatch "project\(ARStackStudio VERSION $([regex]::Escape($env:ARSTACK_VERSION)) ") {
            throw "CMake project version does not match ARSTACK_VERSION=$env:ARSTACK_VERSION"
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $expected = "v$env:ARSTACK_VERSION"
            if ($env:GITHUB_REF_NAME -ne $expected) {
              throw "P0 release only accepts tag $expected; got $env:GITHUB_REF_NAME"
            }
          }

      - name: Download verified ESP32-P4 firmware package
        uses: actions/download-artifact@v4
        with:
          name: arstack-esp32p4-smv-firmware
          path: firmware-package

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtserialport'
          cache: true

      - name: Configure native Release build
        shell: powershell
        run: |
          cmake -S apps/arstack_studio -B build-arstack-studio -G "Visual Studio 17 2022" -A x64 `
            -DARIEC61850_WARNINGS_AS_ERRORS=ON

      - name: Build native Release
        shell: powershell
        run: cmake --build build-arstack-studio --config Release --target arstack_studio --parallel

      - name: Stage Qt application
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'dist\ARStack-Studio'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $sourceExe = Join-Path $PWD 'build-arstack-studio\Release\arstack_studio.exe'
          if (-not (Test-Path $sourceExe)) { throw "Release executable missing: $sourceExe" }
          $stageExe = Join-Path $stage 'ARStackStudio.exe'
          Copy-Item $sourceExe $stageExe
          windeployqt --release --qmldir "$PWD\apps\arstack_studio\qml" --compiler-runtime $stageExe
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md, COPYRIGHT.md -Destination $stage
          New-Item -ItemType Directory -Force (Join-Path $stage 'firmware') | Out-Null
          Copy-Item 'firmware-package\*' -Destination (Join-Path $stage 'firmware') -Recurse

      - name: Bundle pinned standalone espflash
        shell: powershell
        run: |
          $url = "https://github.com/esp-rs/espflash/releases/download/v$env:ESPFLASH_VERSION/espflash-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'espflash.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ESPFLASH_WINDOWS_ZIP_SHA256) {
            throw "espflash asset SHA-256 mismatch: $actual"
          }
          $extract = Join-Path $env:RUNNER_TEMP 'espflash'
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem $extract -Filter espflash.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'espflash.exe not found in verified archive' }
          $tools = Join-Path $PWD 'dist\ARStack-Studio\tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item $exe.FullName (Join-Path $tools 'espflash.exe')

          $licenses = Join-Path $PWD 'dist\ARStack-Studio\licenses\espflash'
          New-Item -ItemType Directory -Force $licenses | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/esp-rs/espflash/v$env:ESPFLASH_VERSION/LICENSE-APACHE" -OutFile (Join-Path $licenses 'LICENSE-APACHE')
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/esp-rs/espflash/v$env:ESPFLASH_VERSION/LICENSE-MIT" -OutFile (Join-Path $licenses 'LICENSE-MIT')

      - name: Clean-package software acceptance
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'dist\ARStack-Studio'
          & (Join-Path $stage 'ARStackStudio.exe') --check-reference-template
          if ($LASTEXITCODE -ne 0) { throw 'Packaged reference-template regression failed' }
          & (Join-Path $stage 'tools\espflash.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled espflash failed to execute' }

          $manifestPath = Join-Path $stage 'firmware\firmware-manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 'arstack.studio.firmware.v1') { throw 'Bad firmware manifest schema' }
          if ($manifest.chip -ne 'esp32p4') { throw 'Bad firmware target' }
          if ([int]$manifest.protocol -ne 1) { throw 'Bad firmware protocol' }
          if ([int64]$manifest.flashOffset -ne 0) { throw 'Bad firmware flash offset' }
          $imagePath = Join-Path (Split-Path $manifestPath) $manifest.image
          $actual = (Get-FileHash $imagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.sha256.ToLowerInvariant()) { throw 'Packaged firmware SHA-256 mismatch' }
          Write-Host "Clean package contract: PASS · Qt runtime + firmware + espflash present"

      - name: Build portable ZIP
        shell: powershell
        run: |
          $zip = Join-Path $PWD "dist\ARStack-Studio-$env:ARSTACK_VERSION-win-x64-portable.zip"
          Compress-Archive -Path 'dist\ARStack-Studio\*' -DestinationPath $zip -CompressionLevel Optimal -Force

      - name: Install NSIS
        shell: powershell
        run: choco install nsis -y --no-progress

      - name: Build Windows installer
        shell: powershell
        run: |
          $stage = (Resolve-Path 'dist\ARStack-Studio').Path
          $out = Join-Path $PWD "dist\ARStack-Studio-$env:ARSTACK_VERSION-win-x64-setup.exe"
          $script = (Resolve-Path 'apps\arstack_studio\packaging\ARStackStudio.nsi').Path
          & makensis "/DSOURCE_DIR=$stage" "/DOUTPUT_FILE=$out" "/DAPP_VERSION=$env:ARSTACK_VERSION" $script
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'NSIS installer build failed' }

      - name: Silent installer smoke test
        shell: powershell
        run: |
          $installer = (Resolve-Path "dist\ARStack-Studio-$env:ARSTACK_VERSION-win-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'ARStackStudioCleanInstall'
          & $installer /S "/D=$installDir"
          if ($LASTEXITCODE -ne 0) { throw 'Silent installer failed' }
          $installedExe = Join-Path $installDir 'ARStackStudio.exe'
          if (-not (Test-Path $installedExe)) { throw 'Installer did not deploy ARStackStudio.exe' }
          & $installedExe --check-reference-template
          if ($LASTEXITCODE -ne 0) { throw 'Installed application regression failed' }
          if (-not (Test-Path (Join-Path $installDir 'firmware\firmware-manifest.json'))) { throw 'Installer omitted firmware bundle' }
          if (-not (Test-Path (Join-Path $installDir 'tools\espflash.exe'))) { throw 'Installer omitted espflash' }
          & (Join-Path $installDir 'Uninstall.exe') /S

      - name: Generate release checksums
        shell: powershell
        run: |
          $files = @(
            "dist\ARStack-Studio-$env:ARSTACK_VERSION-win-x64-portable.zip",
            "dist\ARStack-Studio-$env:ARSTACK_VERSION-win-x64-setup.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'dist\SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist\SHA256SUMS.txt'

      - name: Upload Windows release candidates
        uses: actions/upload-artifact@v4
        with:
          name: arstack-studio-windows-x64
          path: |
            dist/ARStack-Studio-${{ env.ARSTACK_VERSION }}-win-x64-portable.zip
            dist/ARStack-Studio-${{ env.ARSTACK_VERSION }}-win-x64-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release candidates
        uses: actions/download-artifact@v4
        with:
          name: arstack-studio-windows-x64
          path: release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ARStack Studio v${{ env.ARSTACK_VERSION }}
          prerelease: true
          generate_release_notes: true
          files: |
            release/ARStack-Studio-${{ env.ARSTACK_VERSION }}-win-x64-portable.zip
            release/ARStack-Studio-${{ env.ARSTACK_VERSION }}-win-x64-setup.exe
            release/SHA256SUMS.txt
