name: Apply IEDScout BRCB optional-fields fix

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation
    paths:
      - '.github/workflows/ied-reporting-options-fix-apply.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0

      - name: Apply evidence-driven BRCB optional-fields patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Runtime: OptFlds is live report configuration, independent of the immutable SCL definition.
          replace_once(
              'include/ariec61850/mms/static_brcb_runtime.hpp',
              '    [[nodiscard]] MmsStaticBrcbStatus set_trigger_options(\n'
              '        std::uint8_t trigger_options) noexcept;\n'
              '    [[nodiscard]] constexpr std::uint8_t trigger_options() const noexcept {\n'
              '        return trigger_options_;\n'
              '    }\n',
              '    [[nodiscard]] MmsStaticBrcbStatus set_optional_fields(\n'
              '        std::span<const std::uint8_t> optional_fields) noexcept;\n'
              '    [[nodiscard]] constexpr const auto& optional_fields() const noexcept {\n'
              '        return optional_fields_;\n'
              '    }\n'
              '    [[nodiscard]] MmsStaticBrcbStatus set_trigger_options(\n'
              '        std::uint8_t trigger_options) noexcept;\n'
              '    [[nodiscard]] constexpr std::uint8_t trigger_options() const noexcept {\n'
              '        return trigger_options_;\n'
              '    }\n')
          replace_once(
              'include/ariec61850/mms/static_brcb_runtime.hpp',
              '    std::uint8_t sequence_number_{};\n'
              '    std::uint8_t trigger_options_{};\n',
              '    std::uint8_t sequence_number_{};\n'
              '    std::array<std::uint8_t, MmsInformationReportSpanCodec::optional_field_bytes>\n'
              '        optional_fields_{};\n'
              '    std::uint8_t trigger_options_{};\n')

          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '    sequence_number_ = 0U;\n'
              '    trigger_options_ = definition_->trigger_options;\n',
              '    sequence_number_ = 0U;\n'
              '    optional_fields_ = definition_->optional_fields;\n'
              '    trigger_options_ = definition_->trigger_options;\n')
          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              'MmsStaticBrcbStatus MmsStaticBrcbRuntime::set_trigger_options(\n',
              'MmsStaticBrcbStatus MmsStaticBrcbRuntime::set_optional_fields(\n'
              '    const std::span<const std::uint8_t> optional_fields) noexcept {\n'
              '    if (!initialized_ || definition_ == nullptr || pending_ == nullptr) {\n'
              '        return MmsStaticBrcbStatus::invalid_runtime;\n'
              '    }\n'
              '    if (optional_fields.size() != optional_fields_.size() ||\n'
              '        (optional_fields[0] & static_cast<std::uint8_t>(~kAllowedOptionalFirst)) != 0U ||\n'
              '        (optional_fields[1] & static_cast<std::uint8_t>(~kAllowedOptionalSecond)) != 0U) {\n'
              '        return MmsStaticBrcbStatus::invalid_definition;\n'
              '    }\n'
              '    if (enabled_) {\n'
              '        return MmsStaticBrcbStatus::temporarily_unavailable;\n'
              '    }\n'
              '    if (std::equal(optional_fields.begin(), optional_fields.end(), optional_fields_.begin())) {\n'
              '        return MmsStaticBrcbStatus::ok;\n'
              '    }\n'
              '    std::copy(optional_fields.begin(), optional_fields.end(), optional_fields_.begin());\n'
              '    clear_pending(*pending_);\n'
              '    general_interrogation_pending_ = false;\n'
              '    next_integrity_due_ms_ = 0U;\n'
              '    integrity_armed_ = false;\n'
              '    bump_revision(pending_->revision);\n'
              '    bump_revision(schedule_revision_);\n'
              '    return MmsStaticBrcbStatus::ok;\n'
              '}\n\n'
              'MmsStaticBrcbStatus MmsStaticBrcbRuntime::set_trigger_options(\n')
          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '    report.optional_fields = definition_->optional_fields;\n',
              '    report.optional_fields = optional_fields_;\n')
          replace_once(
              'src/mms/static_brcb_runtime.cpp',
              '    if ((definition_->optional_fields[0] & kOptReasonForInclusion) != 0U) {\n',
              '    if ((optional_fields_[0] & kOptReasonForInclusion) != 0U) {\n')

          # Control gate: configuration is owned by the same BRCB association and only mutable while disabled.
          replace_once(
              'include/ariec61850/mms/static_brcb_control.hpp',
              '    [[nodiscard]] MmsStaticBrcbControlStatus set_trigger_options(\n',
              '    [[nodiscard]] MmsStaticBrcbControlStatus set_optional_fields(\n'
              '        const MmsStaticBrcbClientIdentity& client,\n'
              '        std::span<const std::uint8_t> optional_fields,\n'
              '        std::uint64_t now_ms) noexcept;\n\n'
              '    [[nodiscard]] MmsStaticBrcbControlStatus set_trigger_options(\n')
          replace_once(
              'src/mms/static_brcb_control.cpp',
              'MmsStaticBrcbControlStatus MmsStaticBrcbControl::set_trigger_options(\n',
              'MmsStaticBrcbControlStatus MmsStaticBrcbControl::set_optional_fields(\n'
              '    const MmsStaticBrcbClientIdentity& client,\n'
              '    const std::span<const std::uint8_t> optional_fields,\n'
              '    const std::uint64_t now_ms) noexcept {\n'
              '    const auto access = require_control_access(client, now_ms);\n'
              '    if (access != MmsStaticBrcbControlStatus::ok) {\n'
              '        return access;\n'
              '    }\n'
              '    if (reports_->enabled()) {\n'
              '        return MmsStaticBrcbControlStatus::temporarily_unavailable;\n'
              '    }\n'
              '    return map_runtime_status(reports_->set_optional_fields(optional_fields));\n'
              '}\n\n'
              'MmsStaticBrcbControlStatus MmsStaticBrcbControl::set_trigger_options(\n')

          # MMS object surface: expose runtime OptFlds and accept the exact IEC/MMS BIT STRING used by IEDScout.
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    return attribute == MmsStaticBrcbAttribute::report_enabled ||\n'
              '        attribute == MmsStaticBrcbAttribute::trigger_options ||\n',
              '    return attribute == MmsStaticBrcbAttribute::report_enabled ||\n'
              '        attribute == MmsStaticBrcbAttribute::optional_fields ||\n'
              '        attribute == MmsStaticBrcbAttribute::trigger_options ||\n')
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    case MmsStaticBrcbAttribute::optional_fields:\n'
              '        return encode_bit_string(6U, context->definition->optional_fields, destination);\n',
              '    case MmsStaticBrcbAttribute::optional_fields:\n'
              '        return encode_bit_string(6U, context->reports->optional_fields(), destination);\n')
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    case MmsStaticBrcbAttribute::trigger_options: {\n'
              '        std::span<const std::uint8_t> bytes;\n',
              '    case MmsStaticBrcbAttribute::optional_fields: {\n'
              '        std::span<const std::uint8_t> bytes;\n'
              '        if (!decode_bit_string(encoded_data, 6U, 2U, bytes)) {\n'
              '            return {false, kTypeInconsistent};\n'
              '        }\n'
              '        constexpr std::uint8_t allowed_first = 0x7FU;\n'
              '        constexpr std::uint8_t allowed_second = 0x80U;\n'
              '        if ((bytes[0] & static_cast<std::uint8_t>(~allowed_first)) != 0U ||\n'
              '            (bytes[1] & static_cast<std::uint8_t>(~allowed_second)) != 0U) {\n'
              '            return {false, kObjectValueInvalid};\n'
              '        }\n'
              '        const auto claim = ensure_claimed(*context, client, now);\n'
              '        if (claim != MmsStaticBrcbControlStatus::ok) {\n'
              '            return map_control_status(claim);\n'
              '        }\n'
              '        return map_control_status(\n'
              '            context->control->set_optional_fields(client, bytes, now));\n'
              '    }\n'
              '    case MmsStaticBrcbAttribute::trigger_options: {\n'
              '        std::span<const std::uint8_t> bytes;\n')
          replace_once(
              'src/mms/static_brcb_objects.cpp',
              '    case MmsStaticBrcbAttribute::conf_revision:\n'
              '    case MmsStaticBrcbAttribute::optional_fields:\n'
              '    case MmsStaticBrcbAttribute::buffer_time:\n',
              '    case MmsStaticBrcbAttribute::conf_revision:\n'
              '    case MmsStaticBrcbAttribute::buffer_time:\n')

          # Regression uses the exact default Optional Fields observed in the golden IEDScout capture.
          replace_once(
              'embedded/mms_brcb_objects_hard_profile_smoke.cpp',
              'constexpr std::array<std::uint8_t, 4U> kTriggerAll{0x84U, 0x02U, 0x02U, 0x7CU};\n',
              'constexpr std::array<std::uint8_t, 4U> kTriggerAll{0x84U, 0x02U, 0x02U, 0x7CU};\n'
              'constexpr std::array<std::uint8_t, 5U> kIedScoutOptionalFields{\n'
              '    0x84U, 0x03U, 0x06U, 0x7BU, 0x80U};\n')
          replace_once(
              'embedded/mms_brcb_objects_hard_profile_smoke.cpp',
              '    if (kTriggerAll[3] != 0x7CU ||\n'
              '        !dispatch_trigger_enable_transaction(dispatcher, a, invoke) ||\n',
              '    if (!dispatch_write(\n'
              '            dispatcher, "B1$OptFlds", kIedScoutOptionalFields, a, true, 0U, invoke) ||\n'
              '        reports.optional_fields()[0] != 0x7BU ||\n'
              '        reports.optional_fields()[1] != 0x80U) {\n'
              '        return 89;\n'
              '    }\n'
              '    if (kTriggerAll[3] != 0x7CU ||\n'
              '        !dispatch_trigger_enable_transaction(dispatcher, a, invoke) ||\n')
          PY

      - name: Build and run BRCB hard-profile regression
        shell: bash
        run: |
          cmake -S embedded/brcb_hard_profile -B build-brcb-options-fix -DCMAKE_BUILD_TYPE=Release
          cmake --build build-brcb-options-fix --parallel 2
          ctest --test-dir build-brcb-options-fix --output-on-failure

      - name: Commit verified optional-fields fix and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ied-reporting-options-fix-apply.yml
          git config user.name 'Ari Sulistiono'
          git config user.email 'ari.sulistiono@gmail.com'
          git add \
            include/ariec61850/mms/static_brcb_runtime.hpp \
            include/ariec61850/mms/static_brcb_control.hpp \
            src/mms/static_brcb_runtime.cpp \
            src/mms/static_brcb_control.cpp \
            src/mms/static_brcb_objects.cpp \
            embedded/mms_brcb_objects_hard_profile_smoke.cpp \
            .github/workflows/ied-reporting-options-fix-apply.yml
          git commit -m 'fix(ied): support IEDScout BRCB optional fields'
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
