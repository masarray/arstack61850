name: Control Termination Profile CI

on:
  push:
    branches:
      - main
    paths:
      - 'include/ariec61850/control/**'
      - 'src/control/**'
      - 'tests/test_command_termination.cpp'
      - 'tests/control_termination_profile/**'
      - 'include/ariec61850/mms/data_value.hpp'
      - 'include/ariec61850/mms/reporting.hpp'
      - 'src/mms/data_value.cpp'
      - '.github/workflows/control-termination-profile-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'include/ariec61850/control/**'
      - 'src/control/**'
      - 'tests/test_command_termination.cpp'
      - 'tests/control_termination_profile/**'
      - 'include/ariec61850/mms/data_value.hpp'
      - 'include/ariec61850/mms/reporting.hpp'
      - 'src/mms/data_value.cpp'
      - '.github/workflows/control-termination-profile-ci.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  control-termination-profile:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Control Termination / ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      - name: Configure control termination profile
        run: cmake -S tests/control_termination_profile -B build-control-termination

      - name: Build control termination profile
        run: cmake --build build-control-termination --parallel

      - name: Run CommandTermination parity tests
        run: >-
          ctest --test-dir build-control-termination
          --output-on-failure
          --output-junit control-termination-ctest.xml

      - name: Upload termination evidence
        uses: actions/upload-artifact@v4
        with:
          name: control-termination-${{ matrix.compiler }}-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: build-control-termination/control-termination-ctest.xml
