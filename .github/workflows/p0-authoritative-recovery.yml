name: P0 authoritative SMV/PTP recovery

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0

      - name: Patch current source atomically
        shell: python
        run: |
          from pathlib import Path
          import re

          changed = []

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, before, after):
              if before != after:
                  Path(path).write_text(after, encoding='utf-8')
                  changed.append(path)

          def one(text, old, new, label):
              if new in text:
                  return text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {n}')
              return text.replace(old, new, 1)

          # Correct ESP-IDF transmit_ctrl_vargs contract and restore normal
          # EMAC mode whenever any PTP role tears down.
          helper = '''void disable_hardware_ptp(const esp_eth_handle_t handle) noexcept {
              if (handle == nullptr) return;
              bool enable = false;
              const auto result = esp_eth_ioctl(
                  handle,
                  static_cast<esp_eth_io_cmd_t>(ETH_MAC_ESP_CMD_PTP_ENABLE),
                  &enable);
              if (result != ESP_OK) {
                  ESP_LOGW(kTag, "Unable to restore normal EMAC mode after PTP: %s",
                           esp_err_to_name(result));
              }
          }

          '''

          for path in [
              'embedded/esp32p4_smv_injector/main/ptp_lab_task.cpp',
              'embedded/esp32p4_smv_injector/main/ptp_receiver_task.cpp']:
              before = load(path)
              after = before
              after = after.replace(
                  '// esp_eth_transmit_ctrl_vargs argc counts buffer/length pairs. One PTP\n'
                  '    // Ethernet frame is exactly one pair.\n'
                  '    const auto result = esp_eth_transmit_ctrl_vargs(\n'
                  '        ',
                  '// esp_eth_transmit_ctrl_vargs argc is the raw variadic-argument count.\n'
                  '    // One Ethernet frame supplies buffer + length, therefore argc=2.\n'
                  '    const auto result = esp_eth_transmit_ctrl_vargs(\n'
                  '        ',
                  1)
              pattern = re.compile(
                  r'(const auto result = esp_eth_transmit_ctrl_vargs\(\n'
                  r'\s*[A-Za-z_][A-Za-z0-9_]*,\n'
                  r'\s*&tx_timestamp,\n\s*)1U(,\n\s*frame\.data\(\),\n\s*frame\.size\(\)\);)')
              after, n = pattern.subn(r'\g<1>2U\2', after, count=1)
              if n == 0 and not re.search(r'&tx_timestamp,\n\s*2U,', after):
                  raise SystemExit(f'{path}: ctrl_vargs argc patch did not converge')
              if 'void disable_hardware_ptp(' not in after:
                  pos = after.find('void seed_hardware_clock(')
                  if pos < 0:
                      raise SystemExit(f'{path}: seed_hardware_clock anchor missing')
                  after = after[:pos] + helper + after[pos:]
              save(path, before, after)

          path = 'embedded/esp32p4_smv_injector/main/ptp_lab_task.cpp'
          before = load(path)
          after = before
          after = one(
              after,
              '    context.task_handle = nullptr;\n    g_ptp_ready.store(false, std::memory_order_release);',
              '    disable_hardware_ptp(context.eth_handle);\n'
              '    context.task_handle = nullptr;\n    g_ptp_ready.store(false, std::memory_order_release);',
              'SOURCE EMAC rollback')
          after = one(
              after,
              '    if (g_ptp_context.task_handle != nullptr) {\n'
              '        xTaskNotifyGive(g_ptp_context.task_handle);\n'
              '    }\n'
              '}\n\n[[nodiscard]] bool ptp_lab_is_running()',
              '    if (g_ptp_context.task_handle != nullptr) {\n'
              '        xTaskNotifyGive(g_ptp_context.task_handle);\n'
              '    }\n'
              '    constexpr unsigned kCleanupPolls = 100U;\n'
              '    for (unsigned attempt = 0U; attempt < kCleanupPolls; ++attempt) {\n'
              '        if (!g_ptp_started.load(std::memory_order_acquire)) return;\n'
              '        vTaskDelay(pdMS_TO_TICKS(5));\n'
              '    }\n'
              '    ESP_LOGE(kTag, "PTP SOURCE cleanup timeout; EMAC rollback incomplete after 500 ms");\n'
              '}\n\n[[nodiscard]] bool ptp_lab_is_running()',
              'SOURCE bounded STOP')
          save(path, before, after)

          path = 'embedded/esp32p4_smv_injector/main/ptp_receiver_task.cpp'
          before = load(path)
          after = before
          after = one(
              after,
              '    smp_synch_lab_set_measured(std::nullopt);\n    context.receiver.reset();',
              '    smp_synch_lab_set_measured(std::nullopt);\n'
              '    disable_hardware_ptp(context.eth_handle);\n'
              '    context.receiver.reset();',
              'RECEIVER/MONITOR EMAC rollback')
          after = one(
              after,
              '    if (g_receiver_context.task_handle != nullptr) {\n'
              '        xTaskNotifyGive(g_receiver_context.task_handle);\n'
              '    }\n'
              '}\n\nbool ptp_receiver_is_running()',
              '    if (g_receiver_context.task_handle != nullptr) {\n'
              '        xTaskNotifyGive(g_receiver_context.task_handle);\n'
              '    }\n'
              '    constexpr unsigned kCleanupPolls = 100U;\n'
              '    for (unsigned attempt = 0U; attempt < kCleanupPolls; ++attempt) {\n'
              '        if (!g_receiver_running.load(std::memory_order_acquire)) return;\n'
              '        vTaskDelay(pdMS_TO_TICKS(5));\n'
              '    }\n'
              '    ESP_LOGE(kTag, "PTP receiver cleanup timeout; EMAC rollback incomplete after 500 ms");\n'
              '}\n\nbool ptp_receiver_is_running()',
              'RECEIVER/MONITOR bounded STOP')
          save(path, before, after)

          # Fail closed when the deterministic scheduler is alive but canonical
          # Ethernet TX is continuously failing. This prevents false RUNNING.
          path = 'embedded/esp32p4_smv_injector/main/app_main.cpp'
          before = load(path)
          after = before
          after = one(
              after,
              'using ar::esp32p4::smv::live_control_bind_publisher_task;\n',
              'using ar::esp32p4::smv::live_control_bind_publisher_task;\n'
              'using ar::esp32p4::smv::live_control_force_stop;\n',
              'force-stop import')
          after = one(
              after,
              'constexpr std::uint32_t kStatsMergeEvery = 400U;\n',
              'constexpr std::uint32_t kStatsMergeEvery = 400U;\n'
              'constexpr std::uint32_t kTransportFailureStopThreshold = 400U; // 100 ms at 4 kHz\n',
              'transport threshold')
          after = one(
              after,
              '    bool schedule_anchored = false;\n    std::int64_t expected_wake_us = 0;\n',
              '    bool schedule_anchored = false;\n    std::int64_t expected_wake_us = 0;\n'
              '    std::uint32_t consecutive_canonical_tx_failures = 0U;\n'
              '    esp_err_t last_canonical_tx_error = ESP_OK;\n',
              'transport state')
          after = one(
              after,
              '            schedule_anchored = false;\n            expected_schedule.reset(active_profile.publisher_rate_hz);\n',
              '            schedule_anchored = false;\n'
              '            consecutive_canonical_tx_failures = 0U;\n'
              '            last_canonical_tx_error = ESP_OK;\n'
              '            expected_schedule.reset(active_profile.publisher_rate_hz);\n',
              'START transport reset')
          after = one(
              after,
              '        if ((xEventGroupGetBits(g_link_events) & kLinkUpBit) == 0U) {\n'
              '            ++local.canonical_fail;\n'
              '#if CONFIG_AR_SMV_BROADCAST_MIRROR\n'
              '            ++local.mirror_fail;\n'
              '#endif\n'
              '        } else {\n'
              '            patch_packet(canonical, canonical_sample_count, row, signal_state);\n'
              '            const esp_err_t canonical_result =\n'
              '                esp_eth_transmit(eth_handle, canonical.bytes.data(), canonical.bytes.size());\n'
              '            if (canonical_result == ESP_OK) ++local.canonical_ok;\n'
              '            else ++local.canonical_fail;\n',
              '        if ((xEventGroupGetBits(g_link_events) & kLinkUpBit) == 0U) {\n'
              '            ++local.canonical_fail;\n'
              '            last_canonical_tx_error = ESP_ERR_INVALID_STATE;\n'
              '            ++consecutive_canonical_tx_failures;\n'
              '#if CONFIG_AR_SMV_BROADCAST_MIRROR\n'
              '            ++local.mirror_fail;\n'
              '#endif\n'
              '        } else {\n'
              '            patch_packet(canonical, canonical_sample_count, row, signal_state);\n'
              '            const esp_err_t canonical_result =\n'
              '                esp_eth_transmit(eth_handle, canonical.bytes.data(), canonical.bytes.size());\n'
              '            if (canonical_result == ESP_OK) {\n'
              '                ++local.canonical_ok;\n'
              '                consecutive_canonical_tx_failures = 0U;\n'
              '                last_canonical_tx_error = ESP_OK;\n'
              '            } else {\n'
              '                ++local.canonical_fail;\n'
              '                last_canonical_tx_error = canonical_result;\n'
              '                ++consecutive_canonical_tx_failures;\n'
              '            }\n',
              'canonical TX health')
          anchor = ('        g_sample_tick_total.fetch_add(1U, std::memory_order_relaxed);\n'
                    '        canonical_sample_count = static_cast<std::uint16_t>(\n')
          replacement = ('        g_sample_tick_total.fetch_add(1U, std::memory_order_relaxed);\n'
                         '        if (consecutive_canonical_tx_failures >= kTransportFailureStopThreshold) {\n'
                         '            ESP_LOGE(kTag,\n'
                         '                     "SV transport fault: %lu consecutive canonical TX failures; last=%s; forcing STOP",\n'
                         '                     static_cast<unsigned long>(consecutive_canonical_tx_failures),\n'
                         '                     esp_err_to_name(last_canonical_tx_error));\n'
                         '            merge_stats(local);\n'
                         '            live_control_force_stop();\n'
                         '            stop_sample_clock(sample_clock);\n'
                         '            schedule_anchored = false;\n'
                         '            consecutive_canonical_tx_failures = 0U;\n'
                         '            continue;\n'
                         '        }\n'
                         '        canonical_sample_count = static_cast<std::uint16_t>(\n')
          after = one(after, anchor, replacement, 'transport fail-close')
          save(path, before, after)

          path = 'embedded/esp32p4_smv_injector/main/live_control.cpp'
          before = load(path)
          after = one(
              before,
              '    clear_control_session();\n    wake_publisher();\n}\n\nSvLiveSignalState live_signal_snapshot()',
              '    clear_control_session();\n    wake_publisher();\n'
              '    ESP_LOGW(kTag, "STOP accepted: SV transmission suppressed by fail-closed runtime");\n'
              '}\n\nSvLiveSignalState live_signal_snapshot()',
              'forced STOP observability')
          save(path, before, after)

          # Repair Studio's own v0.1.1 bundle-contract fixture.
          path = '.github/workflows/arstack-studio-qt.yml'
          before = load(path)
          after = before.replace('arstack-esp32p4-smv-0.1.0.bin', 'arstack-esp32p4-smv-0.1.1.bin')
          after = after.replace('"version": "0.1.0",', '"version": "0.1.1",')
          if '"capabilities": ["SMV-4I4V", "PROFILE", "LIVE-SETPOINTS", "SESSION-LEASE", "PTP-P2", "SMPSYNCH-AUTO"]' not in after:
              after = one(
                  after,
                  '            "protocol": 1,\n            "flashOffset": 0,\n',
                  '            "protocol": 1,\n'
                  '            "capabilities": ["SMV-4I4V", "PROFILE", "LIVE-SETPOINTS", "SESSION-LEASE", "PTP-P2", "SMPSYNCH-AUTO"],\n'
                  '            "flashOffset": 0,\n',
                  'Studio manifest capabilities')
          save(path, before, after)

          # Keep production CI from silently dropping TX serialization later.
          path = '.github/workflows/esp32p4-smv-injector.yml'
          before = load(path)
          after = before
          if "grep -qx 'CONFIG_ETH_TRANSMIT_MUTEX=y' sdkconfig" not in after:
              after = one(
                  after,
                  "          grep -qx 'CONFIG_AR_PTP_LAB_TX=y' sdkconfig\n",
                  "          grep -qx 'CONFIG_AR_PTP_LAB_TX=y' sdkconfig\n"
                  "          grep -qx 'CONFIG_ETH_TRANSMIT_MUTEX=y' sdkconfig\n",
                  'firmware mutex gate')
          save(path, before, after)

          print('changed:')
          print('\n'.join(changed) if changed else 'none')

      - name: Verify source contract and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'CONFIG_ETH_TRANSMIT_MUTEX=y' embedded/esp32p4_smv_injector/sdkconfig.defaults
          test "$(grep -R -A5 'esp_eth_transmit_ctrl_vargs(' embedded/esp32p4_smv_injector/main/ptp_lab_task.cpp embedded/esp32p4_smv_injector/main/ptp_receiver_task.cpp | grep -c '2U,')" -eq 2
          test "$(grep -R -c 'disable_hardware_ptp(context.eth_handle);' embedded/esp32p4_smv_injector/main/ptp_lab_task.cpp embedded/esp32p4_smv_injector/main/ptp_receiver_task.cpp | awk -F: '{s+=$2} END {print s}')" -eq 2
          grep -q 'kTransportFailureStopThreshold = 400U' embedded/esp32p4_smv_injector/main/app_main.cpp
          grep -q 'STOP accepted: SV transmission suppressed by fail-closed runtime' embedded/esp32p4_smv_injector/main/live_control.cpp
          grep -q 'arstack-esp32p4-smv-0.1.1.bin' .github/workflows/arstack-studio-qt.yml
          grep -q 'SMPSYNCH-AUTO' .github/workflows/arstack-studio-qt.yml
          git diff --check

          rm -f .github/workflows/p0-authoritative-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p0): recover SMV/PTP Ethernet TX and fail closed'
          git pull --rebase origin feature/ptp-production-v0.1.1
          git push origin HEAD:feature/ptp-production-v0.1.1
