name: Stage v0.1.1 lifecycle ownership

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1

permissions:
  contents: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0
      - name: Carry bounded lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git log --format=%s | grep -Fxq 'fix(studio): retire workers before GUI event loop exits'; then
            exit 0
          fi
          git cherry-pick 75e5f2dfd1fcf382bb2698a55ce9fcff57413390
          git push origin HEAD:feature/ptp-production-v0.1.1
