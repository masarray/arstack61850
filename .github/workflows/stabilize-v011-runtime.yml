name: Stage normal-close regression path

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0
      - name: Exercise real QQuickWindow close path
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/arstack_studio/src/main.cpp')
          s = p.read_text(encoding='utf-8')
          old = '            QCloseEvent closeEvent;\n            QCoreApplication::sendEvent(lifecycleTarget.data(), &closeEvent);\n            if (!primaryCloseFilter.closeObserved()) {'
          new = '            lifecycleTarget->close();\n            if (!primaryCloseFilter.closeObserved()) {'
          if old not in s:
              raise SystemExit('normal-close regression anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace('Application lifecycle regression: primary QEvent::Close bypassed the lifetime filter.', 'Application lifecycle regression: normal primary-window close bypassed the lifetime filter.', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git add apps/arstack_studio/src/main.cpp
          git diff --cached --check
          git commit -m "test(studio): exercise real primary-window close path"
          git push origin HEAD:feature/ptp-production-v0.1.1
