name: Phase1B Fast Discovery Index

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0
      - name: Apply precompiled discovery-index fast path
        run: python3 scripts/phase1b_patch.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DARIEC61850_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit fast path after green gate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/zz-phase1b-fast-directory.yml scripts/phase1b_patch.py
          git add include/ariec61850/mms/static_dispatcher.hpp src/mms/static_dispatcher.cpp tools/static_ied_server.cpp embedded/mms_dispatcher_hard_profile_smoke.cpp
          git commit -m "perf(mms): precompile IEDScout discovery hierarchy"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
