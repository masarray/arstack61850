name: P0 Runtime Physical Repair

on:
  push:
    paths:
      - '.github/workflows/p0-runtime-physical-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0

      - name: Apply P0 runtime repair
        run: python .github/scripts/p0_runtime_physical_repair.py

      - name: Validate repaired source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'QCoreApplication::exit(0);' apps/arstack_studio/src/main.cpp
          if grep -q 'app_->quit();' apps/arstack_studio/src/main.cpp; then exit 1; fi
          grep -q 'recoveryCandidatePort' apps/arstack_studio/src/DeviceController.hpp
          grep -q 'single visible COM without metadata' apps/arstack_studio/src/DeterministicSessionHarness.cpp
          grep -q 'Disconnect unrelated serial devices' apps/arstack_studio/src/SmartSessionController.cpp
          git diff --check

      - name: Commit repaired runtime source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ari Sulistiono'
          git config user.email 'ari.sulistiono@gmail.com'
          git add apps/arstack_studio/src/main.cpp apps/arstack_studio/qml/Main.qml \
                  apps/arstack_studio/src/DeviceController.cpp apps/arstack_studio/src/DeviceController.hpp \
                  apps/arstack_studio/src/SmartSessionController.cpp \
                  apps/arstack_studio/src/DeterministicSessionHarness.cpp
          git commit -m 'fix(p0): hard-exit GUI close and infer single-board firmware recovery'
          git push origin HEAD:feature/ptp-production-v0.1.1
