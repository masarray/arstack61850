name: P0 Runtime Physical Candidate

on:
  push:
    paths:
      - '.github/workflows/p0-runtime-physical-repair.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: p0-runtime-physical-candidate
  cancel-in-progress: true

env:
  ARSTACK_VERSION: '0.1.1'
  QT_VERSION: '6.10.3'
  ESPFLASH_VERSION: '4.5.0'
  ESPFLASH_WINDOWS_ZIP_SHA256: '854c82c947c20e7f337f120f0398042ed1760f2269cb0f9be3d2beae3b66fbfb'
  VERIFIED_FIRMWARE_ARTIFACT_ID: '10436323004'

jobs:
  windows-candidate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout repaired Studio source
        uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1

      - name: Download verified unchanged v0.1.1 firmware
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'firmware.zip'
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:VERIFIED_FIRMWARE_ARTIFACT_ID/zip" -Headers $headers -OutFile $zip
          New-Item -ItemType Directory -Force firmware-package | Out-Null
          Expand-Archive -Path $zip -DestinationPath firmware-package -Force
          $manifest = Get-Content 'firmware-package\firmware-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne '0.1.1' -or $manifest.chip -ne 'esp32p4' -or $manifest.flashOffset -ne 0) {
            throw 'Verified firmware artifact contract mismatch.'
          }
          $image = Join-Path 'firmware-package' $manifest.image
          if (-not (Test-Path $image)) { throw 'Verified firmware image missing.' }
          $actual = (Get-FileHash $image -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $manifest.sha256.ToLowerInvariant()) { throw 'Verified firmware SHA-256 mismatch.' }
          Write-Host "Firmware reuse verified: $($manifest.image) SHA256=$actual"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtserialport'
          cache: true

      - name: Configure and build repaired Studio plus session harness
        shell: powershell
        run: |
          cmake -S apps/arstack_studio -B build-arstack-studio -G "Visual Studio 18 2026" -A x64 `
            -DARIEC61850_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { throw "Studio configure failed: $LASTEXITCODE" }
          cmake --build build-arstack-studio --config Release --target arstack_studio arstack_session_harness --parallel
          if ($LASTEXITCODE -ne 0) { throw "Studio build failed: $LASTEXITCODE" }

      - name: Prove single-board stale-firmware recovery policy
        shell: powershell
        run: |
          $harness = Join-Path $PWD 'build-arstack-studio\Release\arstack_session_harness.exe'
          & $harness
          if ($LASTEXITCODE -ne 0) { throw "Deterministic session harness failed: $LASTEXITCODE" }

      - name: Prove primary-window close kills the process twice
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $exe = Join-Path $PWD 'build-arstack-studio\Release\arstack_studio.exe'
          function Invoke-CloseCycle([int]$Cycle) {
            $p = Start-Process -FilePath $exe -ArgumentList @('--check-app-lifecycle') -PassThru
            $pidValue = $p.Id
            if (-not $p.WaitForExit(12000)) {
              Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
              $p.Dispose()
              throw "Cycle ${Cycle}: GUI close did not terminate ARStackStudio process within 12 seconds."
            }
            $exitCode = $p.ExitCode
            $p.Dispose()
            if ($exitCode -ne 0) { throw "Cycle ${Cycle}: lifecycle exited with code $exitCode." }
            if (Get-Process -Id $pidValue -ErrorAction SilentlyContinue) {
              throw "Cycle ${Cycle}: PID $pidValue still exists after normal primary-window close."
            }
            Write-Host "Cycle $Cycle PASS: primary window close -> worker retirement -> PID gone."
          }
          Invoke-CloseCycle 1
          Start-Sleep -Milliseconds 300
          Invoke-CloseCycle 2

      - name: Stage Studio with verified firmware
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'dist\ARStack-Studio'
          New-Item -ItemType Directory -Force $stage | Out-Null
          $sourceExe = Join-Path $PWD 'build-arstack-studio\Release\arstack_studio.exe'
          $stageExe = Join-Path $stage 'ARStackStudio.exe'
          Copy-Item $sourceExe $stageExe
          windeployqt --release --qmldir "$PWD\apps\arstack_studio\qml" --compiler-runtime $stageExe
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed: $LASTEXITCODE" }
          Copy-Item LICENSE, NOTICE, THIRD_PARTY_NOTICES.md, COPYRIGHT.md -Destination $stage
          New-Item -ItemType Directory -Force (Join-Path $stage 'firmware') | Out-Null
          Copy-Item 'firmware-package\*' -Destination (Join-Path $stage 'firmware') -Recurse

      - name: Bundle pinned espflash
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://github.com/esp-rs/espflash/releases/download/v$env:ESPFLASH_VERSION/espflash-x86_64-pc-windows-msvc.zip"
          $zip = Join-Path $env:RUNNER_TEMP 'espflash.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:ESPFLASH_WINDOWS_ZIP_SHA256) { throw "espflash SHA-256 mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP 'espflash'
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $exe = Get-ChildItem $extract -Filter espflash.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'espflash.exe not found' }
          $tools = Join-Path $PWD 'dist\ARStack-Studio\tools'
          New-Item -ItemType Directory -Force $tools | Out-Null
          Copy-Item $exe.FullName (Join-Path $tools 'espflash.exe')

      - name: Packaged contract checks
        shell: powershell
        run: |
          function Assert-ExitZero([string]$FilePath, [string[]]$Arguments, [string]$Label) {
            $p = Start-Process -FilePath $FilePath -ArgumentList $Arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "$Label failed with exit code $($p.ExitCode)" }
          }
          $stage = Join-Path $PWD 'dist\ARStack-Studio'
          $studio = Join-Path $stage 'ARStackStudio.exe'
          $espflash = Join-Path $stage 'tools\espflash.exe'
          $env:ARSTACK_STUDIO_FIRMWARE_DIR = Join-Path $stage 'firmware'
          $env:ARSTACK_STUDIO_ESPFLASH = $espflash
          $env:ESPFLASH_SKIP_UPDATE_CHECK = 'true'
          Assert-ExitZero $studio @('--check-firmware-contract') 'Packaged firmware contract'
          Assert-ExitZero $studio @('--check-p0-policy') 'Packaged P0 policy'
          Assert-ExitZero $studio @('--check-app-lifecycle') 'Packaged lifecycle'
          Assert-ExitZero $espflash @('--version') 'Bundled espflash'

      - name: Build portable ZIP and NSIS installer
        shell: powershell
        run: |
          $portable = Join-Path $PWD "dist\ARStack-Studio-$env:ARSTACK_VERSION-p0-runtime-win-x64-portable.zip"
          Compress-Archive -Path 'dist\ARStack-Studio\*' -DestinationPath $portable -CompressionLevel Optimal -Force
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed: $LASTEXITCODE" }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path $makensis)) { throw "makensis.exe not found at $makensis" }
          $stage = (Resolve-Path 'dist\ARStack-Studio').Path
          $out = Join-Path $PWD "dist\ARStack-Studio-$env:ARSTACK_VERSION-p0-runtime-win-x64-setup.exe"
          $script = (Resolve-Path 'apps\arstack_studio\packaging\ARStackStudio.nsi').Path
          & $makensis "/DSOURCE_DIR=$stage" "/DOUTPUT_FILE=$out" "/DAPP_VERSION=$env:ARSTACK_VERSION" $script
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $out)) { throw 'NSIS installer build failed' }
          $files = @($portable, $out)
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content 'dist\P0-RUNTIME-SHA256SUMS.txt' -Encoding ascii
          Get-Content 'dist\P0-RUNTIME-SHA256SUMS.txt'

      - name: Smoke installed EXE and prove installed PID exits
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path "dist\ARStack-Studio-$env:ARSTACK_VERSION-p0-runtime-win-x64-setup.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP 'ARStackStudioP0Runtime'
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir 'ARStackStudio.exe'
          if (-not (Test-Path $exe)) { throw 'Installed ARStackStudio.exe missing.' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $p = Start-Process -FilePath $exe -ArgumentList @('--check-app-lifecycle') -PassThru
          $pidValue = $p.Id
          if (-not $p.WaitForExit(12000)) {
            Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
            throw 'Installed GUI close left ARStackStudio.exe alive.'
          }
          if ($p.ExitCode -ne 0) { throw "Installed lifecycle failed: $($p.ExitCode)" }
          if (Get-Process -Id $pidValue -ErrorAction SilentlyContinue) { throw 'Installed ARStackStudio PID remained alive.' }
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          if (Test-Path $uninstaller) {
            $u = Start-Process -FilePath $uninstaller -ArgumentList @('/S') -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "Silent uninstall failed: $($u.ExitCode)" }
          }

      - name: Upload physical P0 candidate
        uses: actions/upload-artifact@v4
        with:
          name: arstack-studio-p0-runtime-windows-x64
          path: |
            dist/ARStack-Studio-${{ env.ARSTACK_VERSION }}-p0-runtime-win-x64-portable.zip
            dist/ARStack-Studio-${{ env.ARSTACK_VERSION }}-p0-runtime-win-x64-setup.exe
            dist/P0-RUNTIME-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
