name: P0 Runtime Physical Repair

on:
  push:
    paths:
      - '.github/workflows/p0-runtime-physical-repair.yml'

permissions:
  contents: write

concurrency:
  group: p0-runtime-physical-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0

      - name: Apply P0 runtime repair
        run: |
          python3 .github/scripts/p0_runtime_physical_repair.py
          git diff --check

      - name: Commit repaired runtime source
        run: |
          set -euo pipefail
          git config user.name 'Ari Sulistiono'
          git config user.email 'ari.sulistiono@gmail.com'
          git add apps/arstack_studio/src/main.cpp apps/arstack_studio/qml/Main.qml apps/arstack_studio/src/DeviceController.cpp apps/arstack_studio/src/DeviceController.hpp apps/arstack_studio/src/SmartSessionController.cpp apps/arstack_studio/src/DeterministicSessionHarness.cpp
          git commit -m 'fix(p0): hard-exit GUI close and infer single-board firmware recovery'
          git push origin HEAD:feature/ptp-production-v0.1.1
