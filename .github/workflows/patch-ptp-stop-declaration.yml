name: Patch PTP stop declaration

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0
      - name: Declare bounded stop helper before source start
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          p = Path('embedded/esp32p4_smv_injector/main/ptp_lab_task.cpp')
          text = p.read_text(encoding='utf-8')
          anchor = 'void start_ptp_lab(const esp_eth_handle_t eth_handle) {\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one start_ptp_lab anchor, found {text.count(anchor)}')
          text = text.replace(anchor, 'void stop_ptp_lab() noexcept;\n\n' + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git add embedded/esp32p4_smv_injector/main/ptp_lab_task.cpp
          git commit -m "fix(ptp): declare stop helper before bounded start"
          git push origin HEAD:feature/ptp-production-v0.1.1
