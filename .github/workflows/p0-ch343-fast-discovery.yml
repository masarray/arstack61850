name: P0 CH343 Fast Discovery Repair

on:
  push:
    paths:
      - '.github/workflows/p0-ch343-fast-discovery.yml'

permissions:
  contents: write

concurrency:
  group: p0-ch343-fast-discovery
  cancel-in-progress: true

jobs:
  repair:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0

      - name: Apply CH343 fast-discovery repair
        run: |
          set -euo pipefail
          python3 .github/scripts/p0_ch343_fast_discovery.py
          git diff --check
          grep -q '0x1A86U' apps/arstack_studio/src/DeviceIoWorker.hpp
          grep -q '0x55D3U' apps/arstack_studio/src/DeviceIoWorker.hpp
          grep -q 'bluetooth' apps/arstack_studio/src/DeviceIoWorker.hpp
          grep -q 'fastUsbDiscoveryPolicy' apps/arstack_studio/src/WindowsOwnershipHarness.cpp

      - name: Commit repaired discovery source
        run: |
          set -euo pipefail
          git config user.name 'Ari Sulistiono'
          git config user.email 'ari.sulistiono@gmail.com'
          git add apps/arstack_studio/src/DeviceIoWorker.cpp apps/arstack_studio/src/DeviceIoWorker.hpp apps/arstack_studio/src/WindowsOwnershipHarness.cpp
          git commit -m 'fix(studio): prioritize CH343 USB injector discovery'
          git push origin HEAD:feature/ptp-production-v0.1.1
