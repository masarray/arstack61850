name: Product Naming Guard
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: product-naming-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tracked-tree-names:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked source and paths
        run: python3 scripts/check_product_naming.py
