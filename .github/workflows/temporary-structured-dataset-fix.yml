name: Temporary structured DataSet source migration

on:
  push:
    branches:
      - feat/complete-ariec61850-simulator-parity
    paths:
      - scripts/apply_structured_dataset_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-ariec61850-simulator-parity
          fetch-depth: 0

      - name: Apply exact source migration
        run: python3 scripts/apply_structured_dataset_fix.py

      - name: Validate patch shape
        run: |
          git diff --check
          git diff -- include/ariec61850/scl/model.hpp src/scl/parser_part_04.inc src/scl/parser_part_05_01.inc src/scl/parser_part_05_02.inc tests/test_scl.cpp tools/static_ied_server.cpp

      - name: Commit source fix
        run: |
          git config user.name "ARStack CI Migration"
          git config user.email "actions@users.noreply.github.com"
          git add include/ariec61850/scl/model.hpp \
                  src/scl/parser_part_04.inc \
                  src/scl/parser_part_05_01.inc \
                  src/scl/parser_part_05_02.inc \
                  tests/test_scl.cpp \
                  tools/static_ied_server.cpp
          git commit -m "fix(ied-sim): preserve structured DataSet FCDA semantics"
          git push origin HEAD:feat/complete-ariec61850-simulator-parity
