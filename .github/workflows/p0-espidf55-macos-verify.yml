name: P0 ESP-IDF 5.5.4 macOS Verify

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1
    paths:
      - '.github/workflows/p0-espidf55-macos-verify.yml'

permissions:
  contents: read

concurrency:
  group: p0-espidf55-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-source-and-receiver:
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - name: Checkout ARStack exact head
        uses: actions/checkout@v4
        with:
          path: arstack
          fetch-depth: 1

      - name: Checkout ESP-IDF v5.5.4
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v5.5.4
          path: esp-idf
          submodules: recursive
          fetch-depth: 1

      - name: Install ESP-IDF toolchain for ESP32-P4
        shell: bash
        run: |
          set -euo pipefail
          ./esp-idf/install.sh esp32p4

      - name: Verify corrected ESP-IDF 5.5 varargs contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('arstack/embedded/esp32p4_smv_injector/main')
          for name in ('ptp_lab_task.cpp', 'ptp_receiver_task.cpp'):
              text = (root / name).read_text(encoding='utf-8')
              call = 'esp_eth_transmit_ctrl_vargs('
              if call not in text:
                  raise SystemExit(f'{name}: timestamped TX call missing')
              if '\n        2U,\n' not in text and '\n        2U,\r\n' not in text:
                  raise SystemExit(f'{name}: corrected argc=2 contract missing')
              if 'argc counts buffer/length pairs' in text:
                  raise SystemExit(f'{name}: obsolete argc interpretation returned')
          driver = Path('esp-idf/components/esp_eth/src/mac/esp_eth_mac_esp.c').read_text(encoding='utf-8')
          if 'uint32_t buf_num = argc / 2;' not in driver:
              raise SystemExit('ESP-IDF v5.5.4 driver contract changed unexpectedly')
          print('P0 contract PASS: one frame = 2 variadic args, driver buf_num = argc / 2')
          PY

      - name: Build production SOURCE firmware
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/esp-idf/export.sh"
          cd "$GITHUB_WORKSPACE/arstack/embedded/esp32p4_smv_injector"
          idf.py set-target esp32p4
          idf.py reconfigure
          grep -qx 'CONFIG_AR_PTP_LAB_TX=y' sdkconfig
          grep -qx 'CONFIG_AR_PTP_OPERATING_ROLE=0' sdkconfig
          grep -qx 'CONFIG_ETH_TRANSMIT_MUTEX=y' sdkconfig
          idf.py build
          mkdir -p "$GITHUB_WORKSPACE/p0-source-artifact"
          cp build/bootloader/bootloader.bin "$GITHUB_WORKSPACE/p0-source-artifact/"
          cp build/partition_table/partition-table.bin "$GITHUB_WORKSPACE/p0-source-artifact/"
          cp build/*.bin "$GITHUB_WORKSPACE/p0-source-artifact/"
          cp sdkconfig "$GITHUB_WORKSPACE/p0-source-artifact/sdkconfig.source"

      - name: Build TIME_RECEIVER firmware
        shell: bash
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/esp-idf/export.sh"
          cd "$GITHUB_WORKSPACE/arstack/embedded/esp32p4_smv_injector"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sdkconfig')
          text = p.read_text(encoding='utf-8')
          old = 'CONFIG_AR_PTP_OPERATING_ROLE=0'
          new = 'CONFIG_AR_PTP_OPERATING_ROLE=1'
          if old not in text:
              raise SystemExit('SOURCE role config missing before receiver build')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          idf.py reconfigure
          grep -qx 'CONFIG_AR_PTP_OPERATING_ROLE=1' sdkconfig
          idf.py build

      - name: Upload exact SOURCE candidate
        uses: actions/upload-artifact@v4
        with:
          name: p0-esp32p4-source-v0.1.1-${{ github.sha }}
          path: p0-source-artifact
          if-no-files-found: error
          retention-days: 7
