name: ESP-IDF Compile CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  esp32p4-compile:
    name: ESP32-P4 / ESP-IDF v6.0.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-P4 component smoke app
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          path: ports/esp_idf/smoke_app

      - name: Build flashable ESP32-P4 SV trial firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          path: ports/esp_idf/sv_trial_app

      - name: Verify flashable firmware outputs
        shell: bash
        run: |
          set -euo pipefail
          app=ports/esp_idf/sv_trial_app
          build="$app/build"
          test -f "$build/arstack61850_esp32p4_sv_trial.bin"
          test -f "$build/arstack61850_esp32p4_sv_trial.elf"
          test -f "$build/arstack61850_esp32p4_sv_trial.map"
          test -f "$build/bootloader/bootloader.bin"
          test -f "$build/partition_table/partition-table.bin"
          test -f "$build/flash_args"
          test -f "$build/flasher_args.json"
          test -f "$build/project_description.json"
          test -f "$build/config/sdkconfig.h"
          test -f "$app/sdkconfig.defaults"
          python3 -m json.tool "$build/flasher_args.json" >/dev/null
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          build = Path('ports/esp_idf/sv_trial_app/build')
          description = json.loads((build / 'project_description.json').read_text(encoding='utf-8'))
          target = description.get('target')
          if target != 'esp32p4':
              raise SystemExit(f'expected ESP-IDF target esp32p4, got {target!r}')

          config = (build / 'config/sdkconfig.h').read_text(encoding='utf-8')
          p4_symbol = re.search(r'^#define\s+CONFIG_IDF_TARGET_ESP32P4\s+1\s*$', config, re.MULTILINE)
          target_string = re.search(r'^#define\s+CONFIG_IDF_TARGET\s+"esp32p4"\s*$', config, re.MULTILINE)
          if p4_symbol is None and target_string is None:
              raise SystemExit('resolved ESP-IDF config does not identify ESP32-P4')

          evidence = {
              'status': 'FLASHABLE/READY',
              'target': target,
              'project_name': description.get('project_name'),
              'project_version': description.get('project_version'),
              'elf_file': description.get('app_elf'),
              'build_dir': str(build),
              'config_evidence': 'build/config/sdkconfig.h',
          }
          (build / 'ARSTACK_BUILD_PROFILE.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n',
              encoding='utf-8')
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          (
            cd "$app"
            sha256sum \
              build/arstack61850_esp32p4_sv_trial.bin \
              build/arstack61850_esp32p4_sv_trial.elf \
              build/bootloader/bootloader.bin \
              build/partition_table/partition-table.bin \
              build/flash_args \
              build/flasher_args.json \
              build/project_description.json \
              build/config/sdkconfig.h \
              build/ARSTACK_BUILD_PROFILE.json \
              sdkconfig.defaults > build/SHA256SUMS
          )
          echo "FLASHABLE/READY: complete ESP32-P4 firmware set verified."

      - name: Upload ESP32-P4 flashable firmware
        uses: actions/upload-artifact@v4
        with:
          name: esp32p4-sv-trial-firmware-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ports/esp_idf/sv_trial_app/build/arstack61850_esp32p4_sv_trial.bin
            ports/esp_idf/sv_trial_app/build/arstack61850_esp32p4_sv_trial.elf
            ports/esp_idf/sv_trial_app/build/arstack61850_esp32p4_sv_trial.map
            ports/esp_idf/sv_trial_app/build/bootloader/bootloader.bin
            ports/esp_idf/sv_trial_app/build/partition_table/partition-table.bin
            ports/esp_idf/sv_trial_app/build/flash_args
            ports/esp_idf/sv_trial_app/build/flasher_args.json
            ports/esp_idf/sv_trial_app/build/project_description.json
            ports/esp_idf/sv_trial_app/build/config/sdkconfig.h
            ports/esp_idf/sv_trial_app/build/ARSTACK_BUILD_PROFILE.json
            ports/esp_idf/sv_trial_app/build/SHA256SUMS
            ports/esp_idf/sv_trial_app/sdkconfig.defaults
            ports/esp_idf/sv_trial_app/README.md
