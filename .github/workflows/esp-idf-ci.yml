name: ESP-IDF Compile CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  esp32p4-compile:
    name: ESP32-P4 / ESP-IDF v6.0.2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build ESP32-P4 component smoke app
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32p4
          path: ports/esp_idf/smoke_app
