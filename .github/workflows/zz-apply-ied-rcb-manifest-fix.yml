name: Apply targeted IED RCB manifest source patch

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch production manifest compiler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/ied_simulator/src/IedFleetController.cpp")
          text = path.read_text(encoding="utf-8")

          old_include = '#include "IedFleetController.hpp"\n#include "IedRuntimeGuardrails.hpp"'
          new_include = '#include "IedFleetController.hpp"\n#include "IedReportControlManifest.hpp"\n#include "IedRuntimeGuardrails.hpp"'
          if text.count(old_include) != 1:
              raise SystemExit("expected IedFleetController include anchor exactly once")
          text = text.replace(old_include, new_include, 1)

          start = text.index("    QSet<QString> emittedReportControls;\n    for (const auto& report : loaded.document.report_controls) {")
          end_marker = "\n\n    if (uniqueRoots.isEmpty()) {"
          end = text.index(end_marker, start)
          replacement = '''    QSet<QString> emittedReportControls;
    for (const auto& report : loaded.document.report_controls) {
        manifest += arstack::iedsim::reportControlManifestLines(
            report,
            activeIedName,
            emittedReportControls);
    }'''
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify targeted diff
        shell: bash
        run: |
          set -euo pipefail
          grep -F '#include "IedReportControlManifest.hpp"' apps/ied_simulator/src/IedFleetController.cpp
          grep -F 'arstack::iedsim::reportControlManifestLines' apps/ied_simulator/src/IedFleetController.cpp
          if grep -F 'const auto name = qstring(report.name);' apps/ied_simulator/src/IedFleetController.cpp; then
            echo "legacy RCB compiler block still present" >&2
            exit 1
          fi

      - name: Commit source patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-apply-ied-rcb-manifest-fix.yml
          git add apps/ied_simulator/src/IedFleetController.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ied-sim): expand indexed ReportControl runtime instances"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
