name: IED Simulator P4 Third-Party Interop

on:
  push:
    branches: [agent/p4-thirdparty-interop, agent/iedsim-full-scl-live-store]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libiec61850-wire-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIBIEC_COMMIT: 664aa00b447292afdf86330745df1b25328aa98f
      PORT: '18102'
    steps:
      - name: Checkout ARStack61850
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Install capture tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ninja-build tshark strace

      - name: Build IED Simulator
        shell: bash
        run: |
          set -euo pipefail
          cmake -S apps/ied_simulator -B build-p4-qt -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-p4-qt --target arstack_ied_simulator --parallel 2
          APP=$(find build-p4-qt -type f -name arstack_ied_simulator -perm -111 | head -1)
          SERVER_CORE=$(find build-p4-qt -type f -name libariec61850_ied_simulator_server_core.a | head -1)
          ARSTACK_CORE=$(find build-p4-qt -type f -name libariec61850_core.a | head -1)
          test -n "$APP"
          test -n "$SERVER_CORE"
          test -n "$ARSTACK_CORE"
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "SERVER_CORE=$SERVER_CORE" >> "$GITHUB_ENV"
          echo "ARSTACK_CORE_LIB=$ARSTACK_CORE" >> "$GITHUB_ENV"

      - name: Decode captured libiec61850 GetNameList vector through ARStack layers
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tests/interop/p4_libiec61850_wire_decode.cpp "$SERVER_CORE" -lpthread \
            -o p4-wire-decode-probe
          ./p4-wire-decode-probe

      - name: Validate libiec61850 integer OriginatorCategory compatibility
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror -Iinclude \
            tests/interop/p4_libiec61850_control_oper_decode.cpp \
            -Wl,--start-group "$SERVER_CORE" "$ARSTACK_CORE_LIB" -Wl,--end-group \
            -lpthread -o p4-control-orcat-probe
          ./p4-control-orcat-probe

      - name: Build pinned independent libiec61850 client
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mz-automation/libiec61850.git vendor/libiec61850
          git -C vendor/libiec61850 checkout --quiet "$LIBIEC_COMMIT"
          test "$(git -C vendor/libiec61850 rev-parse HEAD)" = "$LIBIEC_COMMIT"
          make -C vendor/libiec61850 -j2
          gcc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Ivendor/libiec61850/config \
            -Ivendor/libiec61850/hal/inc \
            -Ivendor/libiec61850/src/common/inc \
            -Ivendor/libiec61850/src/mms/inc \
            -Ivendor/libiec61850/src/mms/inc_private \
            -Ivendor/libiec61850/src/mms/asn1 \
            -Ivendor/libiec61850/src/iec61850/inc \
            -Ivendor/libiec61850/src/iec61850/inc_private \
            -Ivendor/libiec61850/src/goose \
            -Ivendor/libiec61850/src/sampled_values \
            -Ivendor/libiec61850/src/logging \
            -Ivendor/libiec61850/src/tls \
            -Ivendor/libiec61850/src/r_session \
            tests/interop/libiec61850_p4_client.c \
            vendor/libiec61850/build/libiec61850.a \
            -lpthread -lm -o p4-libiec61850-client

      - name: Run third-party interoperability with audited wire evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p4-evidence
          export QT_QPA_PLATFORM=offscreen
          touch p4-evidence/libiec61850-loopback.pcapng
          chmod 666 p4-evidence/libiec61850-loopback.pcapng
          sudo dumpcap -i lo -f "tcp port $PORT" -w p4-evidence/libiec61850-loopback.pcapng >p4-evidence/dumpcap.log 2>&1 &
          CAPTURE_PID=$!
          sleep 0.5
          "$APP" --scl tests/fixtures/scl/iedsim-full-model.scd --port "$PORT" --runtime \
            --set-first-value 42 --set-value-item 'TCTR1$MX$Amp$instMag$i' \
            --state-dump p4-evidence/live-state.json --exit-after-ms 26000 >p4-evidence/server.log 2>&1 &
          APP_PID=$!
          cleanup() {
            if [ "${CAPTURE_PID:-0}" != 0 ] && kill -0 "$CAPTURE_PID" 2>/dev/null; then sudo kill -INT "$CAPTURE_PID" || true; wait "$CAPTURE_PID" || true; fi
            if [ "${APP_PID:-0}" != 0 ] && kill -0 "$APP_PID" 2>/dev/null; then kill "$APP_PID" || true; wait "$APP_PID" || true; fi
          }
          trap cleanup EXIT
          for _ in $(seq 1 120); do
            grep -q 'kind=server_ready' p4-evidence/server.log 2>/dev/null && break
            kill -0 "$APP_PID" 2>/dev/null || { cat p4-evidence/server.log >&2; exit 1; }
            sleep 0.1
          done
          grep -q 'kind=server_ready' p4-evidence/server.log
          for _ in $(seq 1 120); do
            grep -q 'kind=value_state.*value=3432' p4-evidence/server.log 2>/dev/null && break
            kill -0 "$APP_PID" 2>/dev/null || { cat p4-evidence/server.log >&2; exit 1; }
            sleep 0.1
          done
          grep -q 'kind=value_state.*value=3432' p4-evidence/server.log
          set +e
          timeout 20s strace -ff -xx -s 4096 \
            -e trace=connect,sendto,recvfrom,sendmsg,recvmsg,send,recv,write,read \
            -o p4-evidence/client-strace \
            ./p4-libiec61850-client 127.0.0.1 "$PORT" >p4-evidence/client.log 2>&1
          CLIENT_RC=$?
          set -e
          sudo kill -INT "$CAPTURE_PID" || true
          wait "$CAPTURE_PID" || true
          CAPTURE_PID=0
          wait "$APP_PID" || true
          APP_PID=0
          trap - EXIT
          cat p4-evidence/client.log
          cat p4-evidence/dumpcap.log
          test -s p4-evidence/libiec61850-loopback.pcapng
          if ! tshark -r p4-evidence/libiec61850-loopback.pcapng -Y "tcp.port == $PORT" \
            -T fields -e frame.number -e ip.src -e tcp.srcport -e ip.dst -e tcp.dstport -e tcp.len -e tcp.payload \
            > p4-evidence/wire.tsv; then
            : > p4-evidence/wire.tsv
          fi
          cat p4-evidence/wire.tsv
          grep -hE 'connect\(|send(to|msg)?\(|recv(from|msg)?\(' p4-evidence/client-strace* > p4-evidence/socket-syscalls.log || true
          cat p4-evidence/socket-syscalls.log || true
          if [ "$CLIENT_RC" -ne 0 ]; then cat p4-evidence/server.log >&2; exit "$CLIENT_RC"; fi
          cp p4-evidence/libiec61850-loopback.pcapng p4-evidence/libiec61850-loopback.pcap
          python3 scripts/validate-p4-thirdparty-evidence.py \
            --client-log p4-evidence/client.log --server-log p4-evidence/server.log \
            --state p4-evidence/live-state.json --pcap p4-evidence/libiec61850-loopback.pcap \
            --wire-trace p4-evidence/socket-syscalls.log \
            --port "$PORT" --output p4-evidence/evidence.json

      - name: P0-P3 regression on P4 source
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/mms_direct_control_server -B build-p4-control -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-p4-control --target ariec61850_mms_control_interop_client ariec61850_mms_direct_control_tests --parallel 2
          cmake --build build-p4-qt --target ariec61850_mms_read_probe ariec61850_static_rcb_trial --parallel 2
          ctest --test-dir build-p4-control -R mms_direct_control_unit --output-on-failure
          python3 apps/ied_simulator/test_control_live.py --app "$APP" --read-probe build-p4-qt --control-probe build-p4-control --scl tests/fixtures/scl/iedsim-full-model.scd
          python3 apps/ied_simulator/test_gui_live_value.py --app "$APP" --read-probe build-p4-qt --report-probe build-p4-qt --scl tests/fixtures/scl/iedsim-full-model.scd

      - name: Upload P4 third-party evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iedsim-p4-libiec61850-${{ github.sha }}
          path: p4-evidence/
          if-no-files-found: warn
          retention-days: 30
