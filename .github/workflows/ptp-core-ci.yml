name: PTP Core CI

on:
  push:
    paths:
      - 'include/ariec61850/time_sync/**'
      - 'src/time_sync/**'
      - 'include/ariec61850/ethernet/**'
      - 'src/ethernet/**'
      - 'tests/test_ptp.cpp'
      - '.github/workflows/ptp-core-ci.yml'
  pull_request:
    paths:
      - 'include/ariec61850/time_sync/**'
      - 'src/time_sync/**'
      - 'include/ariec61850/ethernet/**'
      - 'src/ethernet/**'
      - 'tests/test_ptp.cpp'
      - '.github/workflows/ptp-core-ci.yml'

permissions:
  contents: read

jobs:
  portable-ptp:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PTP strict profile
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            CXX=clang++
          else
            CXX=g++
          fi
          "$CXX" \
            -std=c++20 \
            -Wall -Wextra -Wpedantic -Wconversion -Wsign-conversion -Werror \
            -pthread \
            -Iinclude \
            src/ethernet/ethernet.cpp \
            src/time_sync/ptp.cpp \
            src/time_sync/ptp_monitor.cpp \
            tests/test_ptp.cpp \
            -o ptp-core-tests

      - name: Run PTP regression tests
        run: ./ptp-core-tests
