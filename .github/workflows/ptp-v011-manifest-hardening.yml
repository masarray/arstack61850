name: Stage v0.1.1 manifest capability hardening

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0

      - name: Require production firmware capabilities in manifest
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/arstack_studio/src/FirmwareManager.cpp')
          text = p.read_text(encoding='utf-8')
          text = text.replace('#include <QJsonDocument>\n#include <QJsonObject>', '#include <QJsonArray>\n#include <QJsonDocument>\n#include <QJsonObject>', 1)
          old = '''    const QString revisionPolicy = object.value(QStringLiteral("chipRevisionPolicy")).toString().trimmed().toLower();\n    const qint64 flashOffset = object.value(QStringLiteral("flashOffset")).toVariant().toLongLong();\n\n    if (imageName.isEmpty() || QFileInfo(imageName).fileName() != imageName ||\n        expectedHash.size() != 64 || version.isEmpty() || protocol < 1 || flashOffset != 0 ||\n        revisionPolicy != QString::fromLatin1(kPreV3Policy)) {\n        bundleStatus_ = QStringLiteral("Firmware manifest fields are incomplete or unsafe.");\n        return false;\n    }'''
          new = '''    const QString revisionPolicy = object.value(QStringLiteral("chipRevisionPolicy")).toString().trimmed().toLower();\n    const qint64 flashOffset = object.value(QStringLiteral("flashOffset")).toVariant().toLongLong();\n    const QJsonArray capabilities = object.value(QStringLiteral("capabilities")).toArray();\n    const auto hasCapability = [&capabilities](const QString& wanted) {\n        for (const auto& value : capabilities) {\n            if (value.toString().compare(wanted, Qt::CaseInsensitive) == 0) return true;\n        }\n        return false;\n    };\n    const bool productionCapabilities =\n        hasCapability(QStringLiteral("SMV-4I4V")) &&\n        hasCapability(QStringLiteral("PROFILE")) &&\n        hasCapability(QStringLiteral("LIVE-SETPOINTS")) &&\n        hasCapability(QStringLiteral("SESSION-LEASE")) &&\n        hasCapability(QStringLiteral("PTP-P2")) &&\n        hasCapability(QStringLiteral("SMPSYNCH-AUTO"));\n\n    if (imageName.isEmpty() || QFileInfo(imageName).fileName() != imageName ||\n        expectedHash.size() != 64 || version.isEmpty() || protocol < 1 || flashOffset != 0 ||\n        revisionPolicy != QString::fromLatin1(kPreV3Policy) || !productionCapabilities) {\n        bundleStatus_ = QStringLiteral("Firmware manifest fields/capabilities are incomplete or unsafe.");\n        return false;\n    }'''
          if text.count(old) != 1:
              raise SystemExit(f'manifest validation anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          text = text.replace(
              'bundleStatus_ = QStringLiteral("Ready · firmware v%1 · ESP32-P4 pre-v3 · SHA-256 verified")',
              'bundleStatus_ = QStringLiteral("Ready · firmware v%1 · ESP32-P4 pre-v3 · PTP-P2 · SHA-256 verified")',
              1)
          p.write_text(text, encoding='utf-8')

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/arstack_studio/src/FirmwareManager.cpp
          git diff --cached --check
          git commit -m "PTP: fail closed on incomplete v0.1.1 firmware capabilities"
          git push origin HEAD:feature/ptp-production-v0.1.1
