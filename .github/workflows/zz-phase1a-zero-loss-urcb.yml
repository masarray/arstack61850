name: Phase1A Zero-Loss URCB Repair

on:
  push:
    branches: [feat/ied-sim-ux-performance-foundation]

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0

      - name: Apply zero-loss ReportControl repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}")
              p.write_text(text.replace(old, new, count))

          # 1) Manifest projection: no datSet means an unconfigured RCB, not a fake LLN0$ DataSet.
          replace(
              'apps/ied_simulator/src/IedReportControlManifest.hpp',
              '''    const auto baseName = QString::fromStdString(report.name);\n    auto dataSetItem = logicalNode + QLatin1Char('$') +\n        QString::fromStdString(report.data_set_name);\n    dataSetItem.replace(QLatin1Char('.'), QLatin1Char('$'));\n    if (domain.isEmpty() || logicalNode.isEmpty() || baseName.isEmpty() || dataSetItem.isEmpty()) {\n        return {};\n    }\n''',
              '''    const auto baseName = QString::fromStdString(report.name);\n    const auto dataSetName = QString::fromStdString(report.data_set_name);\n    QString dataSetDomain;\n    QString dataSetItem;\n    if (!dataSetName.isEmpty()) {\n        dataSetDomain = domain;\n        dataSetItem = logicalNode + QLatin1Char('$') + dataSetName;\n        dataSetItem.replace(QLatin1Char('.'), QLatin1Char('$'));\n    }\n    if (domain.isEmpty() || logicalNode.isEmpty() || baseName.isEmpty()) {\n        return {};\n    }\n''')
          replace(
              'apps/ied_simulator/src/IedReportControlManifest.hpp',
              '''            reportManifestField(reportId) + "\\t" + reportManifestField(domain) + "\\t" +\n            reportManifestField(dataSetItem) + "\\t" +\n''',
              '''            reportManifestField(reportId) + "\\t" + reportManifestField(dataSetDomain) + "\\t" +\n            reportManifestField(dataSetItem) + "\\t" +\n''')

          # 2) Server manifest loader: allow both DataSet fields empty; reject half references.
          replace(
              'tools/static_ied_server.cpp',
              '''        } else if (fields.size() >= 13U && fields[0] == "RCB") {\n            if (fields[1].empty() || fields[2].empty() || fields[4].empty() ||\n                fields[5].empty() || fields[6].empty() ||\n                (fields[3] != "0" && fields[3] != "1")) {\n                throw std::runtime_error("Model manifest contains a malformed RCB entry.");\n            }\n''',
              '''        } else if (fields.size() >= 13U && fields[0] == "RCB") {\n            const bool partial_data_set_reference =\n                fields[5].empty() != fields[6].empty();\n            if (fields[1].empty() || fields[2].empty() || fields[4].empty() ||\n                partial_data_set_reference ||\n                (fields[3] != "0" && fields[3] != "1")) {\n                throw std::runtime_error("Model manifest contains a malformed RCB entry.");\n            }\n''')
          replace(
              'tools/static_ied_server.cpp',
              '''    for (auto& report : parsed_reports) {\n        if (report.buffered) continue;\n        if (!available_data_sets.contains({report.data_set_domain, report.data_set_item}) ||\n            model.report_control_storage.size() >= available_urcb_slots) {\n            ++model.omitted_urcbs;\n            continue;\n        }\n''',
              '''    for (auto& report : parsed_reports) {\n        if (report.buffered) continue;\n        const bool has_data_set = !report.data_set_domain.empty();\n        if ((has_data_set &&\n             !available_data_sets.contains({report.data_set_domain, report.data_set_item})) ||\n            model.report_control_storage.size() >= available_urcb_slots) {\n            ++model.omitted_urcbs;\n            continue;\n        }\n''')

          # 3) Portable URCB runtime: an empty DataSet binding is a valid unconfigured state.
          replace(
              'src/mms/static_urcb_runtime.cpp',
              '''[[nodiscard]] bool valid_reference(\n    const std::string_view domain,\n    const std::string_view item) noexcept {\n    return visible_ascii(\n               domain,\n               MmsStaticUrcbState::maximum_reference_component_bytes) &&\n        visible_ascii(\n            item,\n            MmsStaticUrcbState::maximum_reference_component_bytes) &&\n        domain.size() + 1U + item.size() <=\n            MmsInformationReportSpanCodec::maximum_reference_bytes;\n}\n''',
              '''[[nodiscard]] bool valid_reference(\n    const std::string_view domain,\n    const std::string_view item) noexcept {\n    return visible_ascii(\n               domain,\n               MmsStaticUrcbState::maximum_reference_component_bytes) &&\n        visible_ascii(\n            item,\n            MmsStaticUrcbState::maximum_reference_component_bytes) &&\n        domain.size() + 1U + item.size() <=\n            MmsInformationReportSpanCodec::maximum_reference_bytes;\n}\n\n[[nodiscard]] bool valid_optional_reference(\n    const std::string_view domain,\n    const std::string_view item) noexcept {\n    if (domain.empty() || item.empty()) {\n        return domain.empty() && item.empty();\n    }\n    return valid_reference(domain, item);\n}\n''')
          replace(
              'src/mms/static_urcb_runtime.cpp',
              '''    if (source.empty() || source.size() > destination.size()) {\n        length = 0U;\n        return false;\n    }\n''',
              '''    if (source.size() > destination.size()) {\n        length = 0U;\n        return false;\n    }\n''')
          replace(
              'src/mms/static_urcb_runtime.cpp',
              '''    for (std::size_t index = 0U; index < definitions_.size(); ++index) {\n        const auto& definition = definitions_[index];\n        const auto* data_set = data_sets_->find(object_name(\n            definition.data_set_domain,\n            definition.data_set_item));\n        if (!valid_reference(definition.domain, definition.item) ||\n            !valid_report_id(definition.report_id) ||\n            !valid_reference(definition.data_set_domain, definition.data_set_item) ||\n            !valid_optional_fields(definition.optional_fields) ||\n            !valid_trigger_options(definition.trigger_options) ||\n            data_set == nullptr || data_set->members.empty() ||\n            data_set->members.size() > MmsInformationReportSpanCodec::maximum_members) {\n            return false;\n        }\n''',
              '''    for (std::size_t index = 0U; index < definitions_.size(); ++index) {\n        const auto& definition = definitions_[index];\n        if (!valid_reference(definition.domain, definition.item) ||\n            !valid_report_id(definition.report_id) ||\n            !valid_optional_reference(\n                definition.data_set_domain, definition.data_set_item) ||\n            !valid_optional_fields(definition.optional_fields) ||\n            !valid_trigger_options(definition.trigger_options)) {\n            return false;\n        }\n        if (!definition.data_set_domain.empty()) {\n            const auto* data_set = data_sets_->find(object_name(\n                definition.data_set_domain, definition.data_set_item));\n            if (data_set == nullptr || data_set->members.empty() ||\n                data_set->members.size() > MmsInformationReportSpanCodec::maximum_members) {\n                return false;\n            }\n        }\n''')
          replace(
              'src/mms/static_urcb_runtime.cpp',
              '''    if (state_ref->enabled == enabled) {\n        return MmsStaticUrcbStatus::ok;\n    }\n\n    state_ref->enabled = enabled;\n''',
              '''    if (state_ref->enabled == enabled) {\n        return MmsStaticUrcbStatus::ok;\n    }\n    if (enabled) {\n        if (state_ref->data_set_domain().empty() || state_ref->data_set_item().empty()) {\n            return MmsStaticUrcbStatus::data_set_not_found;\n        }\n        const auto* data_set = data_sets_->find(object_name(\n            state_ref->data_set_domain(), state_ref->data_set_item()));\n        if (data_set == nullptr || data_set->members.empty()) {\n            return MmsStaticUrcbStatus::data_set_not_found;\n        }\n    }\n\n    state_ref->enabled = enabled;\n''')
          replace(
              'src/mms/static_urcb_runtime.cpp',
              '''    if (!valid_reference(domain, item)) {\n        return MmsStaticUrcbStatus::invalid_value;\n    }\n    if (data_sets_->find(object_name(domain, item)) == nullptr) {\n        return MmsStaticUrcbStatus::data_set_not_found;\n    }\n''',
              '''    if (!valid_optional_reference(domain, item)) {\n        return MmsStaticUrcbStatus::invalid_value;\n    }\n    if (!domain.empty()) {\n        const auto* data_set = data_sets_->find(object_name(domain, item));\n        if (data_set == nullptr || data_set->members.empty()) {\n            return MmsStaticUrcbStatus::data_set_not_found;\n        }\n    }\n''')

          # 4) DatSet Read must encode an empty VisibleString, not "/".
          replace(
              'src/mms/static_urcb_objects.cpp',
              '''[[nodiscard]] wire::EncodeResult encode_data_set_reference(\n    const std::string_view domain,\n    const std::string_view item,\n    const std::span<std::uint8_t> destination) noexcept {\n    if (domain.size() > std::numeric_limits<std::size_t>::max() - 1U - item.size()) {\n''',
              '''[[nodiscard]] wire::EncodeResult encode_data_set_reference(\n    const std::string_view domain,\n    const std::string_view item,\n    const std::span<std::uint8_t> destination) noexcept {\n    if (domain.empty() || item.empty()) {\n        return domain.empty() && item.empty()\n            ? encode_visible({}, destination)\n            : wire::EncodeResult{wire::EncodeStatus::value_out_of_range, 0U, 0U};\n    }\n    if (domain.size() > std::numeric_limits<std::size_t>::max() - 1U - item.size()) {\n''')

          # 5) Regression: initialize/read state of an unconfigured URCB, reject enable, then bind and enable.
          replace(
              'tests/test_mms_server_urcb_report.cpp',
              '''    const mms::MmsStaticDataSetTable data_sets{data_set_entries};\n    const mms::MmsStaticApplicationDispatcher dispatcher{object_table, data_sets};\n''',
              '''    const mms::MmsStaticDataSetTable data_sets{data_set_entries};\n\n    const std::array<mms::MmsStaticUrcbDefinition, 1U> unconfigured_definitions{\n        mms::MmsStaticUrcbDefinition{\n            "LD0",\n            "LLN0$RP$Spare01",\n            "LD0/LLN0$RP$Spare",\n            {},\n            {},\n            1U,\n            {0x00U, 0x00U},\n            0U,\n            0x04U,\n            0U}};\n    std::array<mms::MmsStaticUrcbState, 1U> unconfigured_states{};\n    mms::MmsStaticUrcbRuntime unconfigured_reports{\n        unconfigured_definitions, unconfigured_states, object_table, data_sets};\n    if (!unconfigured_reports.initialize()) {\n        return 40;\n    }\n    const auto* unconfigured_state = unconfigured_reports.state(0U);\n    if (unconfigured_state == nullptr ||\n        !unconfigured_state->data_set_domain().empty() ||\n        !unconfigured_state->data_set_item().empty()) {\n        return 41;\n    }\n    if (unconfigured_reports.set_enabled(0U, true, 10U) !=\n        mms::MmsStaticUrcbStatus::data_set_not_found) {\n        return 42;\n    }\n    if (unconfigured_reports.set_data_set(0U, "LD0", "LLN0$Events") !=\n            mms::MmsStaticUrcbStatus::ok ||\n        unconfigured_reports.set_enabled(0U, true, 10U) !=\n            mms::MmsStaticUrcbStatus::ok) {\n        return 43;\n    }\n\n    const mms::MmsStaticApplicationDispatcher dispatcher{object_table, data_sets};\n''')

          print('Phase1A source patch applied')
          PY

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DARIEC61850_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit repair after green gate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/zz-phase1a-zero-loss-urcb.yml
          git add apps/ied_simulator/src/IedReportControlManifest.hpp tools/static_ied_server.cpp src/mms/static_urcb_runtime.cpp src/mms/static_urcb_objects.cpp tests/test_mms_server_urcb_report.cpp
          git commit -m "fix(mms): preserve unconfigured URCB definitions"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
