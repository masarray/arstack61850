name: IED Simulator Qt

on:
  push:
    paths:
      - 'apps/ied_simulator/**'
      - 'include/ariec61850/scl/**'
      - 'src/scl/**'
      - 'include/ariec61850/mms/**'
      - 'src/mms/**'
      - '.github/workflows/ied-simulator-qt.yml'
  pull_request:
    paths:
      - 'apps/ied_simulator/**'
      - 'include/ariec61850/scl/**'
      - 'src/scl/**'
      - 'include/ariec61850/mms/**'
      - 'src/mms/**'
      - '.github/workflows/ied-simulator-qt.yml'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure
        run: >-
          cmake -S apps/ied_simulator -B build-ied-simulator-qt -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-ied-simulator-qt --target arstack_ied_simulator --parallel 2

      - name: QML smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-ied-simulator-qt/arstack_ied_simulator --smoke-test
