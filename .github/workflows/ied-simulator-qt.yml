name: IED Simulator Qt

# Milestone G bootstrap trigger: runtime diagnostics, restart lifecycle, and bounded output.
on:
  push:
    paths:
      - 'apps/ied_simulator/**'
      - 'include/ariec61850/scl/**'
      - 'src/scl/**'
      - 'include/ariec61850/mms/**'
      - 'src/mms/**'
      - 'tools/static_ied_server.cpp'
      - 'tools/mms_read_probe.cpp'
      - 'tools/mms_urcb_gi_probe.cpp'
      - 'tools/mms_brcb_event_probe.cpp'
      - 'tools/static_ied_server_iedsim/**'
      - 'tests/fixtures/scl/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ied-simulator-qt.yml'
  pull_request:
    paths:
      - 'apps/ied_simulator/**'
      - 'include/ariec61850/scl/**'
      - 'src/scl/**'
      - 'include/ariec61850/mms/**'
      - 'src/mms/**'
      - 'tools/static_ied_server.cpp'
      - 'tools/mms_read_probe.cpp'
      - 'tools/mms_urcb_gi_probe.cpp'
      - 'tools/mms_brcb_event_probe.cpp'
      - 'tools/static_ied_server_iedsim/**'
      - 'tests/fixtures/scl/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ied-simulator-qt.yml'

permissions:
  contents: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply milestone G source patch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ied-sim-ux-performance-foundation'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ARStack CI"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin feat/ied-sim-ux-performance-foundation 4225202bcbfcfa71a0d4499d9412f7ac2be2cc0e --depth=1
          git checkout -B feat/ied-sim-ux-performance-foundation origin/feat/ied-sim-ux-performance-foundation
          git show 4225202bcbfcfa71a0d4499d9412f7ac2be2cc0e:.github/workflows/ied-simulator-qt.yml > .github/workflows/ied-simulator-qt.yml
          cat .milestone-g/part*.patch > /tmp/milestone-g.patch
          patch -p1 --forward < /tmp/milestone-g.patch
          git rm -r .milestone-g
          git add .github/workflows/ied-simulator-qt.yml apps/ied_simulator
          git diff --cached --check
          git commit -m "feat(ied-sim): bound runtime diagnostics and restart lifecycle"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure
        run: >-
          cmake -S apps/ied_simulator -B build-ied-simulator-qt -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: >-
          cmake --build build-ied-simulator-qt
          --target arstack_ied_simulator ariec61850_mms_read_probe --parallel 2

      - name: Export simulator source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ied-simulator-source
          path: |
            apps/ied_simulator/src
            apps/ied_simulator/qml
            apps/ied_simulator/CMakeLists.txt
            .github/workflows/ied-simulator-qt.yml
          if-no-files-found: error
          retention-days: 1

      - name: QML smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-ied-simulator-qt/arstack_ied_simulator --smoke-test

      - name: Prove interactive SCL import uses bounded async path
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ./build-ied-simulator-qt/arstack_ied_simulator
          --qa-async-import ./tests/fixtures/scl/minimal-station-brcb.scd

      - name: Prove malformed SCL fails closed
        run: >-
          python3 apps/ied_simulator/test_malformed_import.py
          --app ./build-ied-simulator-qt/arstack_ied_simulator

      - name: Start stop restart lifecycle soak
        run: >-
          python3 apps/ied_simulator/test_runtime_lifecycle.py
          --app ./build-ied-simulator-qt/arstack_ied_simulator
          --scl ./tests/fixtures/scl/minimal-station-brcb.scd
          --cycles 12

      - name: Large SCL import performance gates
        run: >-
          python3 apps/ied_simulator/benchmark_large_scl.py
          --app ./build-ied-simulator-qt/arstack_ied_simulator
          --targets 5000,20000,50000

      - name: Capture workbench visual regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ./build-ied-simulator-qt/arstack_ied_simulator
          --scl ./tests/fixtures/scl/minimal-station-brcb.scd
          --screenshot ./ied-simulator-workbench.png

      - name: Upload workbench screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ied-simulator-workbench
          path: ied-simulator-workbench.png
          if-no-files-found: error
          retention-days: 14

      - name: Prove GUI value is visible through MMS
        run: >-
          python3 apps/ied_simulator/test_gui_live_value.py
          --app ./build-ied-simulator-qt/arstack_ied_simulator
          --read-probe ./build-ied-simulator-qt
          --scl ./tests/fixtures/scl/minimal-station-brcb.scd

      - name: Prove two IEDs can share TCP port across distinct local IPs
        run: >-
          python3 apps/ied_simulator/test_gui_multi_ied.py
          --app ./build-ied-simulator-qt/arstack_ied_simulator
          --read-probe ./build-ied-simulator-qt
          --scl ./tests/fixtures/scl/compact-multi-stream.scd
