name: Apply coalesced TPKT receive fix

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation
    paths:
      - .github/workflows/zz-fix-coalesced-tpkt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0
      - name: Apply receive-buffer fix and regression
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/apply_fix.py
          python3 /tmp/apply_fix.py
          git diff --check
          grep -F 'Always consume frames already buffered' src/mms/association_runtime.cpp
          grep -F 'coalesced TPKT buffered receive' tests/test_mms_runtime.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(mms): drain buffered TPKT before socket wait'
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
