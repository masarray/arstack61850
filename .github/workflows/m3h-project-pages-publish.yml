name: Publish ARStack Latest Stable Product Landing to Project Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/screenshots/arstack-studio-windows.png'
      - 'assets/favicon.ico'
      - 'assets/favicon-96x96.png'
      - 'assets/apple-touch-icon.png'
      - 'assets/site.webmanifest'
      - 'assets/web-app-manifest-192x192.png'
      - 'assets/web-app-manifest-512x512.png'
      - 'scripts/check_site_visual_assets.py'
      - '.github/workflows/m3h-project-pages-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arstack-latest-project-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'masarray/arstack61850'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate evergreen product landing and packaged release links
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://github.com/masarray/arstack61850/releases/latest' index.html
          grep -Fq 'syncLatestRelease' index.html
          grep -Fq 'data-asset="windows"' index.html
          grep -Fq 'data-asset="portable"' index.html
          grep -Fq 'data-asset="linux"' index.html
          grep -Fq 'class="actionrow hero-downloads"' index.html
          grep -Fq 'Download for Windows' index.html
          grep -Fq 'Download for Linux' index.html
          grep -Fq 'ARStack-Studio-linux-x86_64.AppImage' index.html
          grep -Fq 'data-asset="firmware"' index.html
          grep -Fq 'M3.H' index.html
          grep -Fq '4,705,090' index.html
          grep -Fq 'processbus-sim-dual-stable-20261105' index.html
          grep -Fq 'Three virtual Merging Units. One ESP32-P4.' index.html
          grep -Fq 'ARStack-Studio-win-x64-setup.zip' index.html
          grep -Fq 'firmware-catalog.json' index.html
          grep -Fq 'PROCESSBUS_AUTONOMOUS_M3H3_OFFICIAL_20261025.md' index.html
          python3 scripts/check_site_visual_assets.py
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/assets/screenshots
          for asset in favicon.ico favicon-96x96.png apple-touch-icon.png site.webmanifest web-app-manifest-192x192.png web-app-manifest-512x512.png; do
            test -s "assets/$asset"
            cp "assets/$asset" "_site/assets/$asset"
          done
          test -s assets/screenshots/arstack-studio-windows.png
          cp assets/screenshots/arstack-studio-windows.png _site/assets/screenshots/arstack-studio-windows.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy project Pages route /arstack61850/
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirm live GitHub Pages delivery
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --location --silent --show-error \
              "https://masarray.github.io/arstack61850/?build=$GITHUB_SHA&attempt=$attempt" \
              -o /tmp/arstack-live.html; then
              if grep -Fq 'syncLatestRelease' /tmp/arstack-live.html &&
                 grep -Fq 'data-asset="windows"' /tmp/arstack-live.html &&
                 grep -Fq 'data-asset="portable"' /tmp/arstack-live.html &&
                 grep -Fq 'data-asset="linux"' /tmp/arstack-live.html &&
                 grep -Fq 'Download for Windows' /tmp/arstack-live.html &&
                 grep -Fq 'Download for Linux' /tmp/arstack-live.html &&
                 grep -Fq '4,705,090' /tmp/arstack-live.html &&
                 grep -Fq 'processbus-sim-dual-stable-20261105' /tmp/arstack-live.html; then
                for asset in assets/web-app-manifest-192x192.png assets/web-app-manifest-512x512.png assets/favicon-96x96.png assets/screenshots/arstack-studio-windows.png; do
                  published="/tmp/arstack-live-$(basename "$asset")"
                  curl --fail --location --silent --show-error "https://masarray.github.io/arstack61850/$asset?build=$GITHUB_SHA" -o "$published"
                  cmp --silent "$asset" "$published" || { echo "FAIL: published image differs from repository $asset" >&2; exit 1; }
                done
                echo 'PASS: latest release links, original identity files and native screenshot live on project Pages'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'FAIL: Pages still serves an old product snapshot' >&2
          exit 1

