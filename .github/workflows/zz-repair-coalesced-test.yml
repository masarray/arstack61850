name: Repair coalesced TPKT regression source

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation
    paths:
      - .github/workflows/zz-repair-coalesced-test.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0
      - name: Repair regression source
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/repair_test.py
          python3 /tmp/repair_test.py
          git diff --check
          grep -F 'runtime.connect({"127.0.0.1", 102U});' tests/test_mms_runtime.cpp
          grep -F 'MmsDataValue::boolean(true), std::nullopt' tests/test_mms_runtime.cpp
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(mms): cover coalesced TPKT receive'
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
