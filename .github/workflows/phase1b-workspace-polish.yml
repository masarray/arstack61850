name: Phase 1B Workspace Polish

on:
  pull_request:
    paths:
      - 'apps/arstack_studio/qml/**'
      - '.github/scripts/phase1b_workspace_polish.py'
      - '.github/workflows/phase1b-workspace-polish.yml'

permissions:
  contents: write

concurrency:
  group: phase1b-workspace-polish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply workspace polish
        run: python3 .github/scripts/phase1b_workspace_polish.py
      - name: Verify presentation-only invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'text: "Frequency"' apps/arstack_studio/qml/Main.qml
          grep -q 'height: 48' apps/arstack_studio/qml/Main.qml
          grep -q 'color: "#0b1219"' apps/arstack_studio/qml/SignalMatrix.qml
          grep -q 'Layout.preferredHeight: matrix.compact ? 42 : 44' apps/arstack_studio/qml/SignalMatrix.qml
      - name: Commit presentation-only source
        shell: bash
        run: |
          set -euo pipefail
          git add apps/arstack_studio/qml/Main.qml apps/arstack_studio/qml/SignalMatrix.qml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'ARStack UX'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(studio): polish injection workspace for demo'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
