name: P0.2 canonical InformationReport bootstrap

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation
    paths:
      - .github/workflows/p0-2-canonical-report-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0

      - name: Apply canonical report decoder and regression matrix
        run: python .github/p0_2_patch.py

      - name: Configure owning-core regression
        run: cmake -S . -B build-p02 -DCMAKE_BUILD_TYPE=Release -DARIEC61850_BUILD_TOOLS=OFF

      - name: Build and run canonical decoder regression
        run: |
          cmake --build build-p02 --target ariec61850_reporting_tests --parallel
          ctest --test-dir build-p02 -R '^ariec61850_reporting_tests$' --output-on-failure

      - name: Configure embedded server regression
        run: cmake -S embedded -B build-p02-embedded -DCMAKE_BUILD_TYPE=Release

      - name: Build and run canonical BRCB encoder regression
        run: |
          cmake --build build-p02-embedded --target ariec61850_embedded_mms_brcb_smoke --parallel
          ctest --test-dir build-p02-embedded -R '^ariec61850_embedded_mms_brcb_smoke$' --output-on-failure

      - name: Commit verified P0.2 source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ARStack P0 Bot"
          git config user.email "actions@github.com"
          git add src/mms/reporting.cpp tests/test_reporting.cpp embedded/mms_brcb_hard_profile_smoke.cpp
          git diff --cached --check
          git commit -m "fix(mms): align InformationReport decoder with canonical payload order"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
