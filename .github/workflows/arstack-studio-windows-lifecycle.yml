name: ARStack Studio Windows Lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'apps/arstack_studio/**'
      - '.github/workflows/arstack-studio-windows-lifecycle.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'apps/arstack_studio/**'
      - '.github/workflows/arstack-studio-windows-lifecycle.yml'

permissions:
  contents: read

concurrency:
  group: arstack-studio-windows-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  close-exit-reopen:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Close -> process exit -> immediate reopen
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          modules: 'qtserialport'
          cache: true
      - name: Configure Studio
        shell: powershell
        run: |
          cmake -S apps/arstack_studio -B build-arstack-studio -G "Visual Studio 17 2022" -A x64 `
            -DARIEC61850_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { throw "Studio configure failed: $LASTEXITCODE" }
      - name: Build actual Studio executable
        shell: powershell
        run: |
          cmake --build build-arstack-studio --config Release --target arstack_studio --parallel
          if ($LASTEXITCODE -ne 0) { throw "Studio build failed: $LASTEXITCODE" }
      - name: Two-cycle normal-close lifecycle regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $candidate = Get-ChildItem -Path (Join-Path $PWD 'build-arstack-studio') -Recurse -File |
            Where-Object { $_.Name -ieq 'arstack_studio.exe' -or $_.Name -ieq 'ARStackStudio.exe' } |
            Select-Object -First 1
          if ($null -eq $candidate) { throw 'Built ARStack Studio executable was not found.' }
          $exe = $candidate.FullName
          function Invoke-LifecycleCycle([int]$Cycle) {
            $startInfo = New-Object System.Diagnostics.ProcessStartInfo
            $startInfo.FileName = $exe
            $startInfo.Arguments = '--check-app-lifecycle'
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              $process.Dispose()
              throw "Cycle ${Cycle}: failed to start Studio process."
            }
            $pidValue = $process.Id
            if (-not $process.WaitForExit(12000)) {
              Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
              $process.Dispose()
              throw "Cycle ${Cycle}: Studio process did not exit within 12 seconds after normal primary-window close."
            }
            $exitCode = $process.ExitCode
            $process.Dispose()
            if ($exitCode -ne 0) { throw "Cycle ${Cycle}: Studio lifecycle coordinator exited with code $exitCode." }
            if (Get-Process -Id $pidValue -ErrorAction SilentlyContinue) { throw "Cycle ${Cycle}: Studio PID $pidValue remained alive after native WaitForExit." }
            Write-Host "Cycle $Cycle PASS: normal close -> clean worker retirement -> PID exit."
          }
          Invoke-LifecycleCycle 1
          Start-Sleep -Milliseconds 250
          Invoke-LifecycleCycle 2
          Write-Host 'Windows lifecycle gate: PASS · normal close -> process exit -> lock release -> immediate reopen -> clean exit'

      - name: Studio UI geometry acceptance and Windows screenshots
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # The GitHub runner's virtual desktop clamps physical window sizes.
          # Exercise *exact* logical viewports using Windows-built Qt Quick
          # offscreen software rendering. These PNGs are layout evidence,
          # NOT an assertion of real on-monitor Windows color/hover fidelity.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $candidate = Get-ChildItem -Path (Join-Path $PWD 'build-arstack-studio') -Recurse -File |
            Where-Object { $_.Name -ieq 'arstack_studio.exe' -or $_.Name -ieq 'ARStackStudio.exe' } |
            Select-Object -First 1
          if ($null -eq $candidate) { throw 'Studio GUI executable not found' }
          $exe = $candidate.FullName
          New-Item -ItemType Directory -Path 'studio-ui-evidence' -Force | Out-Null
          Remove-Item Env:ARSTACK_STUDIO_QA_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:ARSTACK_STUDIO_QA_NATIVE_ONLY -ErrorAction SilentlyContinue
          foreach ($scale in @('1', '1.5', '1.75')) {
            $env:QT_SCALE_FACTOR = $scale
            $suffix = 'dpi-' + [string][int]([double]::Parse($scale, [System.Globalization.CultureInfo]::InvariantCulture) * 100)
            $logdir = Join-Path (Join-Path $PWD 'studio-ui-evidence') $suffix
            New-Item -ItemType Directory -Path $logdir -Force | Out-Null
            # Software viewport shots, when grabWindow supports the CI backend.
            # Native Windows fidelity is verified separately below.
            $env:ARSTACK_STUDIO_QA_DIR = $logdir
            $stdout = Join-Path $logdir 'geometry-stdout.txt'
            $stderr = Join-Path $logdir 'geometry-stderr.txt'
            $probe = Start-Process -FilePath $exe -ArgumentList '--check-operator-ui' -Wait -PassThru `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            if ($probe.ExitCode -ne 0) {
              throw "Deterministic Qt Quick viewport geometry failed at DPI=$scale, exit=$($probe.ExitCode)"
            }
          }
          # Offscreen grabWindow() is not a reliable image source. Capture
          # one supported native Windows viewport separately at 100% DPI.
          Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QUICK_BACKEND -ErrorAction SilentlyContinue
          $env:QT_SCALE_FACTOR = '1'
          $env:ARSTACK_STUDIO_QA_NATIVE_ONLY = '1'
          $env:ARSTACK_STUDIO_QA_DIR = Join-Path $PWD 'studio-ui-evidence\native-windows'
          New-Item -ItemType Directory -Path $env:ARSTACK_STUDIO_QA_DIR -Force | Out-Null
          $stdout = Join-Path $env:ARSTACK_STUDIO_QA_DIR 'native-stdout.txt'
          $stderr = Join-Path $env:ARSTACK_STUDIO_QA_DIR 'native-stderr.txt'
          $probe = Start-Process -FilePath $exe -ArgumentList '--check-operator-ui' -Wait -PassThru `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          if ($probe.ExitCode -ne 0) {
            throw "Native Windows screenshot acceptance failed, exit=$($probe.ExitCode)"
          }
          $png = Join-Path $env:ARSTACK_STUDIO_QA_DIR 'studio-960x680.png'
          if (-not (Test-Path $png) -or (Get-Item $png).Length -lt 10000) {
            throw 'Native Windows 960x680 screenshot was missing or empty'
          }
          Write-Host 'Windows Qt deterministic 5-viewports x 3-DPI geometry + native 960x680 screenshot: PASS'
      - name: Upload desktop layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arstack-studio-windows-layout-evidence
          path: studio-ui-evidence/
          if-no-files-found: ignore
          retention-days: 7
