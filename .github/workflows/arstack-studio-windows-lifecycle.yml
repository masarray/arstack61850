name: ARStack Studio Windows Lifecycle

on:
  push:
    paths:
      - 'apps/arstack_studio/**'
      - '.github/workflows/arstack-studio-windows-lifecycle.yml'
  pull_request:
    paths:
      - 'apps/arstack_studio/**'
      - '.github/workflows/arstack-studio-windows-lifecycle.yml'

permissions:
  contents: write

concurrency:
  group: arstack-studio-windows-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair-source:
    name: Apply one-shot P0 firmware build identity repair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0
      - name: Apply P0 repair
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'firmwareBuildId' apps/arstack_studio/src/DeviceController.hpp; then
            echo 'P0 build identity repair already applied; no-op.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/p0_firmware_build_identity_repair.py')
          text = p.read_text(encoding='utf-8')
          old = '''if(NOT ARSTACK_FIRMWARE_BUILD_ID MATCHES "^[0-9a-f]{16}$")
    message(FATAL_ERROR "ARSTACK_FIRMWARE_BUILD_ID must be exactly 16 hexadecimal characters")
endif()'''
          new = '''string(LENGTH "${ARSTACK_FIRMWARE_BUILD_ID}" ARSTACK_FIRMWARE_BUILD_ID_LENGTH)
if(NOT ARSTACK_FIRMWARE_BUILD_ID_LENGTH EQUAL 16 OR NOT ARSTACK_FIRMWARE_BUILD_ID MATCHES "^[0-9a-f]+$")
    message(FATAL_ERROR "ARSTACK_FIRMWARE_BUILD_ID must be exactly 16 hexadecimal characters")
endif()'''
          if old not in text:
              raise SystemExit('repair-script CMake validation block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/scripts/p0_firmware_build_identity_repair.py
      - name: Verify repair invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -R "firmwareBuildId" -n apps/arstack_studio/src apps/arstack_studio/qml/FirmwarePanel.qml
          grep -F 'build=%s boot_id=' embedded/esp32p4_smv_injector/main/live_control.cpp
          grep -F '"buildId": source_commit[:16].lower()' .github/workflows/esp32p4-smv-injector.yml
          grep -F 'same version stale build -> firmware update' apps/arstack_studio/src/DeterministicSessionHarness.cpp
      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ARStack P0 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add embedded/esp32p4_smv_injector apps/arstack_studio .github/workflows/esp32p4-smv-injector.yml
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "fix(p0): bind firmware updates to semantic build identity"
          git push origin HEAD:feature/ptp-production-v0.1.1

  close-exit-reopen:
    name: Close -> process exit -> immediate reopen
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          modules: 'qtserialport'
          cache: true
      - name: Configure Studio
        shell: powershell
        run: |
          cmake -S apps/arstack_studio -B build-arstack-studio -G "Visual Studio 17 2022" -A x64 `
            -DARIEC61850_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { throw "Studio configure failed: $LASTEXITCODE" }
      - name: Build actual Studio executable
        shell: powershell
        run: |
          cmake --build build-arstack-studio --config Release --target arstack_studio --parallel
          if ($LASTEXITCODE -ne 0) { throw "Studio build failed: $LASTEXITCODE" }
      - name: Two-cycle normal-close lifecycle regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $candidate = Get-ChildItem -Path (Join-Path $PWD 'build-arstack-studio') -Recurse -File |
            Where-Object { $_.Name -ieq 'arstack_studio.exe' -or $_.Name -ieq 'ARStackStudio.exe' } |
            Select-Object -First 1
          if ($null -eq $candidate) { throw 'Built ARStack Studio executable was not found.' }
          $exe = $candidate.FullName
          function Invoke-LifecycleCycle([int]$Cycle) {
            $startInfo = New-Object System.Diagnostics.ProcessStartInfo
            $startInfo.FileName = $exe
            $startInfo.Arguments = '--check-app-lifecycle'
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $process = New-Object System.Diagnostics.Process
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              $process.Dispose()
              throw "Cycle ${Cycle}: failed to start Studio process."
            }
            $pidValue = $process.Id
            if (-not $process.WaitForExit(12000)) {
              Stop-Process -Id $pidValue -Force -ErrorAction SilentlyContinue
              $process.Dispose()
              throw "Cycle ${Cycle}: Studio process did not exit within 12 seconds after normal primary-window close."
            }
            $exitCode = $process.ExitCode
            $process.Dispose()
            if ($exitCode -ne 0) { throw "Cycle ${Cycle}: Studio lifecycle coordinator exited with code $exitCode." }
            if (Get-Process -Id $pidValue -ErrorAction SilentlyContinue) { throw "Cycle ${Cycle}: Studio PID $pidValue remained alive after native WaitForExit." }
            Write-Host "Cycle $Cycle PASS: normal close -> clean worker retirement -> PID exit."
          }
          Invoke-LifecycleCycle 1
          Start-Sleep -Milliseconds 250
          Invoke-LifecycleCycle 2
          Write-Host 'Windows lifecycle gate: PASS · normal close -> process exit -> lock release -> immediate reopen -> clean exit'
