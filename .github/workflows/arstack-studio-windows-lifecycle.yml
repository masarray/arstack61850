name: ARStack Studio Windows Lifecycle

on:
  push:
    paths:
      - 'apps/arstack_studio/**'
      - '.github/workflows/arstack-studio-windows-lifecycle.yml'
  pull_request:
    paths:
      - 'apps/arstack_studio/**'
      - '.github/workflows/arstack-studio-windows-lifecycle.yml'

permissions:
  contents: read

concurrency:
  group: arstack-studio-windows-lifecycle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  close-exit-reopen:
    name: Close -> process exit -> immediate reopen
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.3'
          arch: win64_msvc2022_64
          modules: 'qtserialport'
          cache: true

      - name: Configure Studio
        shell: powershell
        run: |
          cmake -S apps/arstack_studio -B build-arstack-studio -G "Visual Studio 17 2022" -A x64 `
            -DARIEC61850_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE -ne 0) { throw "Studio configure failed: $LASTEXITCODE" }

      - name: Build actual Studio executable
        shell: powershell
        run: |
          cmake --build build-arstack-studio --config Release --target arstack_studio --parallel
          if ($LASTEXITCODE -ne 0) { throw "Studio build failed: $LASTEXITCODE" }

      - name: Two-cycle graceful lifecycle regression
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'

          $candidate = Get-ChildItem -Path (Join-Path $PWD 'build-arstack-studio') -Recurse -File |
            Where-Object { $_.Name -ieq 'arstack_studio.exe' -or $_.Name -ieq 'ARStackStudio.exe' } |
            Select-Object -First 1
          if ($null -eq $candidate) {
            throw 'Built ARStack Studio executable was not found.'
          }
          $exe = $candidate.FullName
          Write-Host "Lifecycle executable: $exe"

          function Invoke-LifecycleCycle([int]$Cycle) {
            $stdout = Join-Path $env:RUNNER_TEMP "arstack-lifecycle-$Cycle.out.log"
            $stderr = Join-Path $env:RUNNER_TEMP "arstack-lifecycle-$Cycle.err.log"
            Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

            $process = Start-Process -FilePath $exe `
              -ArgumentList '--check-app-lifecycle' `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr

            if (-not $process.WaitForExit(12000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Cycle $Cycle: Studio process did not exit within 12 seconds after primary-window close."
            }

            $process.WaitForExit()
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue

            if ($process.ExitCode -ne 0) {
              throw "Cycle $Cycle: Studio exited with code $($process.ExitCode)."
            }
            if (Get-Process -Id $process.Id -ErrorAction SilentlyContinue) {
              throw "Cycle $Cycle: Studio PID $($process.Id) remained alive after WaitForExit."
            }

            $combined = ((Get-Content $stdout -Raw -ErrorAction SilentlyContinue) + "`n" +
                         (Get-Content $stderr -Raw -ErrorAction SilentlyContinue))
            if ($combined -notmatch 'Application lifecycle regression: PASS') {
              throw "Cycle $Cycle: lifecycle coordinator did not report clean worker retirement."
            }
            if ($combined -match 'emergency terminate fallback|emergency worker-retirement fallback|could not be retired') {
              throw "Cycle $Cycle: emergency shutdown fallback was reached."
            }
            Write-Host "Cycle $Cycle PASS: close -> worker retirement -> PID exit."
          }

          Invoke-LifecycleCycle 1
          Start-Sleep -Milliseconds 250
          Invoke-LifecycleCycle 2
          Write-Host 'Windows lifecycle gate: PASS · close -> process exit -> lock release -> immediate reopen -> clean exit'

      - name: Retain lifecycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arstack-studio-windows-lifecycle-logs
          path: |
            ${{ runner.temp }}/arstack-lifecycle-1.out.log
            ${{ runner.temp }}/arstack-lifecycle-1.err.log
            ${{ runner.temp }}/arstack-lifecycle-2.out.log
            ${{ runner.temp }}/arstack-lifecycle-2.err.log
          if-no-files-found: ignore
          retention-days: 7
