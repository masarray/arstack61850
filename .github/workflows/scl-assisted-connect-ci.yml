name: SCL-Assisted Connect CI

on:
  push:
    paths:
      - 'include/ariec61850/mms/scl_assisted_connect.hpp'
      - 'include/ariec61850/mms/live_discovery.hpp'
      - 'src/mms/**'
      - 'src/scl/**'
      - 'include/ariec61850/scl/**'
      - 'tests/test_scl_assisted_connect.cpp'
      - '.github/workflows/scl-assisted-connect-ci.yml'
  pull_request:
    paths:
      - 'include/ariec61850/mms/scl_assisted_connect.hpp'
      - 'include/ariec61850/mms/live_discovery.hpp'
      - 'src/mms/**'
      - 'src/scl/**'
      - 'include/ariec61850/scl/**'
      - 'tests/test_scl_assisted_connect.cpp'
      - '.github/workflows/scl-assisted-connect-ci.yml'

concurrency:
  group: scl-assisted-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure portable core
        run: >-
          cmake -S . -B build
          -DARIEC61850_BUILD_TESTS=OFF
          -DARIEC61850_BUILD_TOOLS=OFF
          -DARIEC61850_WARNINGS_AS_ERRORS=ON

      - name: Build portable core
        run: cmake --build build --target ariec61850_core --parallel 2

      - name: Compile SCL-assisted wire-profile regression
        run: >-
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror
          -Iinclude
          tests/test_scl_assisted_connect.cpp
          build/libariec61850_core.a
          -pthread
          -o build/scl_assisted_connect_profile

      - name: Run SCL-assisted wire-profile regression
        run: ./build/scl_assisted_connect_profile
