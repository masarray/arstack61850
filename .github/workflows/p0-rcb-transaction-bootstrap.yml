name: P0 RCB transaction bootstrap

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation
    paths:
      - .github/workflows/p0-rcb-transaction-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0

      - name: Apply semantic RCB write ordering
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          # Generic object metadata. This keeps the dispatcher protocol-aware but
          # vendor-neutral: banks opt into a transaction group and semantic role.
          replace_once(
              "include/ariec61850/mms/static_object_table.hpp",
              "using MmsStaticContextualWriteCallback = MmsStaticWriteResult (*)(\n"
              "    void* context,\n"
              "    std::span<const std::uint8_t> encoded_data,\n"
              "    const MmsStaticRequestAccessContext& access) noexcept;\n\n"
              "struct MmsStaticObjectEntry final {",
              "using MmsStaticContextualWriteCallback = MmsStaticWriteResult (*)(\n"
              "    void* context,\n"
              "    std::span<const std::uint8_t> encoded_data,\n"
              "    const MmsStaticRequestAccessContext& access) noexcept;\n\n"
              "enum class MmsStaticWriteSemantic : std::uint8_t {\n"
              "    ordinary,\n"
              "    rcb_configuration,\n"
              "    rcb_enable,\n"
              "    rcb_general_interrogation,\n"
              "};\n\n"
              "struct MmsStaticObjectEntry final {")
          replace_once(
              "include/ariec61850/mms/static_object_table.hpp",
              "    // Appended for source compatibility with existing aggregate initializers.\n"
              "    // A contextual callback takes precedence over the legacy write callback.\n"
              "    MmsStaticContextualWriteCallback contextual_write{};\n\n"
              "    [[nodiscard]] constexpr bool writable() const noexcept {",
              "    // Appended for source compatibility with existing aggregate initializers.\n"
              "    // A contextual callback takes precedence over the legacy write callback.\n"
              "    MmsStaticContextualWriteCallback contextual_write{};\n\n"
              "    // Optional semantic transaction metadata. Objects sharing a non-null\n"
              "    // group can be applied in a safe state-machine order while WriteResult\n"
              "    // entries remain aligned with the original MMS variable list.\n"
              "    const void* write_transaction_group{};\n"
              "    MmsStaticWriteSemantic write_semantic{MmsStaticWriteSemantic::ordinary};\n\n"
              "    [[nodiscard]] constexpr bool writable() const noexcept {")

          # BRCB semantics: all mutable fields share one control-block group.
          replace_once(
              "src/mms/static_brcb_objects.cpp",
              "[[nodiscard]] bool writable_attribute(const MmsStaticBrcbAttribute attribute) noexcept {\n"
              "    return attribute == MmsStaticBrcbAttribute::report_enabled ||\n"
              "        attribute == MmsStaticBrcbAttribute::optional_fields ||\n"
              "        attribute == MmsStaticBrcbAttribute::trigger_options ||\n"
              "        attribute == MmsStaticBrcbAttribute::integrity_period ||\n"
              "        attribute == MmsStaticBrcbAttribute::general_interrogation ||\n"
              "        attribute == MmsStaticBrcbAttribute::purge_buffer ||\n"
              "        attribute == MmsStaticBrcbAttribute::entry_id ||\n"
              "        attribute == MmsStaticBrcbAttribute::reservation_time;\n"
              "}\n",
              "[[nodiscard]] bool writable_attribute(const MmsStaticBrcbAttribute attribute) noexcept {\n"
              "    return attribute == MmsStaticBrcbAttribute::report_enabled ||\n"
              "        attribute == MmsStaticBrcbAttribute::optional_fields ||\n"
              "        attribute == MmsStaticBrcbAttribute::trigger_options ||\n"
              "        attribute == MmsStaticBrcbAttribute::integrity_period ||\n"
              "        attribute == MmsStaticBrcbAttribute::general_interrogation ||\n"
              "        attribute == MmsStaticBrcbAttribute::purge_buffer ||\n"
              "        attribute == MmsStaticBrcbAttribute::entry_id ||\n"
              "        attribute == MmsStaticBrcbAttribute::reservation_time;\n"
              "}\n\n"
              "[[nodiscard]] MmsStaticWriteSemantic write_semantic(\n"
              "    const MmsStaticBrcbAttribute attribute) noexcept {\n"
              "    if (attribute == MmsStaticBrcbAttribute::report_enabled) {\n"
              "        return MmsStaticWriteSemantic::rcb_enable;\n"
              "    }\n"
              "    if (attribute == MmsStaticBrcbAttribute::general_interrogation) {\n"
              "        return MmsStaticWriteSemantic::rcb_general_interrogation;\n"
              "    }\n"
              "    return writable_attribute(attribute)\n"
              "        ? MmsStaticWriteSemantic::rcb_configuration\n"
              "        : MmsStaticWriteSemantic::ordinary;\n"
              "}\n")
          replace_once(
              "src/mms/static_brcb_objects.cpp",
              "            nullptr,\n"
              "            writable ? &context : nullptr,\n"
              "            writable ? write_brcb_attribute : nullptr};",
              "            nullptr,\n"
              "            writable ? &context : nullptr,\n"
              "            writable ? write_brcb_attribute : nullptr,\n"
              "            writable ? static_cast<const void*>(control_) : nullptr,\n"
              "            writable ? write_semantic(attribute) : MmsStaticWriteSemantic::ordinary};")

          # URCB semantics: each indexed RCB gets an independent transaction group.
          replace_once(
              "src/mms/static_urcb_objects.cpp",
              "[[nodiscard]] bool writable_attribute(\n"
              "    const MmsStaticUrcbAttribute attribute) noexcept {\n"
              "    return attribute != MmsStaticUrcbAttribute::conf_revision &&\n"
              "        attribute != MmsStaticUrcbAttribute::sequence_number &&\n"
              "        attribute != MmsStaticUrcbAttribute::owner;\n"
              "}\n",
              "[[nodiscard]] bool writable_attribute(\n"
              "    const MmsStaticUrcbAttribute attribute) noexcept {\n"
              "    return attribute != MmsStaticUrcbAttribute::conf_revision &&\n"
              "        attribute != MmsStaticUrcbAttribute::sequence_number &&\n"
              "        attribute != MmsStaticUrcbAttribute::owner;\n"
              "}\n\n"
              "[[nodiscard]] MmsStaticWriteSemantic write_semantic(\n"
              "    const MmsStaticUrcbAttribute attribute) noexcept {\n"
              "    if (attribute == MmsStaticUrcbAttribute::report_enabled) {\n"
              "        return MmsStaticWriteSemantic::rcb_enable;\n"
              "    }\n"
              "    if (attribute == MmsStaticUrcbAttribute::general_interrogation) {\n"
              "        return MmsStaticWriteSemantic::rcb_general_interrogation;\n"
              "    }\n"
              "    return writable_attribute(attribute)\n"
              "        ? MmsStaticWriteSemantic::rcb_configuration\n"
              "        : MmsStaticWriteSemantic::ordinary;\n"
              "}\n")
          replace_once(
              "src/mms/static_urcb_objects.cpp",
              "            const auto attribute = kAttributes[attribute_index];\n"
              "            object_storage_[object_offset] = MmsStaticObjectEntry{\n"
              "                definition->domain,\n"
              "                std::string_view{name, name_size},\n"
              "                type_for(attribute),\n"
              "                read_urcb_attribute,\n"
              "                &context,\n"
              "                false,\n"
              "                writable_attribute(attribute) ? write_urcb_attribute : nullptr,\n"
              "                writable_attribute(attribute) ? &context : nullptr};",
              "            const auto attribute = kAttributes[attribute_index];\n"
              "            const auto writable = writable_attribute(attribute);\n"
              "            const auto* transaction_group = static_cast<const void*>(\n"
              "                &context_storage_[urcb_index * attributes_per_control_block]);\n"
              "            object_storage_[object_offset] = MmsStaticObjectEntry{\n"
              "                definition->domain,\n"
              "                std::string_view{name, name_size},\n"
              "                type_for(attribute),\n"
              "                read_urcb_attribute,\n"
              "                &context,\n"
              "                false,\n"
              "                writable ? write_urcb_attribute : nullptr,\n"
              "                writable ? &context : nullptr,\n"
              "                nullptr,\n"
              "                writable ? transaction_group : nullptr,\n"
              "                writable ? write_semantic(attribute) : MmsStaticWriteSemantic::ordinary};")

          # Dispatcher: reorder only slots belonging to the same opted-in RCB group.
          # Disables happen before configuration, enables after configuration, GI last.
          replace_once(
              "src/mms/static_dispatcher.cpp",
              "[[nodiscard]] MmsStaticDispatchResult dispatch_write(\n",
              "[[nodiscard]] bool decode_write_boolean(\n"
              "    const std::span<const std::uint8_t> encoded,\n"
              "    bool& value) noexcept {\n"
              "    value = false;\n"
              "    asn1::BerTlvView tlv;\n"
              "    if (!asn1::BerSpanReader::try_read_exact(encoded, tlv) ||\n"
              "        tlv.tag_class != asn1::BerClass::context_specific ||\n"
              "        tlv.tag_number != 3 || tlv.constructed || tlv.value.size() != 1U) {\n"
              "        return false;\n"
              "    }\n"
              "    value = tlv.value[0] != 0U;\n"
              "    return true;\n"
              "}\n\n"
              "[[nodiscard]] std::uint8_t write_phase(\n"
              "    const MmsStaticObjectEntry& object,\n"
              "    const std::span<const std::uint8_t> value) noexcept {\n"
              "    switch (object.write_semantic) {\n"
              "    case MmsStaticWriteSemantic::rcb_enable: {\n"
              "        bool enable = true;\n"
              "        if (decode_write_boolean(value, enable) && !enable) return 0U;\n"
              "        return 2U;\n"
              "    }\n"
              "    case MmsStaticWriteSemantic::rcb_configuration:\n"
              "        return 1U;\n"
              "    case MmsStaticWriteSemantic::rcb_general_interrogation:\n"
              "        return 3U;\n"
              "    case MmsStaticWriteSemantic::ordinary:\n"
              "        return 1U;\n"
              "    }\n"
              "    return 1U;\n"
              "}\n\n"
              "void build_write_execution_order(\n"
              "    const std::span<const MmsStaticObjectEntry* const> resolved,\n"
              "    const std::span<const std::span<const std::uint8_t>> values,\n"
              "    const std::span<std::size_t> order) noexcept {\n"
              "    for (std::size_t index = 0U; index < order.size(); ++index) order[index] = index;\n"
              "    for (std::size_t first = 0U; first < order.size(); ++first) {\n"
              "        const auto* object = resolved[first];\n"
              "        if (object == nullptr || object->write_transaction_group == nullptr) continue;\n"
              "        bool seen = false;\n"
              "        for (std::size_t previous = 0U; previous < first; ++previous) {\n"
              "            const auto* candidate = resolved[previous];\n"
              "            if (candidate != nullptr &&\n"
              "                candidate->write_transaction_group == object->write_transaction_group) {\n"
              "                seen = true;\n"
              "                break;\n"
              "            }\n"
              "        }\n"
              "        if (seen) continue;\n\n"
              "        std::array<std::size_t, MmsServiceSpanCodec::maximum_variables> positions{};\n"
              "        std::array<std::size_t, MmsServiceSpanCodec::maximum_variables> members{};\n"
              "        std::size_t count = 0U;\n"
              "        for (std::size_t index = first; index < order.size(); ++index) {\n"
              "            const auto* candidate = resolved[index];\n"
              "            if (candidate != nullptr &&\n"
              "                candidate->write_transaction_group == object->write_transaction_group) {\n"
              "                positions[count] = index;\n"
              "                members[count] = index;\n"
              "                ++count;\n"
              "            }\n"
              "        }\n"
              "        for (std::size_t i = 1U; i < count; ++i) {\n"
              "            const auto member = members[i];\n"
              "            const auto phase = write_phase(*resolved[member], values[member]);\n"
              "            std::size_t j = i;\n"
              "            while (j > 0U &&\n"
              "                   write_phase(*resolved[members[j - 1U]], values[members[j - 1U]]) > phase) {\n"
              "                members[j] = members[j - 1U];\n"
              "                --j;\n"
              "            }\n"
              "            members[j] = member;\n"
              "        }\n"
              "        for (std::size_t i = 0U; i < count; ++i) order[positions[i]] = members[i];\n"
              "    }\n"
              "}\n\n"
              "[[nodiscard]] MmsStaticDispatchResult dispatch_write(\n")
          replace_once(
              "src/mms/static_dispatcher.cpp",
              "    std::array<MmsWriteAccessResultInput, MmsServiceSpanCodec::maximum_variables> results{};\n"
              "    for (std::size_t index = 0U; index < request.variable_count; ++index) {\n"
              "        const auto* object = resolved[index];\n"
              "        if (object == nullptr) {\n"
              "            results[index] = MmsWriteAccessResultInput{false, policy.missing_object_failure_code};\n"
              "            continue;\n"
              "        }\n"
              "        if (!object->writable()) {\n"
              "            results[index] = MmsWriteAccessResultInput{false, policy.access_denied_failure_code};\n"
              "            continue;\n"
              "        }\n"
              "        const auto applied = object->contextual_write != nullptr\n"
              "            ? object->contextual_write(object->write_context, values[index], access)\n"
              "            : object->write(object->write_context, values[index]);\n"
              "        results[index] = MmsWriteAccessResultInput{\n"
              "            applied.success,\n"
              "            applied.success ? 0U : applied.failure_code};\n"
              "    }",
              "    std::array<MmsWriteAccessResultInput, MmsServiceSpanCodec::maximum_variables> results{};\n"
              "    std::array<std::size_t, MmsServiceSpanCodec::maximum_variables> execution_order{};\n"
              "    build_write_execution_order(\n"
              "        std::span<const MmsStaticObjectEntry* const>{resolved}.first(request.variable_count),\n"
              "        std::span<const std::span<const std::uint8_t>>{values}.first(request.variable_count),\n"
              "        std::span<std::size_t>{execution_order}.first(request.variable_count));\n"
              "    for (std::size_t execution = 0U; execution < request.variable_count; ++execution) {\n"
              "        const auto index = execution_order[execution];\n"
              "        const auto* object = resolved[index];\n"
              "        if (object == nullptr) {\n"
              "            results[index] = MmsWriteAccessResultInput{false, policy.missing_object_failure_code};\n"
              "            continue;\n"
              "        }\n"
              "        if (!object->writable()) {\n"
              "            results[index] = MmsWriteAccessResultInput{false, policy.access_denied_failure_code};\n"
              "            continue;\n"
              "        }\n"
              "        const auto applied = object->contextual_write != nullptr\n"
              "            ? object->contextual_write(object->write_context, values[index], access)\n"
              "            : object->write(object->write_context, values[index]);\n"
              "        results[index] = MmsWriteAccessResultInput{\n"
              "            applied.success,\n"
              "            applied.success ? 0U : applied.failure_code};\n"
              "    }")

          # Regression: deliberately put RptEna=true before TrgOps in one MMS Write.
          # The server must configure first internally while preserving result order.
          p = Path("embedded/mms_brcb_objects_hard_profile_smoke.cpp")
          text = p.read_text()
          old = """        0x30U,0x14U,0xA0U,0x12U,0xA1U,0x10U,0x1AU,0x03U,0x4CU,0x44U,0x30U,\n        0x1AU,0x09U,0x42U,0x31U,0x24U,0x54U,0x72U,0x67U,0x4FU,0x70U,0x73U,\n        0x30U,0x14U,0xA0U,0x12U,0xA1U,0x10U,0x1AU,0x03U,0x4CU,0x44U,0x30U,\n        0x1AU,0x09U,0x42U,0x31U,0x24U,0x52U,0x70U,0x74U,0x45U,0x6EU,0x61U,\n        0xA0U,0x07U,0x84U,0x02U,0x02U,0x7CU,0x83U,0x01U,0xFFU};"""
          new = """        0x30U,0x14U,0xA0U,0x12U,0xA1U,0x10U,0x1AU,0x03U,0x4CU,0x44U,0x30U,\n        0x1AU,0x09U,0x42U,0x31U,0x24U,0x52U,0x70U,0x74U,0x45U,0x6EU,0x61U,\n        0x30U,0x14U,0xA0U,0x12U,0xA1U,0x10U,0x1AU,0x03U,0x4CU,0x44U,0x30U,\n        0x1AU,0x09U,0x42U,0x31U,0x24U,0x54U,0x72U,0x67U,0x4FU,0x70U,0x73U,\n        0xA0U,0x07U,0x83U,0x01U,0xFFU,0x84U,0x02U,0x02U,0xFCU};"""
          if old not in text: raise SystemExit("reversed transaction fixture pattern missing")
          text = text.replace(old, new, 1)
          text = text.replace("constexpr std::array<std::uint8_t, 4U> kTriggerAll{0x84U, 0x02U, 0x02U, 0x7CU};",
                              "constexpr std::array<std::uint8_t, 4U> kTriggerAll{0x84U, 0x02U, 0x02U, 0xFCU};", 1)
          text = text.replace("reports.trigger_options() != 0x7CU", "reports.trigger_options() != 0xFCU", 1)
          p.write_text(text)

      - name: Configure embedded transaction regression
        run: cmake -S . -B build-p0-tx -DCMAKE_BUILD_TYPE=Release -DARIEC61850_BUILD_EMBEDDED_PROFILE=ON

      - name: Build embedded transaction regression
        run: cmake --build build-p0-tx --parallel

      - name: Run embedded transaction regression
        run: ctest --test-dir build-p0-tx --output-on-failure

      - name: Commit verified transaction engine
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/p0-rcb-transaction-bootstrap.yml
          git config user.name "ARStack P0 Bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "fix(mms): order RCB multi-writes by lifecycle semantics"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
