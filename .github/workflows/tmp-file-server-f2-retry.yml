name: Temporary F2 isolated validation retry

on:
  push:
    branches:
      - agent/file-server-f2-validation

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged F2 patch and test fix
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-file-server-f2.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Wire sandboxed file backend into server and client tooling'
          marker_index = workflow.index(marker)
          run_index = next(i for i in range(marker_index + 1, len(workflow)) if workflow[i] == '        run: |')
          script_lines = []
          for line in workflow[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected reusable patch indentation: {line!r}')
              else:
                  script_lines.append('')
          script = '\n'.join(script_lines)
          exec(compile(script, 'validated-f2-patch', 'exec'), {'__name__': '__main__'})

          test = Path('tools/static_file_service_backend_test.cpp')
          text = test.read_text(encoding='utf-8')
          text = text.replace('std::vector<std::uint8_t> exchange(', 'std::vector<std::uint8_t> perform_exchange(')
          text = text.replace('exchange(session,', 'perform_exchange(session,')
          text = text.replace('exchange(other_session,', 'perform_exchange(other_session,')
          text = text.replace('exchange(read_only_session,', 'perform_exchange(read_only_session,')
          if 'perform_exchange(session,' not in text or ' exchange(session,' in text:
              raise SystemExit('test helper rename did not apply cleanly')
          test.write_text(text, encoding='utf-8')

      - name: Build and run F2 acceptance
        run: |
          cmake -S tools/static_ied_server_iedsim -B build-file-server
          cmake --build build-file-server -j2
          ctest --test-dir build-file-server --output-on-failure

      - name: Commit F2 to product branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-file-server-f2.yml \
                 .github/workflows/tmp-file-server-f2-staging.yml \
                 .github/workflows/tmp-file-server-f2-retry.yml
          git add tools/static_file_service_backend.hpp \
                  tools/static_file_service_backend_test.cpp \
                  tools/static_ied_server.cpp tools/file_transfer.cpp \
                  tools/static_ied_server_iedsim/CMakeLists.txt \
                  tools/static_ied_server_iedsim/test_file_service.py
          git commit -m "feat(mms): serve sandboxed MMS files with delete parity"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
