name: Stage Studio graceful shutdown v3

on:
  push:
    branches:
      - fix/studio-graceful-shutdown-p0

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/studio-graceful-shutdown-p0
          fetch-depth: 0

      - name: Apply bounded lifecycle ownership patch
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: replacement anchor count={count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{path}: regex anchor count={count}')
              p.write_text(new, encoding='utf-8')

          # DeviceController: explicit bounded transport-worker retirement.
          replace_once('apps/arstack_studio/src/DeviceController.hpp',
              '    explicit DeviceController(QObject* parent = nullptr);\n    ~DeviceController() override;\n',
              '    explicit DeviceController(QObject* parent = nullptr);\n    ~DeviceController() override;\n\n'
              '    // Application-lifetime boundary required by AGENTS.md section 11.\n'
              '    // Returns false if an emergency retirement fallback was required.\n'
              '    bool shutdown();\n'
              '    [[nodiscard]] static constexpr int shutdownAckTimeoutMs() noexcept { return 1200; }\n'
              '    [[nodiscard]] static constexpr int shutdownJoinTimeoutMs() noexcept { return 1200; }\n'
              '    [[nodiscard]] static constexpr int shutdownRetryTimeoutMs() noexcept { return 800; }\n'
              '    [[nodiscard]] static constexpr int shutdownForceTimeoutMs() noexcept { return 500; }\n')
          replace_once('apps/arstack_studio/src/DeviceController.hpp',
              '    bool ioWorkerReady_{false};\n    bool ioWorkerAffinityValid_{false};\n    bool pendingAutoDetect_{false};\n',
              '    bool ioWorkerReady_{false};\n    bool ioWorkerAffinityValid_{false};\n    bool shuttingDown_{false};\n    bool shutdownComplete_{false};\n    bool pendingAutoDetect_{false};\n')
          replace_once('apps/arstack_studio/src/DeviceController.cpp',
              '#include <QDateTime>\n#include <QMetaObject>\n#include <QRegularExpression>\n',
              '#include <QDateTime>\n#include <QDebug>\n#include <QMetaObject>\n#include <QRegularExpression>\n#include <QSemaphore>\n#include <QSharedPointer>\n')
          replace_once('apps/arstack_studio/src/DeviceController.cpp',
              '''DeviceController::~DeviceController() {\n    if (ioWorker_ == nullptr || !ioThread_.isRunning()) return;\n\n    const bool requestStop = running_;\n    if (QThread::currentThread() == &ioThread_) {\n        ioWorker_->shutdown(requestStop);\n    } else {\n        QMetaObject::invokeMethod(\n            ioWorker_,\n            [worker = ioWorker_, requestStop] { worker->shutdown(requestStop); },\n            Qt::BlockingQueuedConnection);\n    }\n    ioThread_.quit();\n    ioThread_.wait();\n}\n''',
              '''DeviceController::~DeviceController() {\n    static_cast<void>(shutdown());\n}\n\nbool DeviceController::shutdown() {\n    if (shutdownComplete_) return true;\n    if (shuttingDown_) return !ioThread_.isRunning();\n    shuttingDown_ = true;\n    pendingAutoDetect_ = false;\n    pendingConnectPort_.clear();\n\n    if (ioWorker_ == nullptr || !ioThread_.isRunning()) {\n        ioWorker_ = nullptr;\n        ioWorkerReady_ = false;\n        ioWorkerAffinityValid_ = false;\n        shutdownComplete_ = true;\n        shuttingDown_ = false;\n        return true;\n    }\n\n    const bool requestStop = running_;\n    if (QThread::currentThread() == &ioThread_) {\n        ioWorker_->shutdown(requestStop);\n        ioThread_.quit();\n        shuttingDown_ = false;\n        return false;\n    }\n\n    auto acknowledged = QSharedPointer<QSemaphore>::create();\n    DeviceIoWorker* const worker = ioWorker_;\n    const bool queued = QMetaObject::invokeMethod(\n        worker,\n        [worker, requestStop, acknowledged] {\n            worker->shutdown(requestStop);\n            acknowledged->release();\n        },\n        Qt::QueuedConnection);\n    bool graceful = queued && acknowledged->tryAcquire(1, shutdownAckTimeoutMs());\n    if (!graceful) {\n        qCritical().noquote()\n            << "Device I/O shutdown acknowledgement timed out; entering bounded retirement fallback.";\n    }\n\n    ioThread_.quit();\n    bool joined = ioThread_.wait(shutdownJoinTimeoutMs());\n    if (!joined) {\n        graceful = false;\n        qCritical().noquote()\n            << "Device I/O thread missed primary join deadline; retrying bounded retirement.";\n        ioThread_.requestInterruption();\n        ioThread_.quit();\n        joined = ioThread_.wait(shutdownRetryTimeoutMs());\n    }\n    if (!joined) {\n        // Emergency process-exit containment only. Normal CI must never reach this.\n        graceful = false;\n        qCritical().noquote()\n            << "Device I/O thread still alive; emergency terminate fallback engaged.";\n        ioThread_.terminate();\n        joined = ioThread_.wait(shutdownForceTimeoutMs());\n    }\n\n    ioWorker_ = nullptr;\n    ioWorkerReady_ = false;\n    ioWorkerAffinityValid_ = false;\n    connected_ = false;\n    running_ = false;\n    profileDeploying_ = false;\n    shutdownComplete_ = joined;\n    shuttingDown_ = false;\n    if (!joined) qCritical().noquote() << "Device I/O thread could not be retired before exit.";\n    return graceful && joined;\n}\n''')

          # Remove competing app-level shutdown ownership from the device facade.
          replace_once('apps/arstack_studio/src/StudioDeviceController.hpp',
              '#include <QCoreApplication>\n#include <QHash>\n', '#include <QHash>\n')
          replace_once('apps/arstack_studio/src/StudioDeviceController.hpp',
              '''\n        if (auto* app = QCoreApplication::instance(); app != nullptr) {\n            connect(app, &QCoreApplication::aboutToQuit, this, [this] {\n                controlHealthTimer_.stop();\n                healthProbeOutstanding_ = false;\n                setSessionHeartbeatEnabled(false);\n                clearPendingLiveCommands();\n                if (connected() && running()) {\n                    static_cast<void>(DeviceController::stop());\n                }\n            });\n        }\n''', '\n')

          # SmartSessionController retires timers and callback owners first.
          replace_once('apps/arstack_studio/src/SmartSessionController.hpp',
              '    explicit SmartSessionController(QObject* parent = nullptr);\n',
              '    explicit SmartSessionController(QObject* parent = nullptr);\n    ~SmartSessionController() override;\n\n    void shutdown();\n')
          replace_once('apps/arstack_studio/src/SmartSessionController.hpp',
              '''        explicit FirmwareHandoffWatchdog(SmartSessionController* owner) : owner_(owner) {\n            timer_.setSingleShot(true);\n            QObject::connect(owner_, &SmartSessionController::stateChanged, owner_, [this] { synchronize(); });\n            QObject::connect(&timer_, &QTimer::timeout, owner_, [this] { expire(); });\n        }\n\n    private:\n''',
              '''        explicit FirmwareHandoffWatchdog(SmartSessionController* owner) : owner_(owner) {\n            timer_.setSingleShot(true);\n            QObject::connect(owner_, &SmartSessionController::stateChanged, owner_, [this] { synchronize(); });\n            QObject::connect(&timer_, &QTimer::timeout, owner_, [this] { expire(); });\n        }\n        void shutdown() { timer_.stop(); owner_ = nullptr; }\n\n    private:\n''')
          replace_once('apps/arstack_studio/src/SmartSessionController.hpp',
              '''        explicit DeviceRecoveryMonitor(SmartSessionController* owner) : owner_(owner) {\n            QObject::connect(owner_, &SmartSessionController::dependenciesChanged, owner_, [this] { bindDevice(); });\n        }\n\n    private:\n''',
              '''        explicit DeviceRecoveryMonitor(SmartSessionController* owner) : owner_(owner) {\n            QObject::connect(owner_, &SmartSessionController::dependenciesChanged, owner_, [this] { bindDevice(); });\n        }\n        void shutdown() {\n            QObject::disconnect(verifiedConnection_);\n            QObject::disconnect(identificationConnection_);\n            device_ = nullptr;\n            owner_ = nullptr;\n        }\n\n    private:\n''')
          replace_once('apps/arstack_studio/src/SmartSessionController.hpp',
              '    bool setupError_{false};\n    bool recoveryPending_{false};\n    int updateReconnectAttempts_{0};\n',
              '    bool setupError_{false};\n    bool recoveryPending_{false};\n    bool shuttingDown_{false};\n    int updateReconnectAttempts_{0};\n')
          constructor_tail = '''    reconnectTimer_.setInterval(3000);\n    reconnectTimer_.setSingleShot(true);\n    connect(&reconnectTimer_, &QTimer::timeout, this, [this] {\n        if (device_ == nullptr || !updateRequested_ || updateStage_ != UpdateStage::reconnecting) return;\n        if (device_->deviceVerified()) {\n            reconcile();\n            return;\n        }\n        if (device_->discovering() || device_->connected()) {\n            reconnectTimer_.start();\n            return;\n        }\n        if (updateReconnectAttempts_ >= kMaxUpdateReconnectAttempts) {\n            latchFirmwareFailure(QStringLiteral(\n                "Firmware was written, but Studio could not reconnect and verify the ESP32-P4. Reconnect USB and retry firmware setup."));\n            emit firmwareUpdateFinished(false);\n            reconcile();\n            return;\n        }\n        ++updateReconnectAttempts_;\n        static_cast<void>(startDeviceDiscovery());\n        reconnectTimer_.start();\n        reconcile();\n    });\n}\n'''
          replace_once('apps/arstack_studio/src/SmartSessionController.cpp', constructor_tail,
              constructor_tail + '''\nSmartSessionController::~SmartSessionController() {\n    shutdown();\n}\n\nvoid SmartSessionController::shutdown() {\n    if (shuttingDown_) return;\n    shuttingDown_ = true;\n    started_ = false;\n    discoveryTimer_.stop();\n    prepareTimer_.stop();\n    reconnectTimer_.stop();\n    profileSyncTimer_.stop();\n    firmwareHandoffWatchdog_.shutdown();\n    deviceRecoveryMonitor_.shutdown();\n    updateRequested_ = false;\n    pendingReleaseGeneration_ = 0;\n    profileSyncStage_ = ProfileSyncStage::idle;\n    if (device_ != nullptr) QObject::disconnect(device_, nullptr, this, nullptr);\n    if (profiles_ != nullptr) QObject::disconnect(profiles_, nullptr, this, nullptr);\n    if (firmware_ != nullptr) QObject::disconnect(firmware_, nullptr, this, nullptr);\n    device_ = nullptr;\n    profiles_ = nullptr;\n    firmware_ = nullptr;\n}\n''')
          replace_once('apps/arstack_studio/src/SmartSessionController.cpp',
              'void SmartSessionController::start() {\n    if (started_) return;\n',
              'void SmartSessionController::start() {\n    if (started_ || shuttingDown_) return;\n')
          replace_once('apps/arstack_studio/src/SmartSessionController.cpp',
              'void SmartSessionController::reconcile() {\n    if (device_ == nullptr || profiles_ == nullptr || firmware_ == nullptr) {\n',
              'void SmartSessionController::reconcile() {\n    if (shuttingDown_) return;\n    if (device_ == nullptr || profiles_ == nullptr || firmware_ == nullptr) {\n')

          # Firmware worker follows the same bounded ownership contract.
          replace_once('apps/arstack_studio/src/FirmwareManager.hpp',
              '    void cancel();\n    void shutdown();\n',
              '    void cancel();\n    bool shutdown();\n'
              '    [[nodiscard]] static constexpr int shutdownAckTimeoutMs() noexcept { return 2200; }\n'
              '    [[nodiscard]] static constexpr int shutdownJoinTimeoutMs() noexcept { return 1200; }\n'
              '    [[nodiscard]] static constexpr int shutdownRetryTimeoutMs() noexcept { return 800; }\n'
              '    [[nodiscard]] static constexpr int shutdownForceTimeoutMs() noexcept { return 500; }\n')
          replace_once('apps/arstack_studio/src/FirmwareManager.cpp',
              '#include <QDateTime>\n#include <QDir>\n', '#include <QDateTime>\n#include <QDebug>\n#include <QDir>\n')
          replace_once('apps/arstack_studio/src/FirmwareManager.cpp',
              '#include <QRegularExpression>\n', '#include <QRegularExpression>\n#include <QSemaphore>\n#include <QSharedPointer>\n')
          replace_once('apps/arstack_studio/src/FirmwareManager.cpp',
              'FirmwareManager::~FirmwareManager() {\n    shutdown();\n}\n',
              'FirmwareManager::~FirmwareManager() {\n    static_cast<void>(shutdown());\n}\n')
          replace_once('apps/arstack_studio/src/FirmwareManager.cpp',
              '''void FirmwareManager::shutdown() {\n    if (shuttingDown_) return;\n    shuttingDown_ = true;\n    operation_ = Operation::none;\n    activeOperationGeneration_ = 0;\n    busy_ = false;\n    cancelRequested_ = true;\n\n    if (worker_ != nullptr && workerThread_.isRunning()) {\n        if (QThread::currentThread() == &workerThread_) {\n            worker_->shutdown();\n        } else {\n            QMetaObject::invokeMethod(worker_, &FirmwareWorker::shutdown, Qt::BlockingQueuedConnection);\n        }\n        workerThread_.quit();\n        workerThread_.wait();\n    }\n}\n''',
              '''bool FirmwareManager::shutdown() {\n    if (shuttingDown_) return !workerThread_.isRunning();\n    shuttingDown_ = true;\n    operation_ = Operation::none;\n    activeOperationGeneration_ = 0;\n    busy_ = false;\n    cancelRequested_ = true;\n\n    if (worker_ == nullptr || !workerThread_.isRunning()) {\n        worker_ = nullptr;\n        workerReady_ = false;\n        workerAffinityValid_ = false;\n        return true;\n    }\n    if (QThread::currentThread() == &workerThread_) {\n        worker_->shutdown();\n        workerThread_.quit();\n        return false;\n    }\n\n    auto acknowledged = QSharedPointer<QSemaphore>::create();\n    FirmwareWorker* const worker = worker_;\n    const bool queued = QMetaObject::invokeMethod(\n        worker,\n        [worker, acknowledged] {\n            worker->shutdown();\n            acknowledged->release();\n        },\n        Qt::QueuedConnection);\n    bool graceful = queued && acknowledged->tryAcquire(1, shutdownAckTimeoutMs());\n    if (!graceful) {\n        qCritical().noquote()\n            << "Firmware worker shutdown acknowledgement timed out; entering bounded retirement fallback.";\n    }\n\n    workerThread_.quit();\n    bool joined = workerThread_.wait(shutdownJoinTimeoutMs());\n    if (!joined) {\n        graceful = false;\n        qCritical().noquote()\n            << "Firmware worker missed primary join deadline; retrying bounded retirement.";\n        workerThread_.requestInterruption();\n        workerThread_.quit();\n        joined = workerThread_.wait(shutdownRetryTimeoutMs());\n    }\n    if (!joined) {\n        graceful = false;\n        qCritical().noquote()\n            << "Firmware worker still alive; emergency terminate fallback engaged.";\n        workerThread_.terminate();\n        joined = workerThread_.wait(shutdownForceTimeoutMs());\n    }\n\n    worker_ = nullptr;\n    workerReady_ = false;\n    workerAffinityValid_ = false;\n    if (!joined) qCritical().noquote() << "Firmware worker could not be retired before exit.";\n    return graceful && joined;\n}\n''')

          # Single application boundary controls shutdown ordering.
          regex_once('apps/arstack_studio/src/main.cpp',
              r'    FirmwareManager firmwareService;\n    QObject::connect\(\n        &app,\n        &QCoreApplication::aboutToQuit,\n        &firmwareService,\n        &FirmwareManager::shutdown,\n        Qt::DirectConnection\);\n',
              '    FirmwareManager firmwareService;\n')
          window_pattern = r'    PrimaryWindowCloseFilter primaryCloseFilter\{&app\};\n    if \(mainWindow != nullptr\) \{\n        mainWindow->installEventFilter\(&primaryCloseFilter\);\n    \}\n(?:\n)?'
          coordinator = '''    PrimaryWindowCloseFilter primaryCloseFilter{&app};\n    if (mainWindow != nullptr) {\n        mainWindow->installEventFilter(&primaryCloseFilter);\n    }\n\n    QPointer<StudioDeviceController> lifecycleDevice;\n    QPointer<SmartSessionController> lifecycleSession;\n    if (mainWindow != nullptr) {\n        lifecycleDevice = mainWindow->findChild<StudioDeviceController*>();\n        lifecycleSession = mainWindow->findChild<SmartSessionController*>();\n    }\n    if (mainWindow != nullptr && (lifecycleDevice.isNull() || lifecycleSession.isNull())) {\n        qCritical().noquote()\n            << "Application lifecycle owner discovery failed; refusing an unowned worker/session lifetime.";\n        return 14;\n    }\n\n    bool lifecycleCoordinatorInvoked = false;\n    bool lifecycleShutdownClean = false;\n    QObject::connect(\n        &app,\n        &QCoreApplication::aboutToQuit,\n        &app,\n        [&] {\n            lifecycleCoordinatorInvoked = true;\n            if (!lifecycleSession.isNull()) lifecycleSession->shutdown();\n            const bool deviceClean = lifecycleDevice.isNull() || lifecycleDevice->shutdown();\n            const bool firmwareClean = firmwareService.shutdown();\n            lifecycleShutdownClean = deviceClean && firmwareClean;\n            if (!lifecycleShutdownClean) {\n                qCritical().noquote()\n                    << "Application shutdown required an emergency worker-retirement fallback.";\n            }\n        },\n        Qt::DirectConnection);\n\n'''
          regex_once('apps/arstack_studio/src/main.cpp', window_pattern, coordinator)
          regex_once('apps/arstack_studio/src/main.cpp',
              r'    const int result = app\.exec\(\);\n    if \(lifecycleCheck && result == 0\) \{\n        qInfo\(\)\.noquote\(\) << "Application lifecycle regression: PASS · primary window close reached the lifetime filter";\n    \}\n    return result;\n\}',
              '''    const int result = app.exec();\n    if (!lifecycleCoordinatorInvoked || !lifecycleShutdownClean) {\n        qCritical().noquote()\n            << "Application lifecycle regression: shutdown coordinator did not retire all workers cleanly.";\n        return result == 0 ? 15 : result;\n    }\n    if (lifecycleCheck && result == 0) {\n        qInfo().noquote()\n            << "Application lifecycle regression: PASS · close -> supervisor stop -> worker join -> process exit";\n    }\n    return result;\n}''')

      - name: Validate focused diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          changed="$(git diff --name-only)"
          echo "$changed"
          test -n "$changed"
          if echo "$changed" | grep -q '^apps/ied_simulator/'; then exit 21; fi
          if echo "$changed" | grep -q '^embedded/'; then exit 22; fi

      - name: Commit source lifecycle hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/arstack_studio/src
          git commit -m 'fix(studio): retire workers before GUI event loop exits'
          git push origin HEAD:fix/studio-graceful-shutdown-p0
