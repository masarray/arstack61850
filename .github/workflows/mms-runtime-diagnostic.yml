name: MMS Server Parity Finalizer

on:
  pull_request:
    paths:
      - '.github/workflows/mms-runtime-diagnostic.yml'
      - 'scripts/mms_server_parity_finalize.py'
      - 'scripts/mms_server_parity_namespace_fix.py'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply deterministic parity patch
        run: |
          python3 scripts/mms_server_parity_finalize.py
          python3 scripts/mms_server_parity_namespace_fix.py

      - name: Diff safety check
        run: |
          git diff --check
          git status --short

      - name: Configure root build
        run: cmake -S . -B build-finalize -DCMAKE_BUILD_TYPE=Release -DARIEC61850_BUILD_TOOLS=ON -DARIEC61850_BUILD_TESTS=ON -DARIEC61850_WARNINGS_AS_ERRORS=ON

      - name: Build promoted server targets
        run: |
          cmake --build build-finalize --parallel 2 --target \
            ariec61850_mms_connection_runtime_tests \
            ariec61850_mms_direct_control_tests \
            ariec61850_mms_server_urcb_tests \
            ariec61850_mms_direct_control_server \
            ariec61850_mms_urcb_server

      - name: Run promoted root CTests
        run: ctest --test-dir build-finalize --output-on-failure -R 'mms_(connection_runtime|direct_control|server_urcb|urcb_server)'

      - name: Configure and test embedded hard profile
        run: |
          cmake -S embedded -B build-embedded-finalize -DCMAKE_BUILD_TYPE=Release -DARIEC61850_EMBEDDED_WARNINGS_AS_ERRORS=ON
          cmake --build build-embedded-finalize --parallel 2 --target ariec61850_embedded_mms_connection_runtime_smoke
          ./build-embedded-finalize/ariec61850_embedded_mms_connection_runtime_smoke

      - name: Configure and test standalone server profile
        run: |
          cmake -S tools/mms_direct_control_server -B build-standalone-finalize -DCMAKE_BUILD_TYPE=Release
          cmake --build build-standalone-finalize --parallel 2
          ctest --test-dir build-standalone-finalize --output-on-failure

      - name: Commit validated parity tranche
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            include/ariec61850/mms/pdu_span.hpp \
            src/mms/pdu_span.cpp \
            src/mms/connection_runtime.cpp \
            embedded/mms_connection_runtime_hard_profile_smoke.cpp \
            CMakeLists.txt \
            tools/mms_direct_control_server/CMakeLists.txt
          git commit -m 'mms-server: finalize engineering-client parity tranche'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
