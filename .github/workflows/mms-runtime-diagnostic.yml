name: MMS Server Parity Finalizer

on:
  push:
    branches:
      - 'agent/mms-server-r1-r2-current-main'
    paths:
      - '.github/workflows/mms-runtime-diagnostic.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mms-server-r1-r2-current-main
          fetch-depth: 0

      - name: Apply bounded MMS server parity tranche
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def load(path):
              return Path(path).read_text(encoding='utf-8')

          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # 1) Make FileDirectory a first-class diagnostic service kind.
          path = 'include/ariec61850/mms/pdu_span.hpp'
          text = load(path)
          text = replace_once(
              text,
              '    get_named_variable_list_attributes = 12,\n};',
              '    get_named_variable_list_attributes = 12,\n    file_directory = 77,\n};',
              'pdu span service enum')
          save(path, text)

          path = 'src/mms/pdu_span.cpp'
          text = load(path)
          text = replace_once(
              text,
              '    case 12: return MmsWireConfirmedService::get_named_variable_list_attributes;\n    default: return MmsWireConfirmedService::unknown;',
              '    case 12: return MmsWireConfirmedService::get_named_variable_list_attributes;\n    case 77: return MmsWireConfirmedService::file_directory;\n    default: return MmsWireConfirmedService::unknown;',
              'pdu span service mapping')
          save(path, text)

          # 2) Port the deterministic empty FileDirectory behavior used by the
          # proven C# engineering-client simulator. Keep it at the live
          # compatibility boundary; the strict application dispatcher remains
          # fail-closed for unsupported services.
          path = 'src/mms/connection_runtime.cpp'
          text = load(path)
          text = replace_once(
              text,
              "constexpr std::array<std::uint8_t, 4U> kConservativeStructureType{\n    0xA2U, 0x02U, 0xA1U, 0x00U};\n",
              "constexpr std::array<std::uint8_t, 4U> kConservativeStructureType{\n    0xA2U, 0x02U, 0xA1U, 0x00U};\n\n// FileDirectory-Response service value: listOfDirectoryEntry [0] empty,\n// moreFollows [1] FALSE. This mirrors the bounded deterministic response\n// used by the proven ARIEC61850 engineering-client simulator.\nconstexpr std::array<std::uint8_t, 5U> kEmptyFileDirectoryFields{\n    0xA0U, 0x00U, 0x81U, 0x01U, 0x00U};\n",
              'connection runtime file directory fields')

          identify_block = '''        if (confirmed.service() == MmsWireConfirmedService::identify) {
            const auto identify = !confirmed.service_constructed && confirmed.service_value.empty()
                ? MmsPduSpanCodec::encode_identify_response_into(
                    confirmed.invoke_id, response)
                : MmsPduSpanCodec::encode_confirmed_error_into(
                    confirmed.invoke_id, response);
            return finish(wrap_mms_response(
                identify,
                peek.frame_bytes,
                state_,
                mms_presentation_context_id_,
                negotiated_tpdu_size_code_,
                response,
                workspace,
                MmsStaticDispatchStatus::response_ready,
                MmsWireConfirmedService::identify,
                confirmed.invoke_id));
        }

'''
          directory_block = identify_block + '''        if (confirmed.service() == MmsWireConfirmedService::file_directory) {
            const auto directory = confirmed.service_constructed
                ? MmsPduSpanCodec::encode_confirmed_response_into(
                    confirmed.invoke_id,
                    static_cast<std::int32_t>(MmsWireConfirmedService::file_directory),
                    true,
                    kEmptyFileDirectoryFields,
                    response)
                : MmsPduSpanCodec::encode_confirmed_error_into(
                    confirmed.invoke_id, response);
            return finish(wrap_mms_response(
                directory,
                peek.frame_bytes,
                state_,
                mms_presentation_context_id_,
                negotiated_tpdu_size_code_,
                response,
                workspace,
                MmsStaticDispatchStatus::response_ready,
                MmsWireConfirmedService::file_directory,
                confirmed.invoke_id));
        }

'''
          text = replace_once(text, identify_block, directory_block, 'connection runtime FileDirectory handler')
          save(path, text)

          # 3) Fix the stale segmented-Read expectation. The preceding Write
          # intentionally changes relay_state to false, so the replayed Read
          # must return Boolean FALSE, not the earlier TRUE golden byte.
          path = 'embedded/mms_connection_runtime_hard_profile_smoke.cpp'
          text = load(path)
          read_response = '''constexpr std::array<std::uint8_t, 15U> kReadResponse{
    0xA1U, 0x0DU, 0x02U, 0x01U, 0x0CU,
    0xA4U, 0x08U, 0xA1U, 0x06U,
    0x83U, 0x01U, 0xFFU,
    0x85U, 0x01U, 0x2AU};
'''
          read_after_write = read_response + '''
constexpr std::array<std::uint8_t, 15U> kReadResponseAfterWrite{
    0xA1U, 0x0DU, 0x02U, 0x01U, 0x0CU,
    0xA4U, 0x08U, 0xA1U, 0x06U,
    0x83U, 0x01U, 0x00U,
    0x85U, 0x01U, 0x2AU};

constexpr std::array<std::uint8_t, 5U> kEmptyFileDirectoryFields{
    0xA0U, 0x00U, 0x81U, 0x01U, 0x00U};
'''
          text = replace_once(text, read_response, read_after_write, 'runtime smoke post-write golden')

          stale_tail = '''        !extract_mms(
            std::span<const std::uint8_t>{response}.first(result.bytes_written), pdv) ||
        !matches(pdv.single_asn1_type, kReadResponse)) {
        return 20;
    }
'''
          fixed_tail = '''        !extract_mms(
            std::span<const std::uint8_t>{response}.first(result.bytes_written), pdv) ||
        !matches(pdv.single_asn1_type, kReadResponseAfterWrite)) {
        return 20;
    }
'''
          text = replace_once(text, stale_tail, fixed_tail, 'segmented read stale assertion')

          conclude_anchor = '''    const auto conclude_tpkt = build_mms_tpkt(
        kConcludeRequest, request, presentation, scratch);
'''
          file_directory_trial = '''    std::array<std::uint8_t, 64U> file_directory_mms{};
    const auto file_directory_request = MmsPduSpanCodec::encode_confirmed_request_into(
        22U,
        static_cast<std::int32_t>(MmsWireConfirmedService::file_directory),
        true,
        {},
        file_directory_mms);
    const auto file_directory_tpkt = file_directory_request.success()
        ? build_mms_tpkt(
            std::span<const std::uint8_t>{file_directory_mms}.first(
                file_directory_request.bytes_written),
            request,
            presentation,
            scratch)
        : wire::EncodeResult{};
    if (!file_directory_request.success() || !file_directory_tpkt.success()) {
        return 21;
    }
    result = runtime.process_tcp_window(
        std::span<const std::uint8_t>{request}.first(file_directory_tpkt.bytes_written),
        response,
        workspace);
    MmsConfirmedPduView file_directory_response;
    if (!result.response_ready() ||
        result.application_service != MmsWireConfirmedService::file_directory ||
        result.invoke_id != 22U ||
        runtime.state() != MmsStaticConnectionState::established ||
        !extract_mms(
            std::span<const std::uint8_t>{response}.first(result.bytes_written), pdv) ||
        !MmsPduSpanCodec::try_decode_confirmed_response_view(
            pdv.single_asn1_type, file_directory_response) ||
        file_directory_response.invoke_id != 22U ||
        file_directory_response.service() != MmsWireConfirmedService::file_directory ||
        !matches(file_directory_response.service_value, kEmptyFileDirectoryFields)) {
        return 22;
    }

''' + conclude_anchor
          text = replace_once(text, conclude_anchor, file_directory_trial, 'runtime smoke FileDirectory trial')
          save(path, text)

          # 4) Promote R1 Direct Control and R2 URCB reusable implementations
          # into the public mms_server_core and root CTest graph.
          path = 'CMakeLists.txt'
          text = load(path)
          server_anchor = '''    src/mms/static_dispatcher.cpp
    src/mms/connection_runtime.cpp
    src/mms/static_server_session.cpp
    src/mms/static_brcb_runtime.cpp
'''
          server_promoted = '''    src/mms/static_dispatcher.cpp
    src/mms/connection_runtime.cpp
    src/mms/static_server_session.cpp
    src/mms/static_direct_control.cpp
    src/mms/static_information_report.cpp
    src/mms/static_report_connection.cpp
    src/mms/static_urcb_objects.cpp
    src/mms/static_urcb_runtime.cpp
    src/mms/static_brcb_runtime.cpp
'''
          text = replace_once(text, server_anchor, server_promoted, 'root server core source promotion')

          tools_anchor = '''    target_compile_features(ariec61850_static_ied_server PRIVATE cxx_std_20)
    ariec61850_apply_warnings(ariec61850_static_ied_server)
    ariec61850_apply_sanitizers(ariec61850_static_ied_server)
endif()
'''
          tools_promoted = '''    target_compile_features(ariec61850_static_ied_server PRIVATE cxx_std_20)
    ariec61850_apply_warnings(ariec61850_static_ied_server)
    ariec61850_apply_sanitizers(ariec61850_static_ied_server)

    add_executable(
        ariec61850_mms_direct_control_server
        tools/mms_direct_control_server.cpp)
    target_link_libraries(
        ariec61850_mms_direct_control_server
        PRIVATE ARIEC61850::mms_server_core ARIEC61850::core)
    if(WIN32)
        target_link_libraries(ariec61850_mms_direct_control_server PRIVATE ws2_32)
    endif()
    target_compile_features(ariec61850_mms_direct_control_server PRIVATE cxx_std_20)
    ariec61850_apply_warnings(ariec61850_mms_direct_control_server)
    ariec61850_apply_sanitizers(ariec61850_mms_direct_control_server)

    add_executable(
        ariec61850_mms_urcb_server
        tools/mms_urcb_server.cpp)
    target_link_libraries(
        ariec61850_mms_urcb_server
        PRIVATE ARIEC61850::mms_server_core ARIEC61850::core)
    if(WIN32)
        target_link_libraries(ariec61850_mms_urcb_server PRIVATE ws2_32)
    endif()
    target_compile_features(ariec61850_mms_urcb_server PRIVATE cxx_std_20)
    ariec61850_apply_warnings(ariec61850_mms_urcb_server)
    ariec61850_apply_sanitizers(ariec61850_mms_urcb_server)
endif()
'''
          text = replace_once(text, tools_anchor, tools_promoted, 'root server tool promotion')

          tests_anchor = '''    add_test(
        NAME ariec61850_mms_connection_runtime_tests
        COMMAND ariec61850_mms_connection_runtime_tests)

    foreach(brcb_smoke IN ITEMS
'''
          tests_promoted = '''    add_test(
        NAME ariec61850_mms_connection_runtime_tests
        COMMAND ariec61850_mms_connection_runtime_tests)

    add_executable(
        ariec61850_mms_direct_control_tests
        tests/test_mms_static_direct_control.cpp)
    target_link_libraries(
        ariec61850_mms_direct_control_tests
        PRIVATE ARIEC61850::mms_server_core ARIEC61850::core)
    target_compile_features(ariec61850_mms_direct_control_tests PRIVATE cxx_std_20)
    ariec61850_apply_warnings(ariec61850_mms_direct_control_tests)
    ariec61850_apply_sanitizers(ariec61850_mms_direct_control_tests)
    add_test(
        NAME ariec61850_mms_direct_control_tests
        COMMAND ariec61850_mms_direct_control_tests)

    add_executable(
        ariec61850_mms_server_urcb_tests
        tests/test_mms_server_urcb_report.cpp)
    target_link_libraries(
        ariec61850_mms_server_urcb_tests
        PRIVATE ARIEC61850::mms_server_core ARIEC61850::core)
    target_compile_features(ariec61850_mms_server_urcb_tests PRIVATE cxx_std_20)
    ariec61850_apply_warnings(ariec61850_mms_server_urcb_tests)
    ariec61850_apply_sanitizers(ariec61850_mms_server_urcb_tests)
    add_test(
        NAME ariec61850_mms_server_urcb_tests
        COMMAND ariec61850_mms_server_urcb_tests)

    foreach(brcb_smoke IN ITEMS
'''
          text = replace_once(text, tests_anchor, tests_promoted, 'root R1/R2 CTest promotion')

          help_anchor = '''        add_test(
            NAME ariec61850_static_ied_server_help
            COMMAND ariec61850_static_ied_server --help)
'''
          help_promoted = help_anchor + '''        add_test(
            NAME ariec61850_mms_direct_control_server_help
            COMMAND ariec61850_mms_direct_control_server --help)
        add_test(
            NAME ariec61850_mms_urcb_server_help
            COMMAND ariec61850_mms_urcb_server --help)
'''
          text = replace_once(text, help_anchor, help_promoted, 'root server help CTests')
          save(path, text)

          # 5) Remove standalone source duplication now that those sources are
          # owned by ARIEC61850::mms_server_core.
          path = 'tools/mms_direct_control_server/CMakeLists.txt'
          text = load(path)
          report_sources = '''set(SERVER_REPORT_SOURCES
    "${ARSTACK_ROOT}/src/mms/information_report_span.cpp"
    "${ARSTACK_ROOT}/src/mms/static_information_report.cpp"
    "${ARSTACK_ROOT}/src/mms/static_report_connection.cpp"
    "${ARSTACK_ROOT}/src/mms/static_urcb_objects.cpp"
    "${ARSTACK_ROOT}/src/mms/static_urcb_runtime.cpp")

'''
          text = replace_once(text, report_sources, '', 'standalone report source duplication')
          text = replace_once(
              text,
              '''add_executable(ariec61850_mms_direct_control_server
    "${ARSTACK_ROOT}/tools/mms_direct_control_server.cpp"
    "${ARSTACK_ROOT}/src/mms/static_direct_control.cpp")''',
              '''add_executable(ariec61850_mms_direct_control_server
    "${ARSTACK_ROOT}/tools/mms_direct_control_server.cpp")''',
              'standalone direct server duplication')
          text = replace_once(
              text,
              '''add_executable(ariec61850_mms_urcb_server
    "${ARSTACK_ROOT}/tools/mms_urcb_server.cpp"
    ${SERVER_REPORT_SOURCES})''',
              '''add_executable(ariec61850_mms_urcb_server
    "${ARSTACK_ROOT}/tools/mms_urcb_server.cpp")''',
              'standalone URCB server duplication')
          text = replace_once(
              text,
              '''add_executable(ariec61850_mms_direct_control_tests
    "${ARSTACK_ROOT}/tests/test_mms_static_direct_control.cpp"
    "${ARSTACK_ROOT}/src/mms/static_direct_control.cpp")''',
              '''add_executable(ariec61850_mms_direct_control_tests
    "${ARSTACK_ROOT}/tests/test_mms_static_direct_control.cpp")''',
              'standalone direct test duplication')
          text = replace_once(
              text,
              '''add_executable(ariec61850_mms_server_urcb_tests
    "${ARSTACK_ROOT}/tests/test_mms_server_urcb_report.cpp"
    ${SERVER_REPORT_SOURCES})''',
              '''add_executable(ariec61850_mms_server_urcb_tests
    "${ARSTACK_ROOT}/tests/test_mms_server_urcb_report.cpp")''',
              'standalone URCB test duplication')
          save(path, text)

          print('MMS parity patch applied with all structural assertions satisfied.')
          PY

      - name: Diff safety check
        run: |
          git diff --check
          git status --short

      - name: Configure root build
        run: cmake -S . -B build-finalize -DCMAKE_BUILD_TYPE=Release -DARIEC61850_BUILD_TOOLS=ON -DARIEC61850_BUILD_TESTS=ON -DARIEC61850_WARNINGS_AS_ERRORS=ON

      - name: Build promoted server targets
        run: |
          cmake --build build-finalize --parallel 2 --target \
            ariec61850_mms_connection_runtime_tests \
            ariec61850_mms_direct_control_tests \
            ariec61850_mms_server_urcb_tests \
            ariec61850_mms_direct_control_server \
            ariec61850_mms_urcb_server

      - name: Run promoted root CTests
        run: ctest --test-dir build-finalize --output-on-failure -R 'mms_(connection_runtime|direct_control|server_urcb|urcb_server)'

      - name: Configure and test embedded hard profile
        run: |
          cmake -S embedded -B build-embedded-finalize -DCMAKE_BUILD_TYPE=Release -DARIEC61850_EMBEDDED_WARNINGS_AS_ERRORS=ON
          cmake --build build-embedded-finalize --parallel 2 --target ariec61850_embedded_mms_connection_runtime_smoke
          ./build-embedded-finalize/ariec61850_embedded_mms_connection_runtime_smoke

      - name: Configure and test standalone server profile
        run: |
          cmake -S tools/mms_direct_control_server -B build-standalone-finalize -DCMAKE_BUILD_TYPE=Release
          cmake --build build-standalone-finalize --parallel 2
          ctest --test-dir build-standalone-finalize --output-on-failure

      - name: Commit validated parity tranche
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            include/ariec61850/mms/pdu_span.hpp \
            src/mms/pdu_span.cpp \
            src/mms/connection_runtime.cpp \
            embedded/mms_connection_runtime_hard_profile_smoke.cpp \
            CMakeLists.txt \
            tools/mms_direct_control_server/CMakeLists.txt
          git commit -m 'mms-server: finalize engineering-client parity tranche'
          git push origin HEAD:agent/mms-server-r1-r2-current-main
