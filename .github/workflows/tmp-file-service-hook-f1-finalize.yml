name: Temporary host file-service extension hook F1 finalize

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated extension patch
        shell: python
        run: |
          from pathlib import Path
          workflow = Path('.github/workflows/tmp-file-service-hook-f1.yml').read_text(encoding='utf-8').splitlines()
          marker = '      - name: Add portable confirmed-service extension hook'
          marker_index = workflow.index(marker)
          run_index = next(i for i in range(marker_index + 1, len(workflow)) if workflow[i] == '        run: |')
          script_lines = []
          for line in workflow[run_index + 1:]:
              if line.startswith('      - name:'):
                  break
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected reusable patch indentation: {line!r}')
              else:
                  script_lines.append('')
          script = '\n'.join(script_lines)
          if 'confirmed_service_context' not in script or 'MmsStaticConfirmedServiceExtensionResult' not in script:
              raise SystemExit('refusing unexpected F1 patch payload')
          exec(compile(script, 'validated-f1-patch', 'exec'), {'__name__': '__main__'})

      - name: Build portable core and focused connection tests
        run: |
          cmake -S . -B build-core -DARIEC61850_BUILD_TESTS=ON -DARIEC61850_BUILD_TOOLS=OFF -DARIEC61850_WARNINGS_AS_ERRORS=ON
          cmake --build build-core -j2
          ctest --test-dir build-core --output-on-failure -R 'ariec61850_mms_(connection_runtime|server_session|file_service)_tests'

      - name: Build and test IEDScout parity server profile
        run: |
          cmake -S tools/static_ied_server_iedsim -B build-parity
          cmake --build build-parity --target ariec61850_static_ied_server_iedsim -j2
          ctest --test-dir build-parity --output-on-failure

      - name: Commit F1 and remove temporary workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-file-service-hook-f1.yml .github/workflows/tmp-file-service-hook-f1-finalize.yml
          git add include/ariec61850/mms/connection_runtime.hpp \
                  src/mms/connection_runtime.cpp src/mms/connection_runtime_iedsim.cpp
          git commit -m "feat(mms): add host confirmed-service extension hook"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
