name: P0 Smart Firmware Recovery Repair

on:
  push:
    paths:
      - '.github/workflows/p0-smart-firmware-recovery.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0
      - name: Apply source repair
        shell: powershell
        run: |
          python .github\scripts\p0_smart_firmware_recovery.py
          if ($LASTEXITCODE -ne 0) { throw "Source repair failed: $LASTEXITCODE" }
      - name: Validate diff
        shell: powershell
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw "git diff --check failed" }
          git diff -- apps/arstack_studio/src/SmartSessionController.cpp apps/arstack_studio/src/DeterministicSessionHarness.cpp
      - name: Commit repair
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/arstack_studio/src/SmartSessionController.cpp apps/arstack_studio/src/DeterministicSessionHarness.cpp
          git commit -m 'fix(studio): auto-recover trusted legacy ESP32-P4 firmware'
          if ($LASTEXITCODE -ne 0) { throw "Commit failed: $LASTEXITCODE" }
          git push origin HEAD:feature/ptp-production-v0.1.1
          if ($LASTEXITCODE -ne 0) { throw "Push failed: $LASTEXITCODE" }
