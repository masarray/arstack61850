name: P0 Ribbon Phase 1 Apply Windows

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1
    paths:
      - '.github/workflows/p0-ribbon-phase1-windows.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0
      - name: Apply phase 1 ribbon patch
        shell: powershell
        run: |
          python .github/scripts/p0_ribbon_phase1.py
          if ($LASTEXITCODE -ne 0) { throw "Ribbon patch failed: $LASTEXITCODE" }
      - name: Commit source changes
        shell: powershell
        run: |
          git diff --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Phase 1 patch already present.'
            exit 0
          }
          git config user.name 'ARStack CI Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add apps/arstack_studio
          git commit -m 'ui: adopt modern tabbed ribbon and compact instrument shell'
          git push origin HEAD:feature/ptp-production-v0.1.1
