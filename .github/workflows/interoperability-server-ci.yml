name: IEC 61850 Interoperability Server CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tools/static_ied_server_iedsim/**'
      - 'tools/static_ied_server.cpp'
      - 'tools/static_ied_server_sigpipe.cpp'
      - 'tools/mms_read_probe.cpp'
      - 'tools/mms_urcb_gi_probe.cpp'
      - 'src/asn1/ber_span_reader.cpp'
      - 'src/osi/**'
      - 'src/acse/**'
      - 'src/mms/**'
      - 'include/ariec61850/asn1/**'
      - 'include/ariec61850/acse/**'
      - 'include/ariec61850/osi/**'
      - 'include/ariec61850/mms/**'
      - 'include/ariec61850/scl/**'
      - 'include/ariec61850/control/**'
      - 'include/ariec61850/ethernet/**'
      - 'include/ariec61850/goose/**'
      - 'include/ariec61850/sampled_values/**'
      - 'include/ariec61850/capture/**'
      - '.github/workflows/interoperability-server-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    strategy:
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S tools/static_ied_server_iedsim -B build-interop-parity -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-interop-parity --parallel
      - name: Test
        run: ctest --test-dir build-interop-parity --output-on-failure

  windows:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tools/static_ied_server_iedsim -B build-interop-parity
      - name: Build
        run: cmake --build build-interop-parity --config Release --parallel
      - name: Test
        run: ctest --test-dir build-interop-parity -C Release --output-on-failure
