name: Phase2A Canonical Setting Group Core

on:
  push:
    branches:
      - feat/ied-sim-ux-performance-foundation
    paths:
      - 'scripts/phase2a_setting_group_core_patch.py'
      - '.github/workflows/zz-phase2a-setting-group-core.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ied-sim-ux-performance-foundation
          fetch-depth: 0

      - name: Apply canonical SettingControl and SGCB core patch
        run: |
          python3 scripts/phase2a_setting_group_core_patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_mms_static_setting_group.cpp')
          text = p.read_text()
          text = text.replace('#include <array>\n', '#include <algorithm>\n#include <array>\n')
          text = text.replace('#include <string>\n', '#include <string>\n#include <string_view>\n')
          anchor = '''[[nodiscard]] mms::MmsObjectNameView object_name(\n'''
          helper = '''[[nodiscard]] wire::EncodeResult read_base_object(\n    const void*,\n    const std::span<std::uint8_t> destination) noexcept {\n    constexpr std::size_t required = 3U;\n    if (destination.size() < required) {\n        return {wire::EncodeStatus::buffer_too_small, 0U, required};\n    }\n    destination[0] = 0x83U;\n    destination[1] = 0x01U;\n    destination[2] = 0x00U;\n    return {wire::EncodeStatus::ok, required, required};\n}\n\n'''
          if anchor not in text:
              raise SystemExit('SGCB fixture object_name anchor not found')
          text = text.replace(anchor, helper + anchor, 1)
          old = 'mms::MmsStaticObjectEntry{"LD0", "LLN0", root_type, nullptr, nullptr}'
          new = 'mms::MmsStaticObjectEntry{"LD0", "LLN0", root_type, read_base_object, nullptr}'
          if old not in text:
              raise SystemExit('SGCB fixture invalid base entry anchor not found')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DARIEC61850_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Run focused SettingControl and SGCB regressions
        run: >-
          ctest --test-dir build --output-on-failure
          -R 'ariec61850_(scl_tests|mms_static_setting_group_tests)'

      - name: Run full portable regression
        run: ctest --test-dir build --output-on-failure

      - name: Commit phase2a after green gate
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/zz-phase2a-setting-group-core.yml scripts/phase2a_setting_group_core_patch.py
          git add \
            CMakeLists.txt \
            apps/ied_simulator/CMakeLists.txt \
            include/ariec61850/scl/model.hpp \
            src/scl/parser_part_02.inc \
            src/scl/parser_part_05_03.inc \
            include/ariec61850/mms/static_setting_group.hpp \
            src/mms/static_setting_group.cpp \
            tests/test_mms_static_setting_group.cpp \
            tests/test_scl.cpp
          git commit -m "feat(mms): add canonical setting-group control core"
          git push origin HEAD:feat/ied-sim-ux-performance-foundation
