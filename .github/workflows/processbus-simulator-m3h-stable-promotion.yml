name: Promote Verified M3.H Release to Public Stable
# One-time release metadata promotion. NEVER rebuild or re-upload firmware/binaries.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/processbus-simulator-m3h-stable-promotion.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-existing-release:
    if: github.repository == 'masarray/arstack61850'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: processbus-sim-m3h-20261024
    steps:
      - name: Read existing release and enforce immutable asset identity
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > before.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path('before.json').read_text())
          expected = {
              'ARStack-ESP32P4-ProcessBus-M3H-firmware.bin': (542096, '61c508e9bf1357eb964d2b817b260b6a0e985446ddd68de1d45d9467e25c4607'),
              'ARStack-ProcessBus-M3H-win-x64-portable.zip': (48335087, 'ca01424e4102aa65e353737024ebf3258b4d2f614fa60d932c95c353ee228d8f'),
              'ARStack-ProcessBus-M3H-win-x64-setup.exe': (31059935, '4902e8bf44e78fc55a139ce84a1273f0768ef6fe10000f5d0f85d75d2f6c736e'),
              'firmware-manifest.json': (942, 'b2878148a1cda30f11a4c93a200bcba07bb63548aa571de8d05260c2ef630f9a'),
              'SHA256SUMS.txt': (416, 'c7674d1a97b77b66adda12216f7d5e460f86da5cb07fd1d1f02bf3011b99c876'),
          }
          def identity(data):
              return {a['name']: (a['size'], a['digest'].removeprefix('sha256:')) for a in data['assets']}
          assert release['id'] == 422544367, 'WRONG existing release id'
          assert release['tag_name'] == 'processbus-sim-m3h-20261024'
          assert release['target_commitish'] == 'a4b6e53d0dbbcababc55ba8a4ff97ade6f2a6200'
          assert release['draft'] is False
          assert identity(release) == expected, 'REJECT unexpected changes to released assets'
          original = release['body']
          old = '**Public experimental engineering release:**'
          assert old in original or '**Public stable engineering lab simulator release:**' in original
          body = original.replace(old, '**Public stable engineering lab simulator release:**').replace('# ARStack Process Bus Simulator — M3.H Lab Edition (24 October 2026)', '# ARStack Process Bus Simulator M3.H — Stable Lab Simulator Edition (24 October 2026)')
          payload = {
              'name': 'ARStack Process Bus Simulator M3.H — Stable Lab Simulator Edition',
              'body': body,
              'draft': False,
              'prerelease': False,
              'make_latest': 'true',
          }
          Path('promotion.json').write_text(json.dumps(payload))
          Path('expected-assets.json').write_text(json.dumps(expected,sort_keys=True))
          print('Existing release confirmed, five asset SHA-256 digests pinned.')
          PY

      - name: Promote the SAME release metadata without uploading files
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/422544367" --input promotion.json > after.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > verified.json
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('verified.json').read_text())
          latest = json.loads(Path('latest.json').read_text())
          expected = json.loads(Path('expected-assets.json').read_text())
          actual = {a['name']: [a['size'],a['digest'].removeprefix('sha256:')] for a in r['assets']}
          expected = {name:list(values) for name,values in expected.items()}
          assert r['id'] == 422544367 and r['draft'] is False and r['prerelease'] is False
          assert 'Stable Lab Simulator Edition' in r['name']
          assert actual == expected, 'RELEASE ASSET DIGEST CHANGED'
          assert latest['id'] == r['id'], 'Stable M3.H is not the latest release'
          assert 'simulated' in r['body'].lower()
          print('PUBLIC STABLE PASS:', r['html_url'])
          print('Latest stable release:', latest['tag_name'])
          for name, data in sorted(actual.items()): print(name, data)
          PY
