name: Dynamic RCB Trial Harness CI

on:
  push:
    branches: ["agent/phase-4d-d2-dynamic-rcb-live-trial"]
  pull_request:
    paths:
      - 'tools/dynamic_rcb_trial/**'
      - 'include/ariec61850/mms/**'
      - 'src/mms/**'
      - 'include/ariec61850/control/**'
      - 'src/control/**'
      - 'include/ariec61850/asn1/**'
      - 'src/asn1/**'
      - 'include/ariec61850/osi/**'
      - 'src/osi/**'
      - 'include/ariec61850/acse/**'
      - 'src/acse/**'
      - '.github/workflows/dynamic-rcb-trial-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: ""
            cxx: ""
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S tools/dynamic_rcb_trial -B build-dynamic-rcb-trial -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-dynamic-rcb-trial --config Release --parallel
      - name: Help contract
        run: ctest --test-dir build-dynamic-rcb-trial -C Release --output-on-failure
