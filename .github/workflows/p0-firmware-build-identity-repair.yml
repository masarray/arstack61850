      - name: Review patch invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -R "firmwareBuildId" -n apps/arstack_studio/src apps/arstack_studio/qml/FirmwarePanel.qml
          grep -F 'build=%s boot_id=' embedded/esp32p4_smv_injector/main/live_control.cpp
          grep -F '"buildId": source_commit[:16].lower()' .github/workflows/esp32p4-smv-injector.yml
          grep -F 'same version stale build -> firmware update' apps/arstack_studio/src/DeterministicSessionHarness.cpp

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ARStack P0 Repair"
          git config user.email "actions@users.noreply.github.com"
          git add embedded/esp32p4_smv_injector apps/arstack_studio .github/workflows/esp32p4-smv-injector.yml
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "fix(p0): bind firmware updates to semantic build identity"
          git push origin HEAD:feature/ptp-production-v0.1.1
