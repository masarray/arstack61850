name: P0 Firmware Build Identity Repair

on:
  push:
    branches:
      - feature/ptp-production-v0.1.1
    paths:
      - '.github/workflows/p0-firmware-build-identity-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ptp-production-v0.1.1
          fetch-depth: 0

      - name: Apply production build identity contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected source block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Embedded build identity: one source-commit-derived ID, validated at configure time.
          replace_once(
              'embedded/esp32p4_smv_injector/CMakeLists.txt',
              'set(PROJECT_VER "0.1.1")\n\ninclude($ENV{IDF_PATH}/tools/cmake/project.cmake)\n',
              '''set(PROJECT_VER "0.1.1")

# Semantic firmware provenance. CI supplies the exact checkout commit; local
# builds fall back to the repository HEAD. The value is intentionally short,
# fixed-size hex so it is safe to expose on the bounded serial identity line.
if(DEFINED ENV{ARSTACK_FIRMWARE_BUILD_ID} AND NOT "$ENV{ARSTACK_FIRMWARE_BUILD_ID}" STREQUAL "")
    set(ARSTACK_FIRMWARE_BUILD_ID "$ENV{ARSTACK_FIRMWARE_BUILD_ID}")
else()
    execute_process(
        COMMAND git rev-parse --short=16 HEAD
        WORKING_DIRECTORY "${CMAKE_CURRENT_LIST_DIR}/../.."
        OUTPUT_VARIABLE ARSTACK_FIRMWARE_BUILD_ID
        OUTPUT_STRIP_TRAILING_WHITESPACE
        RESULT_VARIABLE ARSTACK_FIRMWARE_BUILD_ID_RESULT)
    if(NOT ARSTACK_FIRMWARE_BUILD_ID_RESULT EQUAL 0)
        set(ARSTACK_FIRMWARE_BUILD_ID "0000000000000000")
    endif()
endif()
string(TOLOWER "${ARSTACK_FIRMWARE_BUILD_ID}" ARSTACK_FIRMWARE_BUILD_ID)
if(NOT ARSTACK_FIRMWARE_BUILD_ID MATCHES "^[0-9a-f]{16}$")
    message(FATAL_ERROR "ARSTACK_FIRMWARE_BUILD_ID must be exactly 16 hexadecimal characters")
endif()
set(ARSTACK_FIRMWARE_BUILD_ID "${ARSTACK_FIRMWARE_BUILD_ID}" CACHE INTERNAL "ARStack semantic firmware build ID")

include($ENV{IDF_PATH}/tools/cmake/project.cmake)
''',
              'embedded build identity configure contract')

          replace_once(
              'embedded/esp32p4_smv_injector/main/CMakeLists.txt',
              'target_compile_features(${COMPONENT_LIB} PUBLIC cxx_std_20)\n',
              '''target_compile_features(${COMPONENT_LIB} PUBLIC cxx_std_20)
target_compile_definitions(${COMPONENT_LIB} PRIVATE
    ARSTACK_FIRMWARE_BUILD_ID="${ARSTACK_FIRMWARE_BUILD_ID}")
''',
              'embedded build identity compile definition')

          live = Path('embedded/esp32p4_smv_injector/main/live_control.cpp')
          text = live.read_text(encoding='utf-8')
          text = text.replace('"SMV-4I4V,LIVE-SETPOINTS,SESSION-LEASE,PTP-P2,SMPSYNCH-AUTO"',
                              '"SMV-4I4V,PROFILE,LIVE-SETPOINTS,SESSION-LEASE,PTP-P2,SMPSYNCH-AUTO"')
          text = text.replace('"SMV-4I4V,LIVE-SETPOINTS,PTP-P2,SMPSYNCH-AUTO"',
                              '"SMV-4I4V,PROFILE,LIVE-SETPOINTS,PTP-P2,SMPSYNCH-AUTO"')
          text = text.replace('"SMV-4I4V,LIVE-SETPOINTS,SESSION-LEASE"',
                              '"SMV-4I4V,PROFILE,LIVE-SETPOINTS,SESSION-LEASE"')
          text = text.replace('"SMV-4I4V,LIVE-SETPOINTS"',
                              '"SMV-4I4V,PROFILE,LIVE-SETPOINTS"')
          old = '''             "ARSTACK identity product=SMV-INJECTOR target=ESP32-P4 protocol=1 device_id=%02X%02X%02X%02X%02X%02X firmware=%s boot_id=%016llX capabilities=%s",
             static_cast<unsigned>(device_id[0]), static_cast<unsigned>(device_id[1]),
             static_cast<unsigned>(device_id[2]), static_cast<unsigned>(device_id[3]),
             static_cast<unsigned>(device_id[4]), static_cast<unsigned>(device_id[5]),
             version,
             static_cast<unsigned long long>(g_boot_id),
             capabilities);'''
          new = '''             "ARSTACK identity product=SMV-INJECTOR target=ESP32-P4 protocol=1 device_id=%02X%02X%02X%02X%02X%02X firmware=%s build=%s boot_id=%016llX capabilities=%s",
             static_cast<unsigned>(device_id[0]), static_cast<unsigned>(device_id[1]),
             static_cast<unsigned>(device_id[2]), static_cast<unsigned>(device_id[3]),
             static_cast<unsigned>(device_id[4]), static_cast<unsigned>(device_id[5]),
             version,
             ARSTACK_FIRMWARE_BUILD_ID,
             static_cast<unsigned long long>(g_boot_id),
             capabilities);'''
          if old not in text:
              raise SystemExit('live identity format block not found')
          live.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Build workflow: compile the same ID that is written to the manifest.
          replace_once(
              '.github/workflows/esp32p4-smv-injector.yml',
              '      - name: Build firmware\n        run: source /opt/esp/idf/export.sh && idf.py build\n',
              '''      - name: Build firmware
        run: |
          set -euo pipefail
          export ARSTACK_FIRMWARE_BUILD_ID="${GITHUB_SHA:0:16}"
          source /opt/esp/idf/export.sh
          idf.py build
          strings build/arstack_esp32p4_smv_injector.elf | grep -F "$ARSTACK_FIRMWARE_BUILD_ID" >/dev/null
          echo "Semantic firmware build ID: $ARSTACK_FIRMWARE_BUILD_ID"
''',
              'firmware build identity workflow')
          replace_once(
              '.github/workflows/esp32p4-smv-injector.yml',
              '              "version": os.environ["ARSTACK_FIRMWARE_VERSION"],\n              "protocol": int(os.environ["ARSTACK_PROTOCOL_VERSION"]),\n',
              '              "version": os.environ["ARSTACK_FIRMWARE_VERSION"],\n              "buildId": source_commit[:16].lower(),\n              "protocol": int(os.environ["ARSTACK_PROTOCOL_VERSION"]),\n',
              'manifest buildId')
          replace_once(
              '.github/workflows/esp32p4-smv-injector.yml',
              "          assert manifest['protocol'] == 1\n          assert 'PTP-P2' in manifest['capabilities']\n",
              "          assert manifest['protocol'] == 1\n          assert len(manifest['buildId']) == 16\n          assert manifest['sourceCommit'].lower().startswith(manifest['buildId'])\n          assert 'PROFILE' in manifest['capabilities']\n          assert 'PTP-P2' in manifest['capabilities']\n",
              'manifest buildId validation')

          # Typed device identity. Old identity lines remain parseable but are not
          # current when the package carries a non-empty expected build ID.
          replace_once(
              'apps/arstack_studio/src/DeviceController.hpp',
              '    QString firmwareVersion;\n    QString bootId;\n',
              '    QString firmwareVersion;\n    QString buildId;\n    QString bootId;\n',
              'DeviceIdentity buildId field')
          replace_once(
              'apps/arstack_studio/src/DeviceController.hpp',
              '            deviceId.isEmpty() && firmwareVersion.isEmpty() && bootId.isEmpty() &&\n',
              '            deviceId.isEmpty() && firmwareVersion.isEmpty() && buildId.isEmpty() && bootId.isEmpty() &&\n',
              'DeviceIdentity empty buildId')
          replace_once(
              'apps/arstack_studio/src/DeviceController.hpp',
              '    Q_PROPERTY(QString firmwareVersion READ firmwareVersion NOTIFY deviceIdentityChanged)\n    Q_PROPERTY(QString bootId READ bootId NOTIFY deviceIdentityChanged)\n',
              '    Q_PROPERTY(QString firmwareVersion READ firmwareVersion NOTIFY deviceIdentityChanged)\n    Q_PROPERTY(QString firmwareBuildId READ firmwareBuildId NOTIFY deviceIdentityChanged)\n    Q_PROPERTY(QString bootId READ bootId NOTIFY deviceIdentityChanged)\n',
              'DeviceController buildId property')
          replace_once(
              'apps/arstack_studio/src/DeviceController.hpp',
              '    [[nodiscard]] QString firmwareVersion() const;\n    [[nodiscard]] QString bootId() const;\n',
              '    [[nodiscard]] QString firmwareVersion() const;\n    [[nodiscard]] QString firmwareBuildId() const;\n    [[nodiscard]] QString bootId() const;\n',
              'DeviceController buildId getter')
          replace_once(
              'apps/arstack_studio/src/DeviceController.hpp',
              '    [[nodiscard]] static bool identitySupportsCurrentContract(\n        const DeviceIdentity& identity,\n        const QString& expectedFirmwareVersion);\n',
              '    [[nodiscard]] static bool identitySupportsCurrentContract(\n        const DeviceIdentity& identity,\n        const QString& expectedFirmwareVersion,\n        const QString& expectedBuildId = {});\n',
              'DeviceController current contract signature')

          replace_once(
              'apps/arstack_studio/src/DeviceController.cpp',
              '        "device_id=([A-Fa-f0-9]{12}) firmware=([0-9A-Za-z._+\\\\-]+) "\n        "(?:boot_id=([A-Fa-f0-9]{16}) )?capabilities=([A-Z0-9_,.\\\\-]+)"),\n',
              '        "device_id=([A-Fa-f0-9]{12}) firmware=([0-9A-Za-z._+\\\\-]+) "\n        "(?:build=([A-Fa-f0-9]{16}) )?"\n        "(?:boot_id=([A-Fa-f0-9]{16}) )?capabilities=([A-Z0-9_,.\\\\-]+)"),\n',
              'DeviceController identity regex buildId')
          replace_once(
              'apps/arstack_studio/src/DeviceController.cpp',
              'QString DeviceController::firmwareVersion() const { return identity_.firmwareVersion; }\nQString DeviceController::bootId() const { return identity_.bootId; }\n',
              'QString DeviceController::firmwareVersion() const { return identity_.firmwareVersion; }\nQString DeviceController::firmwareBuildId() const { return identity_.buildId; }\nQString DeviceController::bootId() const { return identity_.bootId; }\n',
              'DeviceController buildId getter implementation')
          replace_once(
              'apps/arstack_studio/src/DeviceController.cpp',
              '    parsed.firmwareVersion = match.captured(5);\n    parsed.bootId = match.captured(6).toUpper();\n    parsed.capabilities = match.captured(7).split(QLatin1Char(\',\'), Qt::SkipEmptyParts);\n',
              '    parsed.firmwareVersion = match.captured(5);\n    parsed.buildId = match.captured(6).toLower();\n    parsed.bootId = match.captured(7).toUpper();\n    parsed.capabilities = match.captured(8).split(QLatin1Char(\',\'), Qt::SkipEmptyParts);\n',
              'DeviceController identity captures')
          replace_once(
              'apps/arstack_studio/src/DeviceController.cpp',
              '''bool DeviceController::identitySupportsCurrentContract(
    const DeviceIdentity& identity,
    const QString& expectedFirmwareVersion) {
    static const QStringList requiredCapabilities{
        QStringLiteral("SMV-4I4V"),
        QStringLiteral("LIVE-SETPOINTS"),
        QStringLiteral("SESSION-LEASE"),
        QStringLiteral("PTP-P2"),
        QStringLiteral("SMPSYNCH-AUTO")};
    if (identity.product != QStringLiteral("SMV-INJECTOR") ||
        identity.target != QStringLiteral("ESP32-P4") ||
        identity.protocolVersion != QStringLiteral("1") ||
        identity.firmwareVersion != expectedFirmwareVersion ||
        identity.bootId.size() != 16) {
        return false;
    }
''',
              '''bool DeviceController::identitySupportsCurrentContract(
    const DeviceIdentity& identity,
    const QString& expectedFirmwareVersion,
    const QString& expectedBuildId) {
    static const QStringList requiredCapabilities{
        QStringLiteral("SMV-4I4V"),
        QStringLiteral("PROFILE"),
        QStringLiteral("LIVE-SETPOINTS"),
        QStringLiteral("SESSION-LEASE"),
        QStringLiteral("PTP-P2"),
        QStringLiteral("SMPSYNCH-AUTO")};
    const QString wantedBuild = expectedBuildId.trimmed().toLower();
    if (identity.product != QStringLiteral("SMV-INJECTOR") ||
        identity.target != QStringLiteral("ESP32-P4") ||
        identity.protocolVersion != QStringLiteral("1") ||
        identity.firmwareVersion != expectedFirmwareVersion ||
        (!wantedBuild.isEmpty() && identity.buildId.compare(wantedBuild, Qt::CaseInsensitive) != 0) ||
        identity.bootId.size() != 16) {
        return false;
    }
''',
              'DeviceController build-aware contract')

          # FirmwareManager reads buildId from the already-authoritative manifest.
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.hpp',
              'class FirmwareWorker;\n',
              'class DeterministicSessionHarness;\nclass FirmwareWorker;\n',
              'FirmwareManager harness forward declaration')
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.hpp',
              '    Q_PROPERTY(QString firmwareVersion READ firmwareVersion NOTIFY stateChanged)\n    Q_PROPERTY(QString expectedProtocol READ expectedProtocol NOTIFY stateChanged)\n',
              '    Q_PROPERTY(QString firmwareVersion READ firmwareVersion NOTIFY stateChanged)\n    Q_PROPERTY(QString firmwareBuildId READ firmwareBuildId NOTIFY stateChanged)\n    Q_PROPERTY(QString expectedProtocol READ expectedProtocol NOTIFY stateChanged)\n',
              'FirmwareManager buildId property')
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.hpp',
              '    [[nodiscard]] QString firmwareVersion() const { return firmwareVersion_; }\n    [[nodiscard]] QString expectedProtocol() const { return expectedProtocol_; }\n',
              '    [[nodiscard]] QString firmwareVersion() const { return firmwareVersion_; }\n    [[nodiscard]] QString firmwareBuildId() const { return firmwareBuildId_; }\n    [[nodiscard]] QString expectedProtocol() const { return expectedProtocol_; }\n',
              'FirmwareManager buildId getter')
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.hpp',
              'private:\n    enum class Operation { none, probe, flash, reset };\n',
              'private:\n    friend class DeterministicSessionHarness;\n    enum class Operation { none, probe, flash, reset };\n',
              'FirmwareManager harness friend')
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.hpp',
              '    QString firmwareVersion_{QStringLiteral("-")};\n    QString expectedProtocol_{QStringLiteral("-")};\n',
              '    QString firmwareVersion_{QStringLiteral("-")};\n    QString firmwareBuildId_;\n    QString expectedProtocol_{QStringLiteral("-")};\n',
              'FirmwareManager buildId storage')

          replace_once(
              'apps/arstack_studio/src/FirmwareManager.cpp',
              '    firmwareVersion_ = QStringLiteral("-");\n    expectedProtocol_ = QStringLiteral("-");\n',
              '    firmwareVersion_ = QStringLiteral("-");\n    firmwareBuildId_.clear();\n    expectedProtocol_ = QStringLiteral("-");\n',
              'FirmwareManager clear buildId')
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.cpp',
              '    const QString version = object.value(QStringLiteral("version")).toString().trimmed();\n    const QString revisionPolicy = object.value(QStringLiteral("chipRevisionPolicy")).toString().trimmed().toLower();\n',
              '    const QString version = object.value(QStringLiteral("version")).toString().trimmed();\n    const QString buildId = object.value(QStringLiteral("buildId")).toString().trimmed().toLower();\n    const QString sourceCommit = object.value(QStringLiteral("sourceCommit")).toString().trimmed().toLower();\n    const QString revisionPolicy = object.value(QStringLiteral("chipRevisionPolicy")).toString().trimmed().toLower();\n',
              'FirmwareManager parse buildId')
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.cpp',
              '        expectedHash.size() != 64 || version.isEmpty() || protocol < 1 || flashOffset != 0 ||\n        revisionPolicy != QString::fromLatin1(kPreV3Policy) || !productionCapabilities) {\n',
              '        expectedHash.size() != 64 || version.isEmpty() || protocol < 1 || flashOffset != 0 ||\n        !QRegularExpression(QStringLiteral("^[0-9a-f]{16}$")).match(buildId).hasMatch() ||\n        !sourceCommit.startsWith(buildId, Qt::CaseInsensitive) ||\n        revisionPolicy != QString::fromLatin1(kPreV3Policy) || !productionCapabilities) {\n',
              'FirmwareManager validate buildId')
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.cpp',
              '    firmwareVersion_ = version;\n    expectedProtocol_ = QString::number(protocol);\n',
              '    firmwareVersion_ = version;\n    firmwareBuildId_ = buildId;\n    expectedProtocol_ = QString::number(protocol);\n',
              'FirmwareManager store buildId')
          replace_once(
              'apps/arstack_studio/src/FirmwareManager.cpp',
              '    bundleStatus_ = QStringLiteral("Ready · firmware v%1 · ESP32-P4 pre-v3 · PTP-P2 · SHA-256 verified")\n        .arg(firmwareVersion_);\n',
              '    bundleStatus_ = QStringLiteral("Ready · firmware v%1 · build %2 · ESP32-P4 pre-v3 · PTP-P2 · SHA-256 verified")\n        .arg(firmwareVersion_, firmwareBuildId_);\n',
              'FirmwareManager bundle status buildId')

          # Supervisor remains the single mutation authority. Reinstall is just
          # another explicit operator intent into the existing firmware state machine.
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.hpp',
              '    Q_PROPERTY(bool firmwareUpdateRequired READ firmwareUpdateRequired NOTIFY stateChanged)\n    Q_PROPERTY(bool firmwareInstallRequired READ firmwareInstallVisible NOTIFY stateChanged)\n',
              '    Q_PROPERTY(bool firmwareUpdateRequired READ firmwareUpdateRequired NOTIFY stateChanged)\n    Q_PROPERTY(bool firmwareReinstallAvailable READ firmwareReinstallAvailable NOTIFY stateChanged)\n    Q_PROPERTY(bool firmwareInstallRequired READ firmwareInstallVisible NOTIFY stateChanged)\n',
              'SmartSession reinstall property')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.hpp',
              '    Q_PROPERTY(QString expectedFirmwareVersion READ expectedFirmwareVersion CONSTANT)\n    Q_PROPERTY(QString deviceFirmwareVersion READ deviceFirmwareVersion NOTIFY stateChanged)\n',
              '    Q_PROPERTY(QString expectedFirmwareVersion READ expectedFirmwareVersion CONSTANT)\n    Q_PROPERTY(QString expectedFirmwareBuildId READ expectedFirmwareBuildId NOTIFY stateChanged)\n    Q_PROPERTY(QString deviceFirmwareVersion READ deviceFirmwareVersion NOTIFY stateChanged)\n    Q_PROPERTY(QString deviceFirmwareBuildId READ deviceFirmwareBuildId NOTIFY stateChanged)\n',
              'SmartSession buildId properties')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.hpp',
              '    [[nodiscard]] bool firmwareUpdateRequired() const noexcept;\n    [[nodiscard]] bool firmwareInstallRequired() const noexcept;\n',
              '    [[nodiscard]] bool firmwareUpdateRequired() const noexcept;\n    [[nodiscard]] bool firmwareReinstallAvailable() const noexcept;\n    [[nodiscard]] bool firmwareInstallRequired() const noexcept;\n',
              'SmartSession reinstall getter')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.hpp',
              '    [[nodiscard]] QString expectedFirmwareVersion() const;\n    [[nodiscard]] QString deviceFirmwareVersion() const;\n',
              '    [[nodiscard]] QString expectedFirmwareVersion() const;\n    [[nodiscard]] QString expectedFirmwareBuildId() const;\n    [[nodiscard]] QString deviceFirmwareVersion() const;\n    [[nodiscard]] QString deviceFirmwareBuildId() const;\n',
              'SmartSession buildId getters')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.hpp',
              '    Q_INVOKABLE bool beginFirmwareUpdate();\n    Q_INVOKABLE bool beginFirmwareInstall();\n',
              '    Q_INVOKABLE bool beginFirmwareUpdate();\n    Q_INVOKABLE bool beginFirmwareReinstall();\n    Q_INVOKABLE bool beginFirmwareInstall();\n',
              'SmartSession reinstall intent')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.hpp',
              '    QString deviceFirmwareVersion_;\n    QString updatePort_;\n',
              '    QString deviceFirmwareVersion_;\n    QString deviceFirmwareBuildId_;\n    QString updatePort_;\n',
              'SmartSession device buildId storage')

          replace_once(
              'apps/arstack_studio/src/SmartSessionController.cpp',
              'bool SmartSessionController::firmwareUpdateRequired() const noexcept { return firmwareUpdateRequired_; }\n',
              '''bool SmartSessionController::firmwareUpdateRequired() const noexcept { return firmwareUpdateRequired_; }
bool SmartSessionController::firmwareReinstallAvailable() const noexcept {
    return device_ != nullptr && firmware_ != nullptr && device_->deviceVerified() &&
        firmware_->bundleReady() && !firmware_->busy() && !updateRequested_ && firmwareIsCurrent();
}
''',
              'SmartSession reinstall availability')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.cpp',
              'QString SmartSessionController::expectedFirmwareVersion() const { return QStringLiteral(ARSTACK_STUDIO_VERSION); }\nQString SmartSessionController::deviceFirmwareVersion() const { return deviceFirmwareVersion_; }\n',
              '''QString SmartSessionController::expectedFirmwareVersion() const { return QStringLiteral(ARSTACK_STUDIO_VERSION); }
QString SmartSessionController::expectedFirmwareBuildId() const {
    return firmware_ != nullptr ? firmware_->firmwareBuildId() : QString{};
}
QString SmartSessionController::deviceFirmwareVersion() const { return deviceFirmwareVersion_; }
QString SmartSessionController::deviceFirmwareBuildId() const { return deviceFirmwareBuildId_; }
''',
              'SmartSession buildId getters implementation')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.cpp',
              '''bool SmartSessionController::beginFirmwareUpdate() {
    if (device_ == nullptr || firmware_ == nullptr || !device_->deviceVerified() ||
        !firmware_->bundleReady() || firmware_->busy()) {
        return false;
    }
    return beginFirmwareOperation(device_->portName());
}
''',
              '''bool SmartSessionController::beginFirmwareUpdate() {
    if (device_ == nullptr || firmware_ == nullptr || !device_->deviceVerified() ||
        !firmware_->bundleReady() || firmware_->busy()) {
        return false;
    }
    return beginFirmwareOperation(device_->portName());
}

bool SmartSessionController::beginFirmwareReinstall() {
    if (!firmwareReinstallAvailable() || device_ == nullptr) return false;
    return beginFirmwareOperation(device_->portName());
}
''',
              'SmartSession reinstall operation')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.cpp',
              '            deviceFirmwareVersion_.clear();\n            profileSyncBootId_.clear();\n',
              '            deviceFirmwareVersion_.clear();\n            deviceFirmwareBuildId_.clear();\n            profileSyncBootId_.clear();\n',
              'SmartSession clear device buildId')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.cpp',
              '''void SmartSessionController::refreshFirmwareIdentity() {
    deviceFirmwareVersion_ =
        (device_ != nullptr && device_->deviceVerified()) ? device_->firmwareVersion() : QString{};
}

bool SmartSessionController::firmwareIsCurrent() const {
    return device_ != nullptr && device_->deviceVerified() &&
        DeviceController::identitySupportsCurrentContract(
            device_->deviceIdentity(), expectedFirmwareVersion());
}
''',
              '''void SmartSessionController::refreshFirmwareIdentity() {
    const bool verified = device_ != nullptr && device_->deviceVerified();
    deviceFirmwareVersion_ = verified ? device_->firmwareVersion() : QString{};
    deviceFirmwareBuildId_ = verified ? device_->firmwareBuildId() : QString{};
}

bool SmartSessionController::firmwareIsCurrent() const {
    return device_ != nullptr && device_->deviceVerified() &&
        DeviceController::identitySupportsCurrentContract(
            device_->deviceIdentity(), expectedFirmwareVersion(), expectedFirmwareBuildId());
}
''',
              'SmartSession build-aware current check')
          replace_once(
              'apps/arstack_studio/src/SmartSessionController.cpp',
              '''        const QString versionText = deviceFirmwareVersion_.isEmpty()
            ? QStringLiteral("legacy firmware")
            : QStringLiteral("firmware v%1").arg(deviceFirmwareVersion_);
        setPresentation(
            QStringLiteral("FIRMWARE UPDATE"),
            QStringLiteral("%1 detected. ARStack Studio v%2 is ready to update it.")
                .arg(versionText, expectedFirmwareVersion()),
            false,
            true);
''',
              '''        const QString versionText = deviceFirmwareVersion_.isEmpty()
            ? QStringLiteral("legacy firmware")
            : QStringLiteral("firmware v%1").arg(deviceFirmwareVersion_);
        const QString observedBuild = deviceFirmwareBuildId_.isEmpty()
            ? QStringLiteral("legacy/no build ID")
            : deviceFirmwareBuildId_;
        const QString packageBuild = expectedFirmwareBuildId().isEmpty()
            ? QStringLiteral("unknown")
            : expectedFirmwareBuildId();
        setPresentation(
            QStringLiteral("FIRMWARE UPDATE"),
            QStringLiteral("%1 build %2 detected. Studio package contains v%3 build %4; update is required before injection.")
                .arg(versionText, observedBuild, expectedFirmwareVersion(), packageBuild),
            false,
            true);
''',
              'SmartSession build mismatch presentation')

          # Advanced firmware panel submits intent to the supervisor only.
          panel = Path('apps/arstack_studio/qml/FirmwarePanel.qml')
          text = panel.read_text(encoding='utf-8')
          text = text.replace(
              '? "ARStack firmware v" + panel.firmware.firmwareVersion + " is verified in this Studio package"',
              '? "ARStack firmware v" + panel.firmware.firmwareVersion + " · build " + panel.firmware.firmwareBuildId + " is verified in this Studio package"')
          old = '''                Rectangle {
                    implicitWidth: 150
                    implicitHeight: 34
                    radius: 7
                    color: panel.firmware.busy ? panel.theme.accentSoft : panel.theme.raised
                    border.width: 1
                    border.color: panel.firmware.busy ? panel.theme.accent : panel.theme.line
                    Label {
                        anchors.centerIn: parent
                        text: panel.firmware.busy ? "SESSION OWNED" : "GUIDED ONLY"
                        color: panel.firmware.busy ? panel.theme.accent : panel.theme.textSoft
                        font.family: panel.uiFont
                        font.pixelSize: 9
                        font.weight: Font.Bold
                    }
                }
'''
          new = '''                CalmButton {
                    id: firmwareAction
                    theme: panel.theme
                    uiFont: panel.uiFont
                    implicitWidth: 172
                    text: panel.session && panel.session.firmwareUpdateRequired
                        ? "Update firmware"
                        : "Reinstall current"
                    visible: panel.session &&
                             (panel.session.firmwareUpdateRequired || panel.session.firmwareReinstallAvailable)
                    enabled: visible && !panel.firmware.busy
                    tone: panel.session && panel.session.firmwareUpdateRequired ? "accent" : "normal"
                    onClicked: {
                        if (panel.session.firmwareUpdateRequired)
                            panel.session.beginFirmwareUpdate()
                        else
                            panel.session.beginFirmwareReinstall()
                    }
                }

                Rectangle {
                    visible: !firmwareAction.visible
                    implicitWidth: 150
                    implicitHeight: 34
                    radius: 7
                    color: panel.firmware.busy ? panel.theme.accentSoft : panel.theme.raised
                    border.width: 1
                    border.color: panel.firmware.busy ? panel.theme.accent : panel.theme.line
                    Label {
