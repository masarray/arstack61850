name: Bug report
description: Report a problem with ARStack Studio, board connection, SCL import or an engineering tool
title: "Bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing ARStack! Short reports are welcome. Remove confidential details from screenshots and files. For security vulnerabilities, follow the private reporting process in [SECURITY.md](../../SECURITY.md) rather than creating a public issue.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you tried and what went wrong.
      placeholder: "I opened a .scd file, but the selected SV stream was not shown."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "I expected to see the SV ID and multicast address."
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: ARStack version
      description: See Help / About or the downloaded release.
      placeholder: "M3.H"
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - ARStack Studio (Windows / Linux)
        - ESP32-P4 firmware / device connection
        - SCL or engineering file import
        - IED Browser / Workbench
        - IED Simulator
        - SV / PTP traffic
        - Build / installation
        - Other
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot, logs or sample file (optional)
      description: You can drag a screenshot or sanitized sample here.
    validations:
      required: false
